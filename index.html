UkpIbFZJT0I4c29US21BdWlxM0FnZHhucUh0Z0RyZU9xdm1fQm04dHBSSk3SAXxBVV95cUxPeVhkQ19pRnlBT2tTRl9fZW56djRySFJlbWtrdV94OHJWTHIzeng0cUR1eTFoTlZUSUVjcGJma1J6NThkbEhOVjZwSnJSVHRndVJKSGxWSU9COHNvVEttQXVpcTNBZ2R4bnFIdGdEcmVPcXZtX0JtOHRwUkpN?oc=5","source":"머니투데이","summary":"시흥시의회가 농촌 지역의 심각한 인력난을 해소하기 위한 대책 마련에 나섰다.\n외국인 계절근로자 지원을 주요 내용으로 하는 관련 조례 제정을 추진한다.\n농촌 일손 부족 문제를 해결하고 근로자의 안정적인 고용 환경을 조성할 방침이다.\n근로자 처우 개선과 인권 보호를 위한 다양한 지원 기준이 담길 예정이다.\n조례가 제정되면 농가 경영 부담 완화와 지역 농업 활성화에 기여할 것으로 기대된다.","cardImagePath":"","category":"기타","hash":"32d1e38c29a869603040d18afb23c9fb3ebab8fc668183a6daeec3a1b1db55f7","industry":"일반·전체"},{"date":"2026-09-22","title":"[사회/고용] 베트남 건설·인프라 현장 인력난 심화…숙련 기능공·기술자 몸값 급등","link":"https://news.google.com/rss/articles/CBMicEFVX3lxTE1NTVZISGZ1bURxX2FMQjNwUTl5WU1JWXJRdFBlckZsdWd0eXJCSlZwbjcxS1FjZF9mNVZHYWw5SHJJdUdKTGdYV3FxM2xReHNqQnQ3ZkhjOVBjWEZyOEhWcGdCSi1NZmpRN1JLOVBZZ2o?oc=5","source":"굿모닝베트남미디어","summary":"베트남 건설 및 인프라 현장의 인력난이 갈수록 심화되고 있습니다.\n대규모 인프라 프로젝트 추진으로 현장의 인력 수요는 급증했습니다.\n특히 숙련 기능공과 전문 기술자의 수급 불균형이 매우 심각합니다.\n이에 따라 핵심 기술 인력의 인건비와 몸값이 급등하고 있습니다.\n건설업계는 인력 확보를 위해 임금 인상과 처우 개선에 나섰습니다.","cardImagePath":"","category":"기타","hash":"0496b1dda209f27207f4510fbb704a7f4d940cb677630f57533e5e389b02093f","industry":"일반·전체"},{"date":"2026-09-22","title":"고연선 상주시의원 \"소상공인 인력난 해소할 외국인력 제도 별도 마련해야\"","link":"https://news.google.com/rss/articles/CBMiVEFVX3lxTE1jWkFOaGJLLV9BdXRpVi0tbURMcEF1NVpiS1dqNTZVV1RvZkdCUFhmUjE5NGtiVWJGZVRmNnMtbDRWRXMyR2tfMWd5TU5keThuT1lOQw?oc=5","source":"타임뉴스","summary":"고연선 상주시의원이 지역 소상공인의 심각한 인력난 문제를 제기했다.\n현행 외국인력 제도는 소상공인의 실제 현장 수요를 반영하기 어렵다고 지적했다.\n소상공인 맞춤형 외국인력 도입 및 관리 제도를 별도로 마련할 것을 촉구했다.\n영세 사업자의 구인난을 해소해 고용 안정과 경영 부담 완화를 도모하고자 했다.\n이를 통해 지속 가능한 지역 상권 형성 및 지역 경제 활성화를 제언했다.","cardImagePath":"","category":"기타","hash":"17aea3d91fa304d191a15fb79c39f7c51cf369c6c4e3a185b02c77a4bbf9b1cc","industry":"일반·전체"},{"date":"2026-09-22","title":"마이클 페리 페르소나AI \"조선 등 중공업 현장 인력난⋯해법은 휴머노이드\"","link":"https://news.google.com/rss/articles/CBMiS0FVX3lxTE5aNWFZSkxZTC0xbVlpUkJQMk5KZGl1Z29uMGxWVDR2cUJLUGwwS3lPdUpWaV82cHRQSEhIc01SeXNNWVU1R1hyOEltVQ?oc=5","source":"아이뉴스24","summary":"조선업 등 중공업 산업 현장의 심각한 인력난 해결 방안이 주목받고 있다.\n페르소나AI의 마이클 페리는 인력 부족의 핵심 해법으로 휴머노이드 로봇을 제시했다.\n휴머노이드는 위험하고 고된 중공업 작업에 투입되어 인적 자원을 보완할 수 있다.\nAI와 로봇 공학의 융합은 산업 현장의 생산성과 안전성을 함께 향상시킬 것으로 기대된다.\n휴머노이드 기술의 중공업 적용은 지속 가능한 산업 생태계 구축의 발판이 될 전망이다.","cardImagePath":"","category":"기타","hash":"3ef2e65f10b1a13405fc7f7d070c94818c5af641958beeec464be4cb64d1b646","industry":"제조·자동차"},{"date":"2026-09-22","title":"청양군, 농촌 인력난 대응 AI 농사로봇 실증 추진","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE9iOEkwZ1BHcVNneElYdkp2T2N0SFV0azEtVXI4V1Q0VC1oZHRrWlFWckd6NUxZcDdNSHllb0ZPeS00TXBfZW5ZTjlySGJ3cGIyZ0hRVnp1ejRxVkhXb3dYa0YxWmduRkdXZmNESA?oc=5","source":"aflnews.co.kr","summary":"충남 청양군이 심각한 농촌 인력난과 고령화 문제에 대응하기 위해 나섰습니다.\n인공지능 기술을 접목한 농사로봇의 현장 실증 프로젝트를 본격적으로 추진합니다.\nAI 로봇을 통해 농작물 관리, 방제, 수확 등 핵심 농작업을 자동화할 계획입니다.\n이를 통해 농가의 노동 부담을 줄이고 농업 생산성을 크게 향상시킬 것으로 기대됩니다.\n청양군은 스마트 농업 기술 보급을 확대하여 지속 가능한 농촌 환경을 조성할 방침입니다.","cardImagePath":"","category":"기타","hash":"5322a51c737553e70e5038cef753a84cff8cbce65ded90a29581c6d657e2bbcf","industry":"일반·전체"},{"date":"2026-09-22","title":"“인력난 외면하고 노조 탄압” 이마트 신제주점 노조 반발","link":"https://news.google.com/rss/articles/CBMia0FVX3lxTE5mcWpNNlJoZ1pybGtxYms0eER6LXFTd0NFYTA0QXF0TFJRb1BvYmdaZEV4Vm1PVFpibEltekdRWXNuVUVGcEstcHdMejYxSGJoaGczVGF0emp0QjNkYWUwVzctVDZRbF8xSktV?oc=5","source":"제주의소리","summary":"이마트 신제주점 노동조합이 사측의 인력난 방치와 노조 탄압을 규탄하며 강력히 반발했습니다.\n노조는 만성적인 인력 부족으로 인해 직원들의 노동 강도가 한계에 도달했다고 지적했습니다.\n사측이 인력 충원 대신 노조 활동을 탄압하며 현장의 목소리를 외면하고 있다고 비판했습니다.\n노조는 즉각적인 현장 인력 충원과 부당한 노조 탄압 행위의 중단을 사측에 요구했습니다.\n요구가 받아들여지지 않을 경우 향후 투쟁 수위를 더욱 높여갈 것을 예고했습니다.","cardImagePath":"","category":"기타","hash":"7cd2b8b6fce11488e800770c9a1c7588c1f1cc17bddaaa61be3f94d2e7029074","industry":"일반·전체"},{"date":"2026-09-22","title":"“월 300만원 이상, 중국 동포 환영”…택시 인력난에 외국인 기사 ‘러브콜’","link":"https://news.google.com/rss/articles/CBMiW0FVX3lxTFB3OHNWMVZiSkRTVVczeVY3a0x1a1laQkw1RmhnbmNobXd6eDNPYWk0SUFCUmc3WmJyNHVrY0xiY1FETVZCM3dHU042ZUVKU19UQ1o1ODBTZS1DUEk?oc=5","source":"kyeonggi.com","summary":"심각한 택시 기사 구인난으로 인해 법인택시 업계의 운행 차질이 이어지고 있다.\n업계는 월 300만 원 이상의 급여를 제시하며 중국 동포 등 외국인 기사 유치에 나서고 있다.\n현재 외국인 노동자의 택시 운전 자격 취득에는 제도적 제약이 존재하는 상황이다.\n택시 업계와 일부 지자체는 인력난 해결을 위해 취업 비자 확대 및 규제 완화를 요구하고 있다.\n외국인 기사 도입에 대해 서비스 품질 유지와 승객 안전에 대한 사회적 논의가 진행 중이다.","cardImagePath":"","category":"기타","hash":"5d82f6113bfc00b11e4e92ebbae896a6270d67b99bfe4f2c563bef40eb54f046","industry":"일반·전체"},{"date":"2026-09-22","title":"기업 인력난·구직난 함께 푼다…경산 취업지원센터 문 열어","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE5ueVJDeDNDa0FEdFg2T0R1U0trY1lmZGtJMkFpZjRLNHJkMmlmdlkxVGtVOXBjc0ViN1JnXzc3dHpUem5RY2Vzai1vRGIxanM4V2RKaHZEVGMtUkhQNjh2VFEyQmdTM2pRTjlPdDVHSQ?oc=5","source":"kyongbuk.co.kr","summary":"경산시에 기업과 구직자를 연결하는 취업지원센터가 새롭게 문을 열었습니다.\n기업의 인력난과 구직자의 취업난을 동시에 해결하기 위해 마련되었습니다.\n센터는 맞춤형 일자리 정보 제공과 취업 상담 등 다양한 서비스를 운영합니다.\n지역 내 구직자에게는 일자리를, 기업에는 적합한 우수 인재를 연결해 줍니다.\n이번 개소를 통해 지역 고용 시장 안정과 경제 활성화가 기대됩니다.","cardImagePath":"","category":"기타","hash":"8f87fedf4bae4ee57b607ff5339da6d5a37aa0cfcb147da21f9555a6b53c92a6","industry":"일반·전체"},{"date":"2026-09-22","title":"양주시, 내년 생활임금 확정…올해보다 9.3% 인상","link":"https://news.google.com/rss/articles/CBMia0FVX3lxTE5DcXJrWGFWNEVxU2ViNWpPMnVJUGVLaUxRWTFjYS1pa0IxSE5PTUdjczZ5MzkzVE1Cb01tbU9nYng0TjVJaWNWZmt3VDZUMG1heXJyUUxucTdreHhKXzFyZjF2azA3SHZDOHdz?oc=5","source":"CNB뉴스","summary":"양주시가 내년도 적용할 생활임금을 최종 확정했습니다.\n내년 생활임금은 올해보다 9.3% 인상된 금액으로 결정되었습니다.\n이번 인상은 지역 근로자의 실질적인 생활 안정과 삶의 질 향상을 목적으로 합니다.\n확정된 생활임금은 양주시 소속 근로자 및 관련 기관 대상자에게 적용됩니다.\n시는 근로자의 복지 증진과 안정적인 노동 환경 조성을 지속해서 지원할 방침입니다.","cardImagePath":"","category":"기타","hash":"b8740cdcba23e888d1fc7e3f1ece414b3b732af3b112a967439391b9c64dacc9","industry":"일반·전체"},{"date":"2026-09-22","title":"성남시, 내년 생활임금 1만2900원…월 환산 269만6100원","link":"https://news.google.com/rss/articles/CBMic0FVX3lxTE50RlNaWVdkN1JUNjZfQTZiSjZfdXg0cUdWQVBzV1dMS3B2aksycTNPSzNzY1d5LVY4TUg5T1lMU2RSTm54VFp1VlJtMVBkNEJRT3JBbURHOFp2OW 22","title":"\"일은 늘고 사람은 떠난다\" 무역안보관리원 이직률 15.4%","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTFAtbWtiMndFcDBQMkJXcW9PaFkyU05OemZSRjRTZWUxdjh6eHE0WXNHWGk1Ti1QTXFtUXgyajhyZUN5X29fclEzcUhlV3U5d2hZd3NnZW9VZ1JLOTFZSTI2SW9xSXZEeE5KbE5vR1kzYw?oc=5","source":"대전일보","summary":"무역안보관리원의 이직률이 15.4%에 달하며 인력 유출 현상이 심화되고 있다.\n기술유출 방지와 수출통제 등 무역안보 관련 업무량은 대폭 증가했다.\n과중한 업무 부담과 열악한 처우 등이 직원들의 주요 이직 원인으로 지목된다.\n핵심 인재의 연쇄 이탈로 인해 무역안보 업무의 전문성 공백이 우려된다.\n인력 확충과 처우 개선 등 조직 안정화를 위한 종합적인 대책 마련이 시급하다.","cardImagePath":"images/20260922_213335_2.png","category":"기타","hash":"584afe54de0f2fb1325293f6d67c1883de9298f21344a54a20cdfb2387eeae96","industry":"일반·전체"},{"date":"2026-09-22","title":"한화오션 노사 24차 교섭도 결렬…정인섭 사장 \"당장 임금보다 장기적 결과 살펴야\"","link":"https://news.google.com/rss/articles/CBMiZEFVX3lxTE84c1AxbGxSWlJXLTd3OGJWNm9HRDNSQVFyRFN4emNkTG1ldW1wa1VZLXc4bzM4cU9pc0JNMHJPekt6RTBzUkszN1BvNVNZVkEtX3BNd1pHWUQxWm9zVXJUdW5nYTQ?oc=5","source":"디지털데일리","summary":"한화오션 노사의 제24차 임금 및 단체협약 교섭이 상호 합의에 이르지 못하고 결렬되었습니다.\n노사는 기본급 인상과 성과급 지급 등 주요 쟁점에서 합의점을 찾지 못했습니다.\n정인섭 사장은 당장의 임금 인상보다 회사의 장기적인 결실과 경쟁력 확보가 우선이라고 밝혔습니다.\n노조는 정당한 노동 대가와 실질적인 처우 개선을 요구하며 강하게 반발하고 있습니다.\n교섭 결렬로 인해 노사 간 갈등이 장기화하고 현장 파업 등 진통이 우려되는 상황입니다.","cardImagePath":"images/20260922_213335_1.png","category":"기타","hash":"745dab4bc23ef5b8fdfcfb2c300d3dff5749a5552c244cc3400b583af709ca62","industry":"일반·전체"},{"date":"2026-09-22","title":"장애인 채용장려금 부정수급 … 법원 \"6배 제재금 토해내야\"","link":"https://www.mk.co.kr/news/society/12158580","source":"매일경제 : 헤드라인","summary":"","cardImagePath":"","category":"채용","hash":"04e1674e149fdc4715300e1586d5005ce48616474fd8a98a6cc61c69c00268f8","industry":"일반·전체"},{"date":"2026-09-22","title":"[전문분야 이야기] 정년 후 재고용 관행이 ‘기대권’이 되는 때","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE9aRmY4VGR1TU1WOXV6dmlta1RQeWNhOW8xRnBrZkxYX2t3ZVFxeDMwX2tCd1Axd0kyZHRHaEgtdWR5MkxOcDBDUm81c3MxcE9UUURsT2pvVG5qSTVFTzV4RkcwX0dxUFJvZ0ZHQ0Nodw?oc=5","source":"법조신문","summary":"","cardImagePath":"","category":"기타","hash":"9df8a5e78 dff2e8b428520794b9ecf89","industry":"반도체"},{"date":"2026-09-22","title":"경북대병원 노사 임단협 잠정 합의…임금 3.5% 인상","link":"https://news.google.com/rss/articles/CBMiW0FVX3lxTE1UamtyQ0lBUVlIRm85VGJTMXpObUFZaE5oc0VCVm5lT1NwVW9xTU9RczFGVE11cnJwckpMX2ZBLUVvc0lZMzBjZ2hTNFVDdkhxd19fdHVYVk9KR2vSAWBBVV95cUxPSGdiU2pqdWpQcDg0SGFNcFFxbjZwcG42Y1pyTUNraTlkWDBPNWptaWNfYjJKekl5QXJ4SEdJckd1Vl8zYnkyR1lHMzBBUkw4UFNLTXRqSUM1eXhvc1I0blk?oc=5","source":"연합뉴스","summary":"경북대병원 노사가 올해 임금 및 단체협약에 잠정 합의했다.\n주요 합의 내용으로 총액 대비 임금 3.5% 인상이 포함되었다.\n노사는 근로환경 개선과 인력 충원 및 공공의료 강화에 합의했다.\n이에 따라 예상되던 의료 공백과 진료 차질을 피할 수 있게 되었다.\n잠정 합의안은 향후 조합원 찬반 투표를 거쳐 최종 확정된다.","cardImagePath":"","category":"기타","hash":"9a17a60ac4db326fdde3edc250cc5b3ed305cfe15934f2e795c76cd6d6cb07e9","industry":"일반·전체"},{"date":"2026-09-22","title":"[영상] 평균임금 431만원의 착시…반도체 성과급이 만든 '그들만의 잔치'","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTE8xSWRJNG8waTRoOV9oNkUyRzVac01uaEI4UnR0bnhLT2tQdGJtbEVYZ042OWc1MjZxajJLOFIwWmZFT2pELTRXYk13ejJZNlFYcGNMdktqd2QzRmVlb3djRDVuSDIxM0ZXRnc?oc=5","source":"nbn 시사경제","summary":"평균임금 431만 원 발표는 전체 근로자의 현실을 반영하지 못한 통계적 착시입니다.\n반도체 등 일부 대기업 직원의 대규모 성과급 지급이 전체 평균 수치를 크게 끌어올렸습니다.\n대기업과 중소기업 간 임금 격차가 더욱 벌어지며 노동 시장의 양극화가 심화되고 있습니다.\n대다수 일반 근로자들은 실질적인 소득 증가 없이 오히려 상대적 박탈감을 호소하고 있습니다.\n통계 착시 뒤에 숨은 실제 임금 격차를 해소하고 양극화를 완화할 정책적 대책이 시급합니다.","cardImagePath":"","category":"기타","hash":"f9d21710b61a00b785263e75ac058fb947aa259af6a865fb344f4f563fa9d8b0","industry":"반도체"},{"date":"2026-09-22","title":"네이버제트 노조, 23일 전면 파업 예고…임금 5.3% 인상 놓고 대립","link":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE90TzBnS3d6M3lTeFJvZk5pTHh2a1MzVUV3cGNKTzZ6WjlEbF9jOU5UUnotdlE4VTJpTHJrZjlDUjhTN2ZYZFBEREFFeFVER2pFQzhIU2FzRXdvR1FDOHVSM1FR?oc=5","source":"cwn.kr","summary":"네이버제트 노동조합이 사측과의 임금 협상 결렬로 전면 파업을 예고했다.\n이번 갈등은 평균 5.3% 수준의 임금 인상안을 둘러싼 노사 간 입장 차이에서 비롯됐다.\n노사 양측의 의견 대립이 지속되면서 교섭은 난항을 겪고 있다.\n노조는 합의에 이르지 못할 경우 오는 23일부터 전면 파업에 돌입한다는 방침이다.\n파업이 강행될 경우 메타버스 플랫폼 운영 등 관련 서비스에 차질이 예상된다.","cardImagePath":"","category":"기타","hash":"4456fce5a951cb09ae717a56d77eac9023054ea3a6d42240e32601ca5631ddd3","industry":"IT·플랫폼"},{"date":"2026-09-22","title":"직장인 평균 임금 432만 원…“반도체 성과급 효과”","link":"https://news.google.com/rss/articles/CBMiUkFVX3lxTFB5MV80VXhOTVRKeDJIcEU5WUlIaTRMb0dCNVhpRFF6MWVyczRzV0lYRjNvb2tqMVVYUGRvc0VFN0djd0JJdFdZalBWekVHME41VUE?oc=5","source":"더나은미래","summary":"직장인의 월평균 임금이 반도체 등 주요 기업의 성과급 지급에 힘입어 432만 원을 기록했습니다.\n특별급여의 대폭 증가가 전체 임금 상승을 이끌며 평균 금액을 끌어올린 주요 원인으로 분석됩니다.\n반도체 업황 회복 및 실적 개선에 따른 성과급 효과가 특정 업종을 중심으로 크게 작용했습니다.\n다만 대기업과 중소기업 간의 임금 격차는 여전히 유지되며 양극화 현상을 나타냈습니다.\n고물가 상황이 지속되면서 노동자가 실제로 체감하는 실질임금의 상승 폭은 제약적인 상황입니다.","cardImagePath":"","category":"기타","hash":"cb9b399c49006780204f653819d9466f0c13112a49ab948fc30fe1e7e329611e","industry":"반도체"},{"date":"2026-09-22","title":"정년·연금·계속 고용, 하나의 틀에서 논의해야 [왜냐면]","link":"https://news.google.com/rss/articles/CBMiZ0FVX3lxTE45RFZLTW55OUtRbUpjOWZpMDZOSmpKamFVejFVTTdRQkpycXRpTXRFaDE2SmhfbzdRMnJCcVZRaWVZbEZRSHBwUEt3Yy1MemlqNE9ZT00wRXJ6dkZBMno2bUhfSkM0Ymc?oc=5","source":"한겨레","summary":"초고령화 사회 진입으로 정년 연장과 연금 개혁에 대한 사회적 논의가 급증하고 있습니다.\n퇴직 후 연금 수급까지의 소득 공백 문제를 해결하기 위해 고용 연장이 필수적입니다.\n정년 연장, 계속 고용, 연금 개혁은 서로 연결되어 있어 개별 논의 시 정책 실효성이 떨어집니다.\n노후 소득 보장과 세대 간 상생을 위해 이들 과제를 하나의 통합된 틀에서 논의해야 합니다.\n지속 가능한 사회 보장 체계 구축을 위한 종합적인 사회적 대화 기구 마련이 필요합니다.","cardImagePath":"images/20260922_061018_5.png","category":"기타","hash":"0a18feb975622103f71035ba98ce5521042ca50982cdb0bbe67a8abd5414df93","industry":"일반·전체"},{"date":"2026-09-22","title":"\"日인구 10명 중 3명은 65세 이상 고령층\"... 정년연장 영향","link":"https://news.google.com/rss/articles/CBMicEFVX3lxTE1kZzZObVljeGFwWVRaSW9jOE8zVzIzX0xfVnV4R1pxTEZha3JHSnR2TnAyZ0NIUW9DVi03RmQwalY5NDNTUk5jYl9yVkxHR0VJQ192bDlIYlV5QUNtMUp6dk81eWFpbWRObE5BdHVvZ2_SAXBBVV95cUxNZGc2Tm1ZY3hhcFlUWklvYzhPM1cyM19MX1Z1eEdacUxGYWtyR0p0dk5wMmdDSFFvQ1YtN0ZkMGpWOTQzU1JOY2JfclZMR0dFSUNfdmw5SGJVeUFDbTFKenZPNXlhaW1kTmxOQXR1b2dv?oc=5","source":"글로벌경제신문","summary":"일본 전체 인구 중 65세 이상 고령층 비율이 30%에 육박하며 역대 최고치를 기록했다.\n일본은 세계 주요국 중 고령 인구 비중이 가장 높은 대표적인 초고령 사회이다.\n심각한 노동력 부족을 겪으면서 정년을 연장하거나 고령자를 재고용하는 기업이 늘었다.\n정년 연장의 영향으로 일하는 고령자 수와 고령층 취업률 모두 최대치를 경신했다.\n일본 정부와 기업은 인력난을 극복하기 위해 고령층의 경제 활동 참여를 지속 확대할 전망이다.","cardImagePath":"images/20260922_061018_4.png","category":"기타","hash":"f99b3e65ac4bf1ed092f7d72664ee0fe67534464923bf44d6b08f6f007a5f9cf","industry":"일반·전체"},{"date":"2026-09-22","title":"[브릿지 칼럼] 연공서열형 임금과 정년연장","link":"https://news.google.com/rss/articles/CBMiWkFVX3lxTFBUNEVzbjZ2TlhKMExpSWc5dXN2SllxMlVPc2pQOEthc0xzcnVlVnJLc2dpMzJ0V1FiMXlLWWlsbnpwQTRUWEhMVG5Xdmp6TFFIMEVyVHNabU4wUQ?oc=5","source":"브릿지경제","summary":"초고령사회 진입으로 중장년층의 고용 안정을 위한 정년연장 논의가 확대되고 있습니다.\n연공서열형 임금체계는 정년연장 시 기업의 인건비 부담을 크게 증가시키는 요인입니다.\n과도한 인건비 부담은 청년층의 신규 채용 축소로 이어질 수 있다는 우려가 존재합니다.\n정년연장의 안착을 위해서는 직무 및 성과 중심의 임금체계 개편이 선행되어야 합니다.\n노사 간 유연한 임금 협의를 통해 고용 안정과 기업 경쟁력의 상생을 도모해야 합니다.","cardImagePath":"images/20260922_061018_3.png","category":"기타","hash":"f50b56ea2cda500d14a4cdfee5853f517c5815cb69ac809f157293d6ea84f1c3","industry":"일반·전체"},{"date":"2026-09-22","title":"日인구 10명중 3명은 65세이상…정년연장에 노인 취업 역대 최다","link":"https://news.google.com/rss/articles/CBMiW0FVX3lxTE5lVzRGd0FfY3lPZVFkV3dfcjUyQ05xQWEtNEZ6Y1ByTkxURDVUQ2FnazllaDVHRWhaUTFKb1ZYTUQyN1Rjd2RRTzJCczhraDlLdGRwOXZHZEs4ZW_SAWBBVV95cUxNRXNNTmRmQ3haSnBQM1Z5NzNnTENYWVhQLU1QSFZmZEVlZ1Z5RnRKT3ZqeEtObFdmbmd2bWNlOHVVWUd4dGs4Rklid2lyQ0RZZXVoZERBS19JdnFVeFBmUG4?oc=5","source":"연합뉴스","summary":"일본의 65세 이상 고령 인구 비중이 30%에 육박하며 역대 최고치를 기록했습니다.\n고령 인구는 약 3천600만 명으로 세계 주요국 중 가장 높은 수준을 보였습니다.\n저출생에 따른 심각한 일손 부족으로 정부가 정년 연장과 재고용을 적극 추진했습니다.\n이에 따라 고령 취업자 수가 900만 명을 넘어서며 역대 최다 기록을 경신했습니다.\n고령층이 노동 시장의 핵심 인력으로 자리 잡으며 지속적인 경제 활동을 이어가고 있습니다.","cardImagePath":"images/20260922_061018_2.png","category":"기타","hash":"bd5fe75eb8db0fbf521a756a7beb3aa6840d994553fd3b9473a495c60eca72f9","industry":"일반·전체"},{"date":"2026-09-22","title":"65세 정년연장 ‘지지부진’ 지적…“상반기 중 입법하라” [쿡 정치포토]","link":"https://news.google.com/rss/articles/CBMiY0FVX3lxTE5wTFpNUWU5ZGFlREdidlFxWXNZelNLdFR2blZQYzlrQ3dDUHFSMmxrYlNaVHoxVG5acnU4QTVnQU5LcXNyalZvd0k0V3doVkVYZk5keHNYLUtDOTN0OXhBT0RH 자 채용을 지원한다.\n원활한 인력 수급을 도와 기업의 생산성을 높이고 경영 안정을 도모한다.\n외국인 인력 확보를 통해 지역 산업 경쟁력을 강화하고 경제에 활력을 불어넣는다.\n김천시는 앞으로도 기업 현장의 목소리를 반영해 맞춤형 지원을 확대할 방침이다.","cardImagePath":"","category":"채용","hash":"34ecca24aa1730dc10bacfdff1210944f906fc88c5e38c30b7722644ef2165eb","industry":"일반·전체"},{"date":"2026-09-21","title":"“산업 인력난 뚫는다”… 김천시, ‘찾아가는 외국인 비자 제도 설명회’ 큰 호응","link":"https://news.google.com/rss/articles/CBMiZ0FVX3lxTE5EWl9VS3RoVzh0Z1AyYzZJQk1ldG45dWNnTUhZYkxJWWFqUHB4OGpfMU9NN2c0VDFldnZseHM3bWd2aGRUblZKTlFpb3hJNXJBc2JwY3RVdzRqNVFLSXA0aTEzeUR5QzA?oc=5","source":"영남경제","summary":"김천시가 지역 산업계의 구인난 해소를 위해 적극적인 대책을 추진하고 있다.\n기업 현장을 직접 찾아가는 '외국인 비자 제도 설명회'를 마련했다.\n맞춤형 비자 제도 안내를 통해 외국인 근로자 채용에 필요한 실질적 정보를 제공했다.\n현장 중심의 행정 서비스가 제공되면서 참가 기업들로부터 높은 호응을 얻었다.\n시는 외국인 인력 활용 지원을 확대해 지역 산업체의 인력난을 계속 극복해 나갈 방침이다.","cardImagePath":"","category":"기타","hash":"826c4e0ff84735819b8d277565abd32da24f5a7920b4a08efa4c4f948d262330","industry":"일반·전체"},{"date":"2026-09-21","title":"[단독] 고령화에 법인택시 인력난… 빈 택시 핸들 잡는 외국인","link":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE5NZ291YWNqQWxHcWlmODg4WGI1S3QxOTNfLVNfMy1wTENBU1lwNjZzcUFlWFRqZlJnLUlCUE9TcEZKOC10ck1wU1BKTkxNa0RNZDZnZC1FanBHVW0xVFRaTU5R?oc=5","source":"seoul.co.kr","summary":"고령화와 기사 유출로 법인택시 업계의 인력난이 심화되고 있습니다.\n운전기사가 부족해지면서 가동을 멈춘 빈 택시가 늘어나는 실정입니다.\n심각한 구인난을 해소하기 위해 외국인 기사를 도입하는 방안이 추진됩니다.\n외국인 인력 활용을 통해 빈 택시의 가동률을 다시 높이려는 취지입니다.\n안전성 확보와 승객과의 소통 문제 해결 등 체계적인 대비가 요구됩니다.","cardImagePath":"","category":"기타","hash":"e82b26c60e645cde6f04c15024675854192e0593ec6559671eb73691b060220e","industry":"일반·전체"},{"date":"2026-09-21","title":"반도체 보너스가 이끈 상반기 임금 상승, 전자·통신업 급여 '고공행진'","link":"https://news.google.com/rss/articles/CBMiaEFVX3lxTE1FMHl0Um9iS2pBX3V4YWVXT1FlWC04Q3ZzZkxfbVF3ZlUzdzRwcWFhZmhMQ2stdS1vLUoxVUdkMXA0OHA0UU9vT0dtcFBfSGlNM3ItUUdONEVaY081VU1ySmNrdG92WXF6?oc=5","source":"공감신문","summary":"올해 상반기 반도체 업계의 대규모 성과급 지급이 전체 임금 상승을 견인했습니다.\n전자와 통신 업종을 중심으로 주요 기업들의 평균 급여가 크게 치솟았습니다.\n반도체 업황 회복에 따른 특별 보너스가 상여금 증가의 주요 원인으로 분석됩니다.\n이에 따라 고실적 IT·전자 산업과 다른 업종 간의 임금 격차가 더욱 벌어졌습니다.\n상반기 임금 고공행진은 첨단 제조업의 실적 호조가 주도한 것으로 나타났습니다.","cardImagePath":"","category":"기타","hash":"5ef0a83018776ef36a217ca852f76c9d3fcd5c4d5becb515dbc227d759c8036c","industry":"반도체"},{"date":"2026-09-21","title":"근로자 월평균 임금 431.8만원…반도체 특별급여가 견인","link":"https://news.google.com/rss/articles/CBMiZEFVX3lxTE9jYlJkWEZMeV9YVGJNRmZxOHpQWWVJVnVJQ29HYmVrbUlBMmNBWGdMZm9YSGFyNVBkcmFEZFp0c1FFWS1YZ09ncElnZDdONjlDUS11MzYwQmZORVg5ZTAzVFJ1R0w?oc=5","source":"아시아경제","summary":"최근 국내 근로자의 월평균 임금이 431만 8천 원을 기록했습니다.\n반도체 등 주요 대기업의 특별급여 지급이 전체 임금 상승을 이끌었습니다.\n실적 개선에 따른 성과급 지급으로 전년 동기 대비 임금 상승 폭이 확대되었습니다.\n상용근로자의 임금 증가가 전체 평균 임금 수준을 크게 끌어올렸습니다.\n업종별 실적 차이에 따라 임금 상승률과 급여 격차가 지속되고 있습니다.","cardImagePath":"","category":"기타","hash":"7b87dfeb115222a17353fc3216e8defed51a02bddc8de172422e3aee00aa4585","industry":"반도체"},{"date":"2026-09-21","title":"근로자 평균임금 상반기에만 3.1% 올랐다…반도체가 멱살잡고 견인","link":"https://news.google.com/rss/articles/CBMiRkFVX3lxTE9kRDN5VVRLWS1rSXlsQWhIOHE0eUFZVTJiVURHUERFU0dtanZaSHRzYnluQVlrOE1jVnB2NzBtUmY3V01rZWc?oc=5","source":"mk.co.kr","summary":"올해 상반기 근로자 평균임금이 지난해 같은 기간보다 3.1% 상승했습니다.\n반도체 업황 회복에 따른 대기업의 성과급 지급이 전체 임금 상승을 견인했습니다.\n제조업을 포함한 주요 업종의 특별급여 증가가 전체 상승세에 큰 영향을 미쳤습니다.\n다만 지속되는 고물가 여파로 근로자의 실질임금 상승 폭은 제한적이었습니다.\n대기업과 중소기업 간 성과급 차이로 인해 사업체 규모별 임금 격차는 더욱 벌어졌습니다.","cardImagePath":"","category":"기타","hash":"17b5cdca9f6c58dfab0a86067cb5a773eee597780b309ab7a3b0d95012ab3d3e","industry":"반도체"},{"date":"2026-09-21","title":"반도체 성과급이 끌어올린 임금…월평균 432만원 뚫어","link":"https://news.google.com/rss/articles/CBMiRkFVX3lxTE5xM0otNS04SG5NbzBtN1ZhSEZjTHpQQmJGb3YzTzFYTEl0bTZUSWtBNkQ3WWpwNXdOeGpBVEYyc0JDMk1OdkE?oc=5","source":"v.daum.net","summary":"반도체 등 주요 기업의 성과급 지급 영향으로 근로자 월평균 임금이 상승했습니다.\n상반기 근로자 월평균 임금이 역대 처음으로 432만 원을 돌파했습니다.\n정기 급여 상승보다 반도체 관련 특별 급여 지급이 전체 임금 증가를 주도했습니다.\n명목 임금 증가에 따라 고물가 상황에서도 실질 임금이 다소 회복세를 보였습니다.\n대기업과 중소기업 간 성과급 차이로 인한 임금 격차 문제는 여전히 과제로 남았습니다.","cardImagePath":"","category":"기타","hash":"7ab8b42f070bdbdb39e80c6ac104680df2432f1f3cb5310962aac321edab086a","industry":"반도체"},{"date":"2026-09-21","title":"경총 \"상반기 임금 3.1% 올라…인상분 32%는 반도체 성과급 영향\"","link":"https://news.google.com/rss/articles/CBMiVEFVX3lxTFBic2xheUlGY0ZIc0RLTjFkaTVKYjh2amZkQ2FQanFFRkpWU2VELWxScmttekRLZ0l3aGJvT3Rrc3k3TEp4aGxaT21zY0I5Q09idWJOWA?oc=5","source":"v.daum.net","summary":"올해 상반기 근로자 월평균 임금 인상률은 전년 동기 대비 3.1%를 기록했습니다.\n전체 임금 인상분 중 약 32%는 반도체 업종의 성과급 등 특별급여 증가에 기인했습니다.\n정액급여보다 반도체 관련 전자부품 제조업의 성과급 급증이 전체 상승을 이끌었습니다.\n성과급 지급 규모 차이로 인해 대기업과 중소기업 간 임금 격차는 여전히 크게 나타났습니다.\n한국경영자총협회는 경기 변동에 따른 성과급 착시 효과를 경계해야 한다고 분석했습니다.","cardImagePath":"","category":"기타","hash":"b3fba13070880d3891daf29d7703384ff1621886cf5277219b7e5324d1c85163","industry":"반도체"},{"date":"2026-09-21","title":"“올해 상반기 임금 총액 3.1% 인상”…인상분의 32.4%는 ‘전자·통신업’","link":"https://news.google.com/rss/articles/CBMiRkFVX3lxTFBHM3YyWG4xTUlBZWtoQ1Z5UmtqMW5WNHk5ckQwY0tRWjRfR3lxMnpzSnhDWklFSElnX3JiS183enFZLTZhM3c?oc=5","source":"v.daum.net","summary":"올해 상반기 국내 기업들의 임금 총액이 전년 동기 대비 평균 3.1% 인상되었다.\n전체 임금 인상분 가운데 전자 및 통신업이 32.4%를 차지하며 성장을 주도했다.\n실적 개선에 따른 성과급 지급과 기술 인력 확보 경쟁이 해당 업종의 임금 상승을 이끌었다.\n특정 업종 중심의 임금 상승으로 인해 업종 간 임금 격차가 더욱 벌어진 것으로 나타났다.\n고물가 기조가 이어지면서 근로자가 체감하는 실질 임금의 개선 폭은 제한적일 것으로 전망된다.","cardImagePath":"","category":"기타","hash":"154814d58285c07ec0992841877b77d2bc8f1c63ebbc0b49bc602b8bac7fea7c","industry":"일반·전체"},{"date":"2026-09-21","title":"상반기 임금 3.1% 상승…전자·통신업 특별급여가 인상분 32% 견인","link":"https://news.google.com/rss/articles/CBMiXkFVX3lxTE5pbUEtU1pxbGRiNnFHWEpzQjBhWGp2NGRSQ2ZYSnhPZG90NVB5dTNYdjg3RU83SGdlaV85bWhCUWZ4aHE5cXFEam5Va29ndHhvMlYzU0p5azM1NGQ1dEE?oc=5","source":"뉴스투데이","summary":"올해 상반기 근로자 월평균 임금이 전년 동기 대비 3.1% 상승했습니다.\n이번 상승세는 전자 및 통신업 분야의 특별급여 증가가 주도했습니다.\n전자·통신업의 특별급여 인상액은 전체 임금 인상분의 약 32%를 차지했습니다.\n주요 IT 및 제조업의 실적 개선으로 인한 성과급 지급이 주요 인상 요인으로 작용했습니다.\n정액급여의 완만한 증가 속에서 특정 업종의 특별급여가 전체 임금 상승률을 끌어올렸습니다.","cardImagePath":"images/20260921_061217_5.png","category":"기타","hash":"8d04a7ce9478a30e076cd8a3b25a12221d4cbd6255c7e2c6c0641a859e62a9fc","industry":"일반·전체"},{"date":"2026-09-21","title":"“대기업 650만원·중소기업 382만원”…반도체 성과급에 상반기 임금 격차 더 벌어졌다","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE1LeHlzem5RRVhEM3FxQzBpdEZHcERYY2NGYVlpd1o1SUpxX1ZHM3ZfT295SlVaV1VwWW1idTRBY0U2V1lzcU14VFRwWm9HRVVZOERHMi1yNXVFeHNHZVRhS3JxZ0RSTE5KZ1M2azZXaw?oc=5","source":"진일보","summary":"올해 상반기 대기업과 중소기업 간의 임금 격차가 더욱 벌어졌습니다.\n대기업의 월평균 임금은 650만 원인 반면 중소기업은 382만 원에 그쳤습니다.\n반도체 등 주요 대기업의 성과급 지급이 늘어난 것이 격차 확대의 주요 원인입니다.\n중소기업의 임금 상승세는 이에 미치지 못해 임금 양극화 현상이 심화되었습니다.\n양측의 격차를 줄이고 노동 시장의 이중구조를 완화하기 위한 방안 마련이 시급합니다.","cardImagePath":"images/20260921_061217_4.png","category":"기타","hash":"d0de1c1ff4ea0a209b5d738ebae1b12c018e0cadcdc2054ebe871fea3f2d1116","industry":"반도체"},{"date":"2026-09-21","title":"전자·통신업 상반기 월평균 임금 943만원…지난해보다 23% 올라","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTE5BUnhnZ3RTdmpqUzMyRURrQmE5d3pjSEhTdUxGZjZUN21HbE1sZ01GOXp4M0I3MXkwTUlNekt6MnBVY2pKaXBtSDNVU1djenZ6QVZaMDVlQ2xyMm82clhEbGM0VmlndTFhZGc?oc=5","source":"hani.co.kr","summary":"올해 상반기 전자 및 통신업의 임금 수준이 크게 올랐습니다.\n해당 업종의 상반기 월평균 임금은 943만원을 기록했습니다.\n이는 지난해 같은 기간과 비교하여 23% 상승한 수치입니다.\n전자·통신 분야는 높은 수준의 월급과 높은 증가율을 동시에 나타냈습니다.\n관련 업계의 상반기 임금 성장세가 매우 뚜렷하게 확인되었습니다.","cardImagePath":"images/20260921_061217_3.png","category":"기타","hash":"42ec0717e05c1fc23b9233f97f1cf3de8bcd4ab521a2ab206038b72d7e51018d","industry":"일반·전체"},{"date":"2026-09-21","title":"상반기 임금 3.1%↑…상승분 3분의 1은 반도체 성과급","link":"https://news.google.com/rss/articles/CBMiRkFVX3lxTFBQQ2NUSUoyTzhwOEZVREdlODBEY1lHUDYyYUhpZnRMWnE0OVZZdk12bTZNbFlMWWdmVXJQMk80NmhDTjBJWFE?oc=5","source":"v.daum.net","summary":"올해 상반기 근로자 월평균 임금이 지난해 같은 기간보다 증가했습니다.\n전체 임금 상승분 가운데 3분의 1은 반도체 기업의 성과급 지급 영향이었습니다.\n반도체 실적 개선에 따른 특별급여 증가가 전체 임금 오름세를 이끌었습니다.\n대기업의 성과급 확대 영향으로 사업체 규모별 임금 격차는 여전히 크게 나타났습니다.\n고물가 영향으로 실질임금 상승 폭은 제한적이어서 근로자가 체감하는 임금 개선은 미미했습니다.","cardImagePath":"images/20260921_061217_2.png","category":"기타","hash":"7a6271c2612397b2eef81d3421b91990ed30b8e17dc6b5c4caafe24ab9510555","industry":"반도체"},{"date":"2026-09-21","title":"올 상반기 근로자 임금 3.1% 올랐지만 착시…반도체 `특별 성과급` 잔치 영향","link":"https://news.google.com/rss/articles/CBMiZEFVX3lxTE1FTDRjYlZFNTVmSkVGbW1fTGQ0UjNWckFpY3B2R0FpcFAyS3hRWXZWakVBZy0yQVpjdGJaNzU3SS1UeVNzeVp5QkNhb3JWVGx6c1J2ZFRZTjBXRWFmWXpzLWZlMC0?oc=5","source":"디지털데일리","summary":"올해 상반기 근로자의 평균 임금이 전년 동기 대비 증가한 것으로 집계되었습니다.\n이번 임금 상승은 반도체 업계의 대규모 특별 성과급 지급이 주된 원인입니다.\n대기업의 성과급 착시 효과로 인해 전체 평균 임금 지표가 크게 왜곡되었습니다.\n물가 상승의 영향으로 근로자가 실제 체감하는 실질 임금 상승은 미미합니다.\n업종 및 기업 규모 간의 임금 격차가 커지며 양극화 현상이 가중되고 있습니다.","cardImagePath":"images/20260921_061217_1.png","category":"기타","hash":"7f328c027a993884487fcf631f56b4b463a14cc57ace6cedf5f278ac8b7d5c4c","industry":"반도체"},{"date":"2026-09-20","title":"한국강소기업협회–케이핌스(K-FIMS), 외국인 인력난 해소·글로벌 인재 관리 위해 업무협약 체결","link":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE5FZUtxcnpPc3FrbnJuX2tXLXpCV1luMVB4eTlqeWY4ZEpyYWE4bHhieXp0RzhEZXFNSjBuSjFBTENTU2I1UmgzRWxnM2plSTR3N0pZ?oc=5","source":"유스연합","summary":"한국강소기업협회와 케이핌스(K-FIMS)가 업무협약을 체결했다.\n이번 협약은 강소기업의 외국인 인력난 해소를 목적으로 추진되었다.\n양 기관은 체계적인 글로벌 인재 관리를 위해 협력하기로 했다.\n외국인 전문 인력의 효율적 공급과 인재 지원 관리 체계를 다질 예정이다.\n이를 통해 국내 강소기업의 인력 부족 문제를 완화하고 경쟁력을 강화할 것으로 기대된다.","cardImagePath":"images/20260920_060850_2.png","category":"기타","hash":"b0a3dfa4fdb064512f257ff85b1020c3c724742b4fb62233121c8dec60e531f1","industry":"일반·전체"},{"date":"2026-09-20","title":"세아베스틸 임단협 극적 타결…임금 3.7%↑·격려금 역대 최대","link":"https://news.google.com/rss/articles/CBMiWkFVX3lxTE51LUdpazRnMGVESmhQQkdlT0sxVm9aOXNOZGtWMzk4VGFmYXgtWnRYbGJfTk9iaTNpRU5JcUlCMTkxLXRrVkNqeXV3dHNLNktIUHlJM0tFSmhxd9IBWEFVX3lxTE0zSlIwb2tUa29MOVprMnNvQV8wdXZZQWEzNmw0Wm5Ka1V0Q1NTRlZ1ZzRyWmZ4c0lQX1Y3a0ZHZGpxbzUxMVVvNmdJeTgwYjJPbmFaWDdJdVU?oc=5","source":"아주경제","summary":"세아베스틸 노사가 오랜 진통 끝에 임금 및 단체협상을 극적으로 타결했다.\n노사 합의에 따라 올해 기본급은 3.7% 인상하기로 결정되었다.\n직원들에게는 지급 기준상 역대 최대 규모의 격려금이 지급된다.\n노사는 상생과 협력을 바탕으로 노사 갈등을 해소하고 합의를 이끌어냈다.\n이번 임단협 타결을 통해 안정적인 공장 가동과 생산성 향상이 기대된다.","cardImagePath":"images/20260920_060850_1.png","category":"기타","hash":"27690aa6a9921af5734ebea0227cd931d7ff62074fe1295bacfa0771236f3984","industry":"일반·전체"},{"date":"2026-09-19","title":"\"취업 문 열고, 인재 만나고\" 제2회 부산진구·부산상의 채용박람회 성황리 개최 |","link":"https://news.google.com/rss/articles/CBMidkFVX3lxTFBXR1dvOGtySk91aXd2NnZqOGphYm1iWEF5UnQ0aENmRDl5Wlh4ZlVzSHcwOUFYcmFocFZLUE1HMnZCdDJQX1pKY2E3eGk2Q29ua3NIZzhLUFJzcFJINzNXRkF2OVZWeEtKSDEyRnRWTUhoZ1NuSFE?oc=5","source":"LG헬로비전","summary":"부산진구와 부산상공회의소가 주최한 제2회 채용박람회가 성공적으로 개최되었다.\n이번 행사는 지역 구직자의 취업 기회를 확대하고 기업의 인재 채용을 돕기 위해 마련되었다.\n박람회 현장에서는 구직자와 구인 기업 간의 직접적인 상호 소통이 이루어졌다.\n참여 기업들은 다양한 채용 정보와 현장 면접 기회를 구직자들에게 제공했다.\n많은 인원이 방문하며 인재 발굴과 일자리 창출의 성과를 거두고 성황리에 마쳤다.","cardImagePath":"images/20260919_151846_1.png","category":"채용","hash":"683b8d4017cc9638e8687be03eb7b8fd83aaaf52af5c18ff959fb7989a008fc1","industry":"일반·전체"},{"date":"2026-09-19","title":"“나 지상파 공채 개그맨이야” 술집 난동 남성, 알고 보니 사칭이었다","link":"https://www.mk.co.kr/news/society/12157098","source":"매일경제 : 헤드라인","summary":"한 남성이 술집에서 자신이 지상파 공채 개그맨이라고 주장하며 난동을 부렸습니다.\n해당 남성은 개그맨 신분을 내세워 업주와 손님들에게 행패를 부린 것으로 알려졌습니다.\n하지만 신원 확인 결과 이 남성의 주장은 거짓이었으며 개그맨을 사칭한 것으로 밝혀졌습니다.\n경찰은 남성의 지상파 개그맨 사칭 경위와 술집 내 난동 정황을 조사했습니다.\n경찰은 사칭 행위로 피해를 준 남성에 대해 법적 책임을 물어 사법 처리할 방침입니다.","cardImagePath":"images/20260919_150054_3.png","category":"기타","hash":"df3728be03a6b36392631f7a6e6c0a3da00bf350b9953b437c8a7da291e6160f","industry":"일반·전체"},{"date":"2026-09-19","title":"부산진구 채용박람회 ‘취업 열기’… 구직자 640여명 몰렸다","link":"https://news.google.com/rss/articles/CBMiT0FVX3lxTFA0cVg0aDVmQzBGX1dnT2FsaGJFcGdtVHNhaGpBNjFFcTF6OTJCZk5RTFEwSTZabktqeDBmcjMydEtuLWFtSUFqRXU5SktOZEU?oc=5","source":"v.daum.net","summary":"부산진구에서 채용박람회가 개최되었다.\n박람회 현장은 뜨거운 취업 열기를 보였다.\n여 명의 구직자가 박람회 현장에 몰려들었다.\n해당 기사는 다음 및 구글 뉴스를 출처로 하고 있다.\n제공된 본문에는 제목 외에 추가적인 세부 내용이 포함되어 있지 않다.","cardImagePath":"images/20260919_150054_2.png","category":"채용","hash":"71ffacd90f804abb481459629360aee295defea37a95584dcc82e3ffe28ba93a","industry":"일반·전체"},{"date":"2026-09-19","title":"인천공항 2터미널 '캐리어 실종' 26개…보안 인력난에 추석 비상 : 기업·산업","link":"https://news.google.com/rss/articles/CBMiSkFVX3lxTE1uczd1N0tPQmZRaE9RdW5TemhzbUx3TWE2RzlxbXB :"2026년 제2회 부산진구 채용박람회 성료","link":"https://news.google.com/rss/articles/CBMiSkFVX3lxTE96aGFBdHlVZERlZ3FjMUNYVDlqOW5oaEFpNDZDSDdlcERMUDJTT0lMRHdoV045d3FyMDgyUlMzQkx2WHU5bGoxRURB?oc=5","source":"mediatoday.asia","summary":"부산 부산진구가 구직자의 취업 기회 확대와 기업의 구인난 해소를 위한 채용박람회를 성공적으로 마쳤다.\n행사 현장에서는 구직자와 구인 기업 간 일대일 맞춤형 면접과 일자리 정보 제공이 활발히 이루어졌다.\n지역 내 우수 기업들이 직접 참여하여 현장 채용을 진행하며 구직자들의 큰 관심과 참여를 이끌어냈다.\n이력서 컨설팅 및 취업 지원 프로그램 등 구직 실무에 실질적인 도움을 주는 부가 서비스도 함께 제공되었다.\n부산진구는 앞으로도 다양한 고용 지원 사업을 추진하여 지역 일자리 활성화에 적극 나설 방침이다.","cardImagePath":"","category":"채용","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"명절 인력난이 앞당긴 외식업 무인화","link":"https://news.google.com/rss/articles/CBMiaEFVX3lxTE9qclo4TFJ4emc3SFZ4N1Vpeks5ZVBuWC02ZUtDbEpIY3g0LXU0ZUNweGpYMFJtQWtGUWpLOVhoX0Z1RkREUDZ5eE5wT2JGbXZPMERFN0FqWGx3UEZBUXYxSjQ3dFc4dkxF?oc=5","source":"gokorea.kr","summary":"명절 연휴 기간 외식업계의 심각한 구인난이 지속되고 있습니다.\n인건비 상승과 인력 확보의 어려움으로 매장 운영에 차질을 겪고 있습니다.\n이를 해결하기 위해 서빙 로봇과 키오스크 등 무인 시스템 도입이 가속화됩니다.\n무인화 기술은 인력 공백을 메우고 매장 운영 효율성을 크게 높이고 있습니다.\n명절 인력난으로 시작된 외식업계의 무인화 흐름은 계속 확대될 전망입니다.","cardImagePath":"","category":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"홍콩 실업률 3.8%로 상승…인력난 속 고용 불일치 심화","link":"https://news.google.com/rss/articles/CBMidEFVX3lxTE5aRGEwVWZZMElUUVFPZEt0TnR5UjBDeWlWdUx6b2dYdmN1RVZCZWJMTmVGb2lxRExTYVB5RUtSUTFXdzAzSUNXeXJ2OXBkYkpSLWppWmJndGJ0TE5HY01iQXlZcTN1NUcySHVoMDQ5NzBtRGxG0gF0QVVfeXFMTlpEYTBVZlkwSVRRUU9kS3ROdHlSMEN5aVZ1THpvZ1h2Y3VFVkJlYkxOZUZvaXFETFNhUHlFS1JRMVd3MDNJQ1d5cnY5cGRiSlItamlaYmd0YnRMTkdjTWJBeVlxM3U1RzJIdWgwNDk3MG1EbEY?oc=5","source":"factinnews.co.kr","summary":"홍콩의 최근 실업률이 3.8%로 상승하며 고용 시장의 불안이 지속되고 있습니다.\n실업률이 오르고 있음에도 불구하고 주요 산업 현장에서는 여전히 인력난을 겪고 있습니다.\n구직자의 역량과 기업이 요구하는 조건이 일치하지 않는 고용 불일치 현상이 심화되고 있습니다.\n이러한 인력 수급의 구조적 불균형으로 인해 구직자와 구인 기업 모두 어려움을 호소합니다.\n시장의 고용 불균형을 해소하고 안정적인 인력 공급을 위한 정책적 대응이 필요합니다.","cardImagePath":"","category":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"외국인 인력으로 중소기업 인력난 해소…혁신리더포럼-서인소 손잡아","link":"https://news.google.com/rss/articles/CBMibkFVX3lxTFBuNUhaREVuZUlIWkltY2M1Y3J1c3RyZG9iRFpMSmJmUmxaSDZZOVhOZWh0SFBTdXl5dDVLTC1oYVBuSHFSTVJ1aHlEUFMzd2NYN3Buem95cTJ1em5EVVlKTTJYTndCRGJicEQ3VUZR?oc=5","source":"gukjenews.com","summary":"혁신리더포럼과 서울인천지역 중소기업 관련 단체가 인력난 해소를 위해 손을 잡았다.\n이번 협력은 중소기업 현장에 맞춤형 외국인 인력을 수급하는 데 초점을 맞추고 있다.\n만성적인 구인난을 겪는 중소기업의 경영 부담을 덜고 생산성을 제고할 것으로 기대된다.\n양 기관은 외국인 인력의 효율적인 매칭과 안정적인 현장 적응을 함께 지원할 예정이다.\n외국인 노동자 활용을 통해 중소기업의 경쟁력을 강화하고 성장 기반을 마련할 방침이다.","cardImagePath":"","category":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"삼성전자 SK하이닉스 미국 메모리반도체 투자에 '인력난' 변수, 트럼프 압박에 부담 가중","link":"https://news.google.com/rss/articles/CBMic0FVX3lxTE80SmFkTS1mS1Y3LVFhUjB5T1VnM2JuclhCQl82OE45dFhwbEVadzlVeEtzVEtpSy1vZ0xpVlFHUzF0bkUtQTlacjNlLXpsbkpua3llRXJ6aGJhWWVMbjZMNUxjSHpzMGVuLXJiakxSVkNXWDA?oc=5","source":"비즈니스포스트","summary":"삼성전자와 SK하이닉스가 미국 내 메모리반도체 투자를 본격화하고 있다.\n하지만 현지 반도체 전문 인력 부족이 대미 투자의 핵심 변수로 떠올랐다.\n여기에 트럼프의 미국 투자 압박까지 가해지면서 기업들의 부담이 가중되었다.\n인력난과 정치적 불확실성은 현지 공장 설립 및 운영 차질로 이어질 수 있다.\n한국 반도체 기업들은 대미 투자 리스크를 줄이기 위한 대응책 마련이 시급하다.","cardImagePath":"","category":"기타","hash":"","industry":"반도체"},{"date":"2026-09-19","title":"美 반도체 인력난 왜 심해지나","link":"https://news.google.com/rss/articles/CBMiaEFVX3lxTE9UU0xDSEtGYy1WYzExVEh2bXB3V3oyRGxPblRCQ3A1QV9UZlFaUUJ3YU1CbUk4NTFuX2l2d0xnLVcxemNiN0VJZEdWelNrUWZ6bVpHVTFTUDMxZ29WME1rMFk4ZU1ET0dL?oc=5","source":"gokorea.kr","summary":"미국 반도체 지원법 통과로 현지 공장 설립이 급증하며 인력 수요가 폭발적으로 늘었습니다.\n전문 엔지니어와 기술 인력의 배출 속도가 반도체 산업의 확장 속도를 따라가지 못하고 있습니다.\n빅테크 기업들과의 인재 유치 경쟁이 심화되면서 반도체 제조업의 인력난이 더욱 가중되었습니다.\n고숙련 노동자의 은퇴와 청년층의 제조업 기피 현상도 인력 부족을 심화시키는 주요 원인입니다.\n이러한 인력난은 공장 가동 연기 등 미국 내 반도체 자립 공급망 구축에 차질을 줄 것으로 우려됩니다.","cardImagePath":"","category":"기타","hash":"","industry":"반도체"},{"date":"2026-09-19","title":"[단독] 월 초과근무 100시간 육박…인력난에 ‘과로 관제’ 우려","link":"https://news.google.com/rss/articles/CBMiY0FVX3lxTE1iWUI3TnVlSHJuT3dHYTE2bzdGVVhTN2kwTTNNSFIzbEVrUFFlLWxuWTZZYkZ4QXZJbGFNTlN5a1lDUklIOE1rdW9yS0lmRnFPZXJEOWVQczRyRE5XOFJzUXZDUQ?oc=5","source":"쿠키뉴스","summary":"관제 현장의 심각한 인력난으로 인해 근무자들의 업무 부담이 가중되고 있습니다.\n일부 관제 인력의 월 초과근무 시간이 100시간에 육박하는 실정입니다.\n만성적인 인력 부족은 근무자들의 피로도를 높여 안전을 위협하고 있습니다.\n과도한 업무 누적으로 인해 '과로 관제'에 따른 사고 우려가 커지고 있습니다.\n인력 충원과 근무 환경 개선을 위한 신속하고 실질적인 대책이 필요합니다.","cardImagePath":"","category":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"AI 배우는 요양보호사들···돌봄 인력난, 기술만으로 풀릴까","link":"https://news.google.com/rss/articles/CBMic0FVX3lxTE12amR4aXhzc0JrM3NVRWZmUS1WM3JFTnpmcHFLdW1OTW45dDRVbTJQcjJvZjdYTXVkT05oTnYyNk1Mc3I3V2RTSm5BYktBWkFrdGRFbGxnOXl1Vzk1UEEtdnJSN1c5Qjg0RHZGa2xEcDFNbzDSAXdBVV95cUxOcmVZYTlWLWdoU25UYXNIMTN0bEMzV0JJNEx6NENyYzFRT3VwSGJqZWtLNjlCUXRVTS0yemVxWHpNTThveFZFVlVhUXNiM2I3YVQyZlhNeS0xeHdodXVBTmhVTC1fbTN0dkxjRnpYcDd4dTYyUFZEUQ?oc=5","source":"여성경제신문","summary":"초고령화 사회 진입으로 돌봄 현장의 요양보호사 구인난이 심화하고 있다.\n인력 부족에 대응하기 위해 AI와 디지털 기술을 배우는 요양보호사가 늘고 있다.\n스마트 돌봄 기술은 업무 부담을 줄이고 돌봄의 효율성을 높이는 데 기여한다.\n하지만 기술만으로는 정서적 교감과 근본적인 인력 부족 문제를 해결하기 어렵다.\n기술 활용과 함께 요양보호사의 처우 개선 등 제도적 지원이 병행되어야 한다.","cardImagePath":"","category":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"“교사 되면 학자금 대신 갚아드립니다”…日, 인력난에 파격 지원 검토","link":"https://news.google.com/rss/articles/CBMiRkFVX3lxTE5zWjVFOW93SWdrVG9oX1RQQ1VZRUI5M1FZZWpmUFNycHJDTjdsdDFFZ2ZFUUNTbEJNd19qSVFITUF4a0ZfQ2c?oc=5","source":"v.daum.net","summary":"일본 정부가 심각한 교직 인력난을 해소하기 위해 파격적인 혜택을 검토 중이다.\n대학 재학 중 받은 학자금 대출을 교직에 진출할 경우 대신 갚아주는 제도이다.\n열악한 근무 환경으로 교사 기피 현상이 심화되자 과거 폐지된 제도의 재도입을 추진한다.\n교원 임용 시험의 경쟁률이 하락하면서 학교 현장의 인력 부족 문제가 심각해졌기 때문이다.\n이번 정책을 통해 청년층의 경제적 부담을 완화하고 우수한 교원 인재를 확보할 계획이다.","cardImagePath":"images/20260919_061059_5.png","category":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"강원동부지사, 지역 중소기업 인력난 해소 및 동반성장을 위한 업무협약 체결","link":"https://news.google.com/rss/articles/CBMia0FVX3lxTE95eEV3cUdOZmdWQ25HNFJqQzZkbFB1NFYzRFRvVGxRUUtuVXpaNjRHT2pUSk84Sm5WdDJMcWZvTDNYRkVlVHh3NG41TzZKRjJwbnZ4blBmdUdpclhjdHNULVZkRWdZWXBBRUhZ?oc=5","source":"안전정보","summary":"강원동부지사가 지역 중소기업의 인력난 해소와 동반성장을 위한 업무협약을 체결했습니다.\n이번 협약은 지역 중소기업의 안정적인 인력 확보와 상생 협력 체계 구축을 목적으로 합니다.\n참여 기관들은 현장 맞춤형 인력 지원과 안전한 근로 환경 조성을 위해 협력하기로 했습니다.\n이를 통해 지역 중소기업의 경쟁력을 강화하고 지역 경제 활성화에 기여할 것으로 기대됩니다.\n향후 지속적인 교류와 협력 사업을 통해 지역 사회의 지속 가능한 성장을 추진할 계획입니다.","cardImagePath":"images/20260919_061059_4.png","category":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"[총회 결산] 합동, 여성 강도권 3년 논란 ‘원점’으로… 정년 연장은 또 부결","link":"https://news.google.com/rss/articles/CBMia0FVX3lxTE1UZW9OUzM4ejFvcXR6TlFGTnZNc2kzdGZjem5BOFBPcEFjTEZKcVJMdzV2NFh0TFYzY0dCU2ZIZU1xaEFrRlFrZXdhUXVXNVo5WGR3UFR1ZWU2MnV6U3NhOTNSRS1VNUw3bXhR?oc=5","source":"아이굿뉴스","summary":"대한예수교장로회 합동 총회가 주요 안건을 처리하며 총회 일정을 결산했다.\n년간 논쟁이 이어진 여성 사역자 강도권 허용 안건은 결국 원점으로 돌아갔다.\n여성 교역자의 지위 향상을 기대했던 교단 내 목소리는 다시 난관에 부딪혔다.\n목사와 장로의 정년을 연장하는 안건 역시 총회원들의 반대로 또다시 부결되었다.\n이번 결산으로 합동 총회는 핵심 현안에서 기존의 보수적 기조를 유지하게 되었다.","cardImagePath":"images/20260919_061059_3.png","category":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"[하투(夏鬪) 청구서 ③] “실적반등·상여금·정년연장”…현대차 파업이 남긴 과제 셋","link":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE1naE9HV0RFcGtGSTJIakRZdkV4VzdkSzJXTlVvN3M5Sm9CVDgtTm0wcWhmWGhuTGo4ejFKcjYzRjU2Qk1IU01CZk8xWmZxMHBBMk55NWlFeXRUTE02NEp1SQ?oc=5","source":"마이데일리","summary":"현대자동차 노사의 교섭 타결 이후 해결해야 할 핵심 과제 세 가지가 대두되었습니다.\n우선 생산 차질 극복과 글로벌 경쟁력 확보를 통한 실적 반등이 시급합니다.\n성과급과 상여금 산정 방식을 둘러싼 노사 간 갈등을 합리적으로 조정해야 합니다.\n정년 연장 이슈는 청년 고용 및 세대 간 형평성을 고려하여 논의를 이어가야 합니다.\n노사가 협력하여 세 가지 과제를 극복해야 지속 가능한 성장을 이룰 수 있습니다.","cardImagePath":"images/20260919_061059_2.png","category":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-19","title":"의용소방대원 정년, 70세까지 연장… ‘의소대법’ 개정안 국회 통과 - FPN-소방방재신문","link":"https://news.google.com/rss/articles/CBMiRkFVX3lxTE81ejdsaXVsZUtVQlJ5Z1JPVThXY0E2WF9kNlNRX3hac21FZXQwY252N2FXNXRQX051b3dRUWNtTUtJSEpja1E?oc=5","source":"FPN-소방방재신문","summary":"의용소방대원 정년을 연장하는 관련 법률 개정안이 국회를 통과했습니다.\n이에 따라 의용소방대원의 정년이 기존 65세에서 70세로 연장됩니다.\n인구 고령화로 인한 지역 사회의 소방 인력 부족을 해소하기 위한 조치입니다.\n숙련된 경험을 가진 대원들이 계속 현장에 참여할 수 있게 되었습니다.\n향후 지역 재난 대응 역량 강화와 안정적인 안전망 구축이 기대됩니다.","ca ategory":"기타","hash":"","industry":"일반·전체"},{"date":"2026-09-18","title":"“챗GPT 죽었다깨도 화장품 못팔죠”…올리브영, 역대최대 신규채용","link":"https://www.mk.co.kr/news/business/12156024","source":"매일경제 : 헤드라인","summary":"올리브영이 AI가 대체하기 힘든 화장품 유통의 현장성을 바탕으로 역대 최대 규모의 신규 채용에 나섰습니다.\n이번 채용은 AI 기술의 급성장 속에서도 오프라인 유통과 고객 경험의 중요성을 강조하는 행보입니다.\n시장에서는 AI 도입 확대에 따른 일자리 지형 변화와 산업별 영향에 대한 관심이 높아지고 있습니다.\n기업들은 기술 변화에 대응하는 동시에 미래 경쟁력을 확보하기 위해 핵심 인재 채용을 늘리고 있습니다.\n급변하는 경제 환경 속에서 유통 및 주요 산업 분야의 인재 확보와 체질 개선 노력이 이어지고 있습니다.","cardImagePath":"images/20260918_073317_1.png","category":"채용","hash":"","industry":"유통·서비스"},{"date":"2026-09-17","title":"‘채용 나이·학력 제한 의혹’…노동부, 한화에어로 감독 착수","link":"https://www.mk.co.kr/news/business/12154704","source":"매일경제 : 헤드라인","summary":"","cardImagePath":"images/20260917_060744_2.png","category":"채용","hash":"","industry":"공공·정부"},{"date":"2026-09-17","title":"‘사무소 폭파’ 北 446억 배상판결에도…“대화로 해결”하겠단 정부","link":"https://www.mk.co.kr/news/society/12154899","source":"매일경제 : 헤드라인","summary":"","cardImagePath":"images/20260917_060744_1.png","category":"노동법","hash":"","industry":"공공·정부"},{"date":"2026-09-15","title":"잡코리아, 하반기 채용 머니 리포트 발행 |","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTFBPb09NcjhjbFh4SlJvVnY3TlhNV1c0empYcGtqbnp3Vmt6Nzl1bHZKdzRTZi1OWW5SUXBuaTdtUEEwS3ZGOHk1SDFiekk3RTBKYjVxWnlkMVliZmtTdHBPT1dDNzZsVnVfenc1d2F1WQ?oc=5","source":"hansbiz.co.kr","summary":"잡코리아가 하반기 기업 채용 및 연봉 관련 동향을 다룬 보고서를 발행했습니다.\n주요 기업들의 하반기 채용 계획과 신입 사원 평균 연봉 정보를 분석했습니다.\n업종 및 직무별 채용 예산과 연봉 수준의 차이를 다각도로 파악했습니다.\n하반기 구직 시장의 주요 흐름과 기업들의 채용 트렌드 변화를 제시합니다.\n구직자와 기업 인사담당자에게 실질적으로 필요한 채용 정보를 제공합니다.","cardImagePath":"images/20260915_060717_2.png","category":"채용","hash":"","industry":"일반·전체"},{"date":"2026-09-15","title":"기업 10곳 중 8곳 “채용예산, 지원자 수보다 직무 적합도 우선”","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTFBleVVqMHhBbmlZbHh6VUF3SF92VFg0blF5TzRVbHBiQ0ZBcDB3V3N1d0lCS0xzOS1zZE0wZjhUZDlNTHdvbkhVb3lTbHpyZExlb01qNzFfTW1IUTd0dXJRakxUaE54M21EdUx0Tw?oc=5","source":"워크투데이","summary":"기업 10곳 중 8곳은 채   categories.sort();industries.sort();
  var html='<table class="matrix-table"><thead><tr><th class="row-head">HR영역 \\ 산업군</th>';
  industries.forEach(function(ind){html+='<th>'+escapeHtml(ind)+'</th>';});

    html+='<tr><td class="matrix-row-label">'+escapeHtml(cat)+'</td>';
    industries.forEach(function(ind){
      var key=cat+'||'+ind;var c=counts[key]||0;
      var isActive=(state.category===cat&&state.industry===ind);
      html+='<td><div class="matrix-cell'+(c>0?' has-count':'')+(isActive?' active':'')+'" data-cat="'+escapeHtml(cat)+'" data-ind="'+escapeHtml(ind)+'">'+(c>0?c:'')+'</div></td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  document.getElementById('matrixContainer').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('.matrix-cell'),function(cell){
    cell.addEventListener('click',function(){
      var cat=cell.getAttribute('data-cat');var ind=cell.getAttribute('data-ind');
      if(state.category===cat&&state.industry===ind){state.category=null;state.industry=null;}
      else{state.category=cat;state.industry=ind;}
      renderAll();
    });
  });
}
function renderSidebar(){
  var catCounts={};
  NEWS_DATA.forEach(function(item){catCounts[item.category]=(catCounts[item.category]||0)+1;});
  var catList=document.getElementById('categoryList');
  catList.innerHTML=Object.keys(catCounts).sort().map(function(cat){
    return '<li data-category="'+escapeHtml(cat)+'" class="'+(state.category===cat?'active':'')+'">'+escapeHtml(cat)+' <span class="count">'+catCounts[cat]+'</span></li>';
  }).join('');
  var dateCounts={};var dateOrder=[];
  NEWS_DATA.forEach(function(item){if(!dateCounts[item.date]){dateCounts[item.date]=0;dateOrder.push(item.date);}dateCounts[item.date]++;});
  dateOrder.sort().reverse();
  var dateList=document.getElementById('dateList');
  dateList.innerHTML=dateOrder.map(function(d){
    return '<li data-date="'+d+'" class="'+(state.date===d?'active':'')+'">'+d+' <span class="count">'+dateCounts[d]+'</span></li>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#categoryList li'),function(li){
    li.addEventListener('click',function(){var c=li.getAttribute('data-category');state.category=(state.category===c?null:c);renderAll();});
  });
  Array.prototype.forEach.call(document.querySelectorAll('#dateList li'),function(li){
    li.addEventListener('click',function(){var d=li.getAttribute('data-date');state.date=(state.date===d?null:d);renderAll();});
  });
}
function matchesQuery(item,q){if(!q)return true;var hay=(item.title+' '+(item.summary||'')).toLowerCase();return hay.indexOf(q.toLowerCase())!==-1;}
function renderCards(){
  var filtered=NEWS_DATA.filter(function(item){
    if(state.category&&item.category!==state.category)return false;
    if(state.industry&&item.industry!==state.industry)return false;
    if(state.date&&item.date!==state.date)return false;
    if(!matchesQuery(item,state.query))return false;
    return true;
  });
  document.getElementById('resultCount').textContent=filtered.length+'건 표시 중';
  document.getElementById('cardsContainer').innerHTML=filtered.map(function(item){
    var img=item.cardImagePath?'<img class="card-img" src="'+escapeHtml(item.cardImagePath)+'" alt="">':'';
    return '<div class="card">'+img+
      '<a class="title" href="'+escapeHtml(item.link)+'" target="_blank" rel="noopener">'+escapeHtml(item.title)+'</a>'+
      '<div class="meta">'+escapeHtml(item.source)+' · '+item.date+' · <span class="tag">'+escapeHtml(item.category)+'</span> · <span class="tag">'+escapeHtml(item.industry)+'</span></div>'+
      (item.summary?'<div class="summary">'+escapeHtml(item.summary)+'</div>':'')+
      '<button class="del-btn" data-hash="'+escapeHtml(item.hash)+'" onclick="deleteArticle(this)">🗑 삭제</button>'+
    '</div>';
  }).join('');
}
function deleteArticle(btn){
  var hash=btn.getAttribute('data-hash');
  if(!hash){alert('삭제할 수 없는 항목입니다 (해시 없음)');return;}
  if(!confirm('이 기사를 삭제할까요? 되돌릴 수 없습니다.'))return;
  btn.disabled=true;btn.textContent='삭제 중...';
  fetch(WEBAPP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'delete_news', secret: DELETE_SECRET, hash: hash})
  }).then(function(r){return r.text();}).then(function(txt){
    var card = btn.closest('.card');
    if (card) card.remove();
  }).catch(function(err){
    alert('삭제 요청 중 오류가 발생했습니다.');
    btn.disabled=false;btn.textContent='🗑 삭제';
  });
}
function renderAll(){renderMatrix();renderSidebar();renderCards();}
document.getElementById('searchInput').addEventListener('input',function(e){state.query=e.target.value;renderCards();});
document.getElementById('resetBtn').addEventListener('click',function(){state.category=null;state.date=null;state.industry=null;state.query='';document.getElementById('searchInput').value='';renderAll();});
renderStats();renderAll();
</script></body></html>
