ktqd2QzRmVlb3djRDVuSDIxM0ZXRnc?oc=5","source":"nbn 시사경제","summary":"평균임금 431만 원 발표는 전체 근로자의 현실을 반영하지 못한 통계적 착시입니다. / 반도체 등 일부 대기업 직원의 대규모 성과급 지급이 전체 평균 수치를 크게 끌어올렸습니다. / 대기업과 중소기업 간 임금 격차가 더욱 벌어지며 노동 시장의 양극화가 심화되고 있습니다. / 대다수 일반 근로자들은 실질적인 소득 증가 없이 오히려 상대적 박탈감을 호소하고 있습니다. / 통계 착시 뒤에 숨은 실제 임금 격차를 해소하고 양극화를 완화할 정책적 대책이 시급합니다.","cardImagePath":"","category":"기타","hash":"f9d21710b61a00b785263e75ac058fb947aa259af6a865fb344f4f563fa9d8b0"},{"date":"Tue Sep 22","title":"네이버제트 노조, 23일 전면 파업 예고…임금 5.3% 인상 놓고 대립 - cwn.kr","link":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE90TzBnS3d6M3lTeFJvZk5pTHh2a1MzVUV3cGNKTzZ6WjlEbF9jOU5UUnotdlE4VTJpTHJrZjlDUjhTN2ZYZFBEREFFeFVER2pFQzhIU2FzRXdvR1FDOHVSM1FR?oc=5","source":"cwn.kr","summary":"네이버제트 노동조합이 사측과의 임금 협상 결렬로 전면 파업을 예고했다. / 이번 갈등은 평균 5.3% 수준의 임금 인상안을 둘러싼 노사 간 입장 차이에서 비롯됐다. / 노사 양측의 의견 대립이 지속되면서 교섭은 난항을 겪고 있다. / 노조는 합의에 이르지 못할 경우 오는 23일부터 전면 파업에 돌입한다는 방침이다. / 파업이 강행될 경우 메타버스 플랫폼 운영 등 관련 서비스에 차질이 예상된다.","cardImagePath":"","category":"기타","hash":"4456fce5a951cb09ae717a56d77eac9023054ea3a6d42240e32601ca5631ddd3"},{"date":"Tue Sep 22","title":"직장인 평균 임금 432만 원…“반도체 성과급 효과” - 더나은미래","link":"https://news.google.com/rss/articles/CBMiUkFVX3lxTFB5MV80VXhOTVRKeDJIcEU5WUlIaTRMb0dCNVhpRFF6MWVyczRzV0lYRjNvb2tqMVVYUGRvc0VFN0djd0JJdFdZalBWekVHME41VUE?oc=5","source":"더나은미래","summary":"직장인의 월평균 임금이 반도체 등 주요 기업의 성과급 지급에 힘입어 432만 원을 기록했습니다. / 특별급여의 대폭 증가가 전체 임금 상승을 이끌며 평균 금액을 끌어올린 주요 원인으로 분석됩니다. / 반도체 업황 회복 및 실적 개선에 따른 성과급 효과가 특정 업종을 중심으로 크게 작용했습니다. / 다만 대기업과 중소기업 간의 임금 격차는 여전히 유지되며 양극화 현상을 나타냈습니다. / 고물가 상황이 지속되면서 노동자가 실제로 체감하는 실질임금의 상승 폭은 제약적인 상황입니다.","cardImagePath":"","category":"기타","hash":"cb9b399c49006780204f653819d9466f0c13112a49ab948fc30fe1e7e329611e"},{"date":"Tue Sep 22","title":"정년·연금·계속 고용, 하나의 틀에서 논의해야 [왜냐면] - 한겨레","link":"https://news.google.com/rss/articles/CBMiZ0FVX3lxTE45RFZLTW55OUtRbUpjOWZpMDZOSmpKamFVejFVTTdRQkpycXRpTXRFaDE2SmhfbzdRMnJCcVZRaWVZbEZRSHBwUEt3Yy1MemlqNE9ZT00wRXJ6dkZBMno2bUhfSkM0Ymc?oc=5","source":"한겨레","summary": da291e6160f"},{"date":"Sat Sep 19","title":"부산진구 채용박람회 ‘취업 열기’… 구직자 640여명 몰렸다 - v.daum.net","link":"https://news.google.com/rss/articles/CBMiT0FVX3lxTFA0cVg0aDVmQzBGX1dnT2FsaGJFcGdtVHNhaGpBNjFFcTF6OTJCZk5RTFEwSTZabktqeDBmcjMydEtuLWFtSUFqRXU5SktOZEU?oc=5","source":"v.daum.net","summary":"부산진구에서 채용박람회가 개최되었다. / 박람회 현장은 뜨거운 취업 열기를 보였다. / 640여 명의 구직자가 박람회 현장에 몰려들었다. / 해당 기사는 다음 및 구글 뉴스를 출처로 하고 있다. / 제공된 본문에는 제목 외에 추가적인 세부 내용이 포함되어 있지 않다.","cardImagePath":"images/20260919_150054_2.png","category":"채용","hash":"71ffacd90f804abb481459629360aee295defea37a95584dcc82e3ffe28ba93a"},{"date":"Sat Sep 19","title":"인천공항 2터미널 '캐리어 실종' 26개…보안 인력난에 추석 비상 : 기업·산업 - 재경일보","link":"https://news.google.com/rss/articles/CBMiSkFVX3lxTE1uczd1N0tPQmZRaE9RdW5TemhzbUx3TWE2RzlxbXBDeEt4VjRxR2FoZHpUNUloc1RuQXkwclRwWWRocEdMNVQyMUxn?oc=5","source":"재경일보","summary":"인천국제공항 제2여객터미널에서 수하물 26개가 유실되는 사고가 발생했습니다. / 이번 사고는 공항 내 보안 및 수하물 관리 인력의 부족 때문에 일어났습니다. / 인력난으로 수하물 검색과 이송이 지연되며 승객들의 불편이 확대되고 있습니다. / 대규모 이동이 예상되는 추석 연휴를 앞두고 공항 운영 전반에 비상이 걸렸습니다. / 연휴 기간 혼잡과 수하물 대란을 막기 위해 신속한 인력 충원과 대책 마련이 요구됩니다.","cardImagePath":"images/20260919_150054_1.png","category":"기타","hash":"aff03165b3856b6a75bed5d3c920ab97b8158f9bcf2730425a723d1e7ec06d3f"},{"date":"Sat Sep 19","title":"차는 남고 회사는 사라져…85만 차주 덮친 中 자동차 구조조정 [차이나 워치]","link":"https://www.hankyung.com/article/202609120317i","source":"한국경제 | 뉴스 | 경제","summary":"중국 신에너지차 업체들의 파산과 철수로 약 85만 명의 차주가 사후서비스와 부품 공급 중단 피해를 입고 있다. / 경기 둔화와 토종 브랜드의 고급화 공세로 인해 중국 내 수입차 시장도 판매량이 급감하며 빠르게 위축되고 있다. / 반면 렉서스는 높은 잔존가치와 철저한 장기 보증 및 사후관리를 바탕으로 수입 고급차 1위를 유지하고 있다. / 중국 자동차 시장의 핵심 경쟁축이 신차 출시 속도와 가격 경쟁에서 품질과 사후관리 능력으로 이동하고 있다. / 향후 시장 구조조정이 심화함에 따라 단기 성과보다 장기적인 서비스망과 재무 체력을 갖춘 기업이 살아남을 전망이다.","cardImagePath":"images/20260919_113656_1.png","category":"기타","hash":""},{"date":"Sat Sep 19","title":"청년고용 한파 속 9월 채용문 오픈…유통 대기업 미래 인재 확보전 - 월요신문","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTE5ZMmdtdHJZMVVqODJ5WGVUMXBreDUxY0ZTVW43TWxCRXJ1VF96amxJZHdwWjcyMlNzQ0d1TW5maUpyNFVyTFFWZ0xDMU5X const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxvCeYZ2-vWusjsu7skjgiRMhagia-qS2uy5AFfhe3w3jAMdu0heoOGsrb76EFjfDJKQQ/exec";
const DELETE_SECRET = "kai-hr-2026-delete";
function escapeHtml(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var state={category:null,date:null,query:''};
function renderStats(){
  var byCat={};
  NEWS_DATA.forEach(function(item){byCat[item.category]=(byCat[item.category]||0)+1;});
  var html='<span class="stat-pill total">전체 '+NEWS_DATA.length+'건</span>';
  Object.keys(byCat).sort().forEach(function(cat){html+='<span class="stat-pill">'+escapeHtml(cat)+' '+byCat[cat]+'건</span>';});
  document.getElementById('statsBar').innerHTML=html;
}
function renderSidebar(){
  var catCounts={};
  NEWS_DATA.forEach(function(item){catCounts[item.category]=(catCounts[item.category]||0)+1;});
  var catList=document.getElementById('categoryList');
  catList.innerHTML=Object.keys(catCounts).sort().map(function(cat){
    return '<li data-category="'+escapeHtml(cat)+'" class="'+(state.category===cat?'active':'')+'">'+escapeHtml(cat)+' <span class="count">'+catCounts[cat]+'</span></li>';
  }).join('');
  var dateCounts={};var dateOrder=[];
  NEWS_DATA.forEach(function(item){if(!dateCounts[item.date]){dateCounts[item.date]=0;dateOrder.push(item.date);}dateCounts[item.date]++;});
  dateOrder.sort().reverse();
  var dateList=document.getElementById('dateList');
  dateList.innerHTML=dateOrder.map(function(d){
    return '<li data-date="'+d+'" class="'+(state.date===d?'active':'')+'">'+d+' <span class="count">'+dateCounts[d]+'</span></li>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#categoryList li'),function(li){
    li.addEventListener('click',function(){var c=li.getAttribute('data-category');state.category=(state.category===c?null:c);renderAll();});
  });
  Array.prototype.forEach.call(document.querySelectorAll('#dateList li'),function(li){
    li.addEventListener('click',function(){var d=li.getAttribute('data-date');state.date=(state.date===d?null:d);renderAll();});
  });
}
function matchesQuery(item,q){if(!q)return true;var hay=(item.title+' '+(item.summary||'')).toLowerCase();return hay.indexOf(q.toLowerCase())!==-1;}
function renderCards(){
  var filtered=NEWS_DATA.filter(function(item){
    if(state.category&&item.category!==state.category)return false;
    if(state.date&&item.date!==state.date)return false;
    if(!matchesQuery(item,state.query))return false;
    return true;
  });
  document.getElementById('resultCount').textContent=filtered.length+'건 표시 중';
  document.getElementById('cardsContainer').innerHTML=filtered.map(function(item){
    var img=item.cardImagePath?'<img class="card-img" src="'+escapeHtml(item.cardImagePath)+'" alt="">':'';
    return '<div class="card">'+img+
      '<a class="title" href="'+escapeHtml(item.link)+'" target="_blank" rel="noopener">'+escapeHtml(item.title)+'</a>'+
      '<div class="meta">'+escapeHtml(item.source)+' · '+item.date+' · <span class="tag">'+escapeHtml(item.category)+'</span></div>'+
      (item.summary?'<div class="summary">'+escapeHtml(item.summary)+'</div>':'')+
      '<button class="del-btn" data-hash="'+escapeHtml(item.hash)+'" onclick="deleteArticle(this)">🗑 삭제</button>'+
    '</div>';
  }).join('');
}
function deleteArticle(btn){
  var hash=btn.getAttribute('data-hash');
  if(!hash){alert('삭제할 수 없는 항목입니다 (해시 없음)');return;}
  if(!confirm('이 기사를 삭제할까요? 되돌릴 수 없습니다.'))return;
  btn.disabled=true;btn.textContent='삭제 중...';
  fetch(WEBAPP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'delete_news', secret: DELETE_SECRET, hash: hash})
  }).then(function(r){return r.text();}).then(function(txt){
    var card = btn.closest('.card');
    if (card) card.remove();
  }).catch(function(err){
    alert('삭제 요청 중 오류가 발생했습니다.');
    btn.disabled=false;btn.textContent='🗑 삭제';
  });
}
function renderAll(){renderSidebar();renderCards();}
document.getElementById('searchInput').addEventListener('input',function(e){state.query=e.target.value;renderCards();});
document.getElementById('resetBtn').addEventListener('click',function(){state.category=null;state.date=null;state.query='';document.getElementById('searchInput').value='';renderAll();});
renderStats();renderAll();
</script></body></html>
