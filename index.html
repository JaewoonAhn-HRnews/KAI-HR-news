XNRVXloQW9ZekRIamtFRm5GZkR4V0ZWaUoweUg5ZFdzNlZzM0czUzJBSENNYlVNT3preWFUXy1LSkx5bUJkOHotSzF2?oc=5","source":"CBC뉴스","summary":"일본 정부가 에너지 안보와 탈탄소를 목표로 원자력 발전 부활을 공식 선언했다.\n그러나 후쿠시마 원전 사고 이후 장기 공백으로 인해 전문 인력난이 심각한 문제로 떠올랐다.\n고령화에 따른 기술자 은퇴와 신규 유입 감소로 원전 운영 및 관리 유지에 비상이 걸렸다.\n위기를 느낀 일본 전력업계와 원전 제조업체들은 인력 확보를 위해 대대적인 연합군을 결성했다.\n이들은 인재 공동 교육과 인력 공유를 통해 원전 산업 생태계를 재건하고 인력난을 극복할 방침이다.","cardImagePath":"","category":"기타","hash":"df89d8898b7b7d4a0f492bd5bd8e5cdd18df84201c38083e6ce18537b63ab4f1","industry":"일반·전체"},{"date":"2026-10-10","title":"“필수의료 인력난 원인 비급여” vs “타당하지 않다”","link":"https://news.google.com/rss/articles/CBMidEFVX3lxTE9wdC1obkwybjdiRXRZYVIyNUFQZEVYSmRudks0UlZudnJySjUzellQbDR4Z3RSdXpCcGhkUWJEbGQzdld3dXpKcy1DQmtrTGQ3MVRrTUNsSGQyaGl0SjByQXJNQnBCX05yLXdWWVZUVW4yTDBz?oc=5","source":"데일리메디","summary":"필수의료 분야의 심각한 인력난 원인을 두고 정부와 의료계의 의견이 첨예하게 대립하고 있다.\n일각에서는 비급여 진료의 높은 수익성이 필수의료 인력 유출을 유발하는 주요 원인이라고 주장한다.\n반면 의료계는 비급여 진료를 인력난의 직접적인 원인으로 지목하는 것이 타당하지 않다고 반박한다.\n의료계는 낮은 수가와 높은 법적 리스크, 열악한 근무 환경이 필수의료 기피의 본질적인 문제라고 지적한다.\n양측의 시각 차이가 큰 만큼 필수의료 인력 확보를 위한 실질적인 지원책 마련이 시급한 상황이다.","cardImagePath":"","category":"기타","hash":"ef6194d6014aef300ee06b112c7ca82d746de7233ebd612c32cbd7ca38b7ea10","industry":"일반·전체"},{"date":"2026-10-10","title":"AI가 터뜨린 ‘보안 인력난’…상반기 채용 수요 2배 껑충","link":"https://news.google.com/rss/articles/CBMiUkFVX3lxTE1nTWNzVlBCaUhDVmJReDhSa3VDUk85ZEg2cW9MclItbEtfVU5XY0o3YkQ3T0dIcVI0NFA5TUl4Q0VXNURWZlpNei1TREF6VU1qS1HSAVNBVV95cUxQemtWUEcwTVdUZ2pKZ0RrcjljWDdrRV9mN2dvS3hiS0xOb2t1VVhxckRVdUxYaUo0TFhHYlRoUG1VSlJabWdtVEZ4b2ZDekVjV2lkbw?oc=5","source":"서울경제","summary":"인공지능 기술의 확산으로 인해 사이버 보안 인력난이 더욱 심화하고 있습니다.\n올해 상반기 보안 관련 직무의 채용 수요는 지난해 대비 두 배로 급증했습니다.\n고도화되는 AI 기반 사이버 공격에 대응할 전문 인력 수요가 폭발적으로 늘었습니다.\n기업들은 보안 위협에 선제적으로 대응하기 위해 전문 인재 확보 경쟁을 벌이고 있습니다.\n급증하는 채용 수요에 맞춘 보안 전문 인력 양성과 수급 대책 마련이 필요한 시점입니다.","cardImagePath":"images/20261010_060945_5.png","category":"채용","hash":"2577503df94844f06f7b2922a7312e74d3c8801b657646f0dbebb7cae8912534","industry":"일반·전체"},{"date":"2026-10-10","title":"‘인력난 호소’ 공소청, 미제 18만건 처리 계획은… 1재판부-1공판검사 가능할까[중수청·공소청 개청 일주일②]","link":"https://news.google.com/rss/articles/CBMidEFVX3lxTE5PQ1VOTV9lWF9CVk1tWTAwSEpLZ29Bamh0b09uWEZrS3dKYVljQ1RrY213dnN0UE1oaE9KUWlJMzNkczFZNEVQaTBSamJzekpXblR3d1dIRGJwb2ZrSDV1cDROcjR4RXNSVUdUeVd6YVZPMk5P?oc=5","source":"서울신문","summary":"공소청 개청 일주일을 맞아 약 18만 건에 달하는 미제 사건 처리 방안이 현안으로 떠올랐다.\n수사와 기소 분리 추진에 따라 공소청은 공소 유지 및 기소 전담 기관으로 전환되었다.\n그러나 만성적인 인력 부족으로 인해 미제 사건의 신속한 처리와 대응에 어려움을 겪고 있다.\n핵심 과제인 1재판부 1공판검사제 도입 실현 여부에 대한 우려와 의문이 지속되고 있다.\n인력 충원과 실질적인 인프라 개선 없이는 공소청의 정상적 업무 수행이 어렵다는 지적이 나온다.","cardImagePath":"images/20261010_060945_4.png","category":"기타","hash":"3064f2bcf00e256e57d8c311300f394645bbea8e5eae86ea657d0d5a744930e7","industry":"일반·전체"},{"date":"2026-10-10","title":"유럽發 고숙련 해체인력 쟁탈전, 국내 철거 현장 인력난 가중 우려","link":"https://news.google.com/rss/articles/CBMiSkFVX3lxTE9hMTdSRTRRelJCMFFMMV9oOXoyTktqLXJtaHMzVmdPN2NoRk5BV2lyUk1OR05zUlowUjdTX3VtTFZQWU9abTU1TlRB?oc=5","source":"뉴스N연합","summary":"유럽을 중심으로 고숙련 해체 인력 확보를 위한 글로벌 쟁탈전이 벌어지고 있습니다.\n해외의 인력 수요 급증으로 국내 전문 해체 인력의 유출 가능성이 제기되고 있습니다.\n이로 인해 국내 철거 현장의 기존 인력난이 한층 더 가중될 것이라는 우려가 깊어집니다.\n숙련 인력의 부재는 현장 안전사고 위험성을 높이고 공사 지연을 유발할 수 있습니다.\n국내 해체 산업의 안정성을 위해 고숙련 인력 육성과 처우 개선 등 대책이 필요합니다.","cardImagePath":"images/20261010_060945_3.png","category":"기타","hash":"fbf3b428ce39d6c7b285402ce195f928a515ad1fefb914424645b5047815c5d8","industry":"일반·전체"},{"date":"2026-10-10","title":"[국감] 문금주의원 “울진해양과학관 인력 이탈…채용보다 정착대책 시급”","link":"https://news.google.com/rss/articles/CBMiZ0FVX3lxTE0wS3JCYVBPcHZ3UXRfNVgxZktOUEFiY09fV2FlMUdqM2t3aXQyZC1tZThoR3BuVE1ISXFqdHJPZVotRXg2NzZUQVctTEtYSjZLU2U5NzlrTzBSdHdudHNvb1N1X1lpeHc?oc=5","source":"더쎈뉴스","summary":"국정감사에서 문금주 의원이 울진 국립해양과학관의 심각한 인력 이탈 문제를 지적했다.\n과학관 인력의 지속적인 유출로 인해 전문성 유지와 기관의 안정적 운영에 차질이 우려된다.\n단순한 신규 채용 중심의 대책은 인력 유출을 막는 데 한계가 있다는 지적이 제기되었다.\n직원들이 지역에 장기적으로 정착할 수 있는 정주 여건 개선과 복지 대책이 시급하다.\n문 의원은 지속 가능한 조직 관리를 위해 단순 채용보다 정착 지원 방안을 우선 마련할 것을 촉구했다.","cardImagePath":"images/20261010_060945_2.png","category":"채용","ha ource":"경향신문","summary":"국회 보건복지위원회의 지역 국립대병원 국정감사에서 인력난과 만성 적자 문제가 지적되었습니다.\n수도권 쏠림과 전공의 이탈 등으로 인해 지역 국립대병원의 의료진 부족 현상이 심화하고 있습니다.\n환자 감소와 진료 축소가 이어지면서 대다수 지역 국립대병원이 심각한 경영 위기에 봉착했습니다.\n국회는 지역 필수 의료 인프라가 붕괴할 위험에 직면했다며 우려와 함께 대책을 요구했습니다.\n정부 차원의 실질적인 재정 지원과 인력 확충을 위한 전방위적 지원책 마련이 시급한 상황입니다.","cardImagePath":"","category":"기타","hash":"fd63bcc9bd75f83f6784ee864ce46859e65a4fff95386639acd48f39a14da716","industry":"일반·전체"},{"date":"2026-10-09","title":"의협 “필수의료 인력난 원인 비급여 아닌 구조적 문제”","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTE1WQjVHUkpOcnlEZEo4RDJEd1UtX3JIeXJRMjJKTlhqOEtWblpDNTRzV2pRQm8zR2xQaWNxYURzNE9va2k4Z2szdFBYQVd1ZUhmWGJnUW5MXzd6eWN0bFhKRnExT2dpeG9QWWc?oc=5","source":"의학신문","summary":"대한의사협회는 필수의료 인력 부족의 원인이 비급여 진료 때문이 아니라고 밝혔습니다.\n의료진 이탈의 본질적 원인은 낮은 수가와 과도한 형사처벌 위험 등 구조적 문제 때문입니다.\n정부의 비급여 통제 방식으로는 필수의료 분야로의 인력 유입을 기대하기 어렵다고 지적했습니다.\n필수의료를 살리기 위해서는 의료사고 법적 부담 완화와 정당한 보상 체계 구축이 시급합니다.\n의협은 근본적인 의료 환경 개선 없이 추진되는 비급여 규제 정책에 대해 우려를 표명했습니다.","cardImagePath":"images/20261009_061009_5.png","category":"기타","hash":"aeb7c9220cc2e400d0dec326190c6afe429438ddefc5112b98c12390f69660d3","industry":"일반·전체"},{"date":"2026-10-09","title":"경북대병원 의사 충원율 55%, 전국 국립대병원 최저···국감서도 인력난 도마","link":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE91THZ1d2JMbVJOalEtMmloQlZ5NzF3ak1WMkVNRHZ3Y1dpdVhLT1dWRkZVM2lDanBaZlo2cjdCc0RxRmlnNkZuZ2sxWFhGOTQ?oc=5","source":"뉴스민","summary":"경북대병원의 의사 충원율이 55%로 전국 국립대병원 가운데 최저치를 기록했습니다.\n심각한 의료진 부족 문제는 국정감사에서도 주요 지적 사항으로 대두되었습니다.\n인력 충원이 제때 이루어지지 않으면서 지역 필수의료의 공백 우려가 커지고 있습니다.\n남아있는 의료진의 업무 과중이 심화되어 의료 서비스 질 저하가 우려됩니다.\n국립대병원의 인력난 해소를 위한 구체적인 지원책과 개선방안 마련이 시급합니다.","cardImagePath":"images/20261009_061009_4.png","category":"기타","hash":"f856d94cbb8a30604893df4e80c45ea7e8bfbb2b36cf799a2160c6e111691180","industry":"일반·전체"},{"date":"2026-10-09","title":"KT새노조, 사측·다수 노조 동시 겨냥···\"임금 2%·밀실 교섭 못 참아\"","link":"https://news.google.com/rss/articles/CBMiZ0FVX3lxTE5CR1FobzM2ak95NVdfNWtwZ0stWkVTZ0ZKZEJEbTh4ejdPdU5TOXZkSDkwQVVFVDZpbF9RZDlaWUdTdWR2aUdWNEZIdn 26-10-07","title":"함안군, 찾아가는 채용박람회 참여기업 추가 모집…지역 인력난 해소","link":"https://news.google.com/rss/articles/CBMiXEFVX3lxTFAwMkNEQmZyazRMUDlDY3B5ZDNXWGFMSTBUd25pSmNmeExQSmFfX3A2ZFRfZUxYem40Vkw4ZXMwMVhVZkNFa3dtNzRNc1JRd1doejFSbmd3VndxZnBV?oc=5","source":"뉴스핌","summary":"함안군이 지역 기업의 인력난 해소를 위해 찾아가는 채용박람회 참여기업을 추가 모집합니다.\n관내에 사업장을 두고 구직자를 채용하고자 하는 우수 중소기업이 주요 모집 대상입니다.\n박람회 현장에서는 구직자와 기업 간 일대일 맞춤형 면접과 취업 상담이 진행됩니다.\n참여 기업에는 채용 홍보와 면접 공간 제공 등 다양한 혜택이 무료로 지원됩니다.\n함안군은 이번 행사를 통해 지역 인재 채용을 활성화하고 고용 안정을 도모할 계획입니다.","cardImagePath":"","category":"채용","hash":"17a2d1d4d1669e3c07bcaa866ddef27127ea45397d4f9f64e4fd5d630136acbd","industry":"일반·전체"},{"date":"2026-10-07","title":"시설 대신 그룹홈 늘린다지만 처우 낮고 위험 높아 ‘인력난’","link":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE9rLVV0UTVZQWtjbVFzQXZWYTdoZ0Q2ZEtrOXo3dzNMTzhvdzU5ejJvMngzMTlJWDFpVTE2MTJvUUp2dEFhSmNNbTd6YWh4Q0E?oc=5","source":"Daum","summary":"정부는 대형 시설 대신 지역사회 중심의 그룹홈을 확대하는 정책을 추진하고 있다\n그룹홈 종사자들의 임금 수준과 근무 환경 등 전반적인 처우는 여전히 열악한 실정이다\n돌발 상황 대응과 야간 근무 등으로 인한 업무 위험성과 부담감도 매우 높다\n낮은 처우와 높은 위험성 때문에 현장에서는 심각한 인력난이 지속되고 있다\n그룹홈 제도의 성공적인 안착을 위해 종사자에 대한 처우 개선과 지원책 마련이 시급하다","cardImagePath":"","category":"기타","hash":"2253d5416a0007dc10f95a788e2bdf651e414e13773aea40871408e97aa9dcd2","industry":"일반·전체"},{"date":"2026-10-07","title":"[편집자 시선]① 미국 장애인 서비스, 인력난에 ‘있어도 못 받는다’","link":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE9pcnNJTTdFOG92YTVldmNaM0Qyb0Z3SFhlVmF4dVFTVERoY0VVRTFnTm9yU3hKYjc1LTB4RFpTS0ROSC1YZGRiMklxVm82Smc?oc=5","source":"더인디고","summary":"미국 장애인 지원 서비스 제도가 존재함에도 극심한 인력난을 겪고 있다.\n돌봄 인력 부족으로 장애인들이 정작 필요한 서비스를 제대로 제공받지 못한다.\n열악한 처우와 낮은 임금이 관련 전문 인력의 이탈과 구인난을 심화시키고 있다.\n서비스 공백이 길어지면서 장애인 당사자와 가족들의 돌봄 부담이 가중되는 실정이다.\n실효성 있는 장애인 복지를 위해 인력난 해소를 위한 정책적 지원과 대책이 필요하다.","cardImagePath":"","category":"기타","hash":"12a301119e23a4c2641b557fed0f7687de090ce4147b9c296bb384e699126ab8","industry":"일반·전체"},{"date":"2026-10-07","title":"은행 개점 오전 9시30분으로 늦춘다…금융노사, 임금·청년채용 확대 합의","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE9YTHJNcFJ 질적인 지역 맞춤형 일자리 정책이 요구됩니다.","cardImagePath":"","category":"기타","hash":"c5acf43753ed2d793fc9be5487dbdf35e22e4d9fe71d350d700ef535237eb1e3","industry":"일반·전체"},{"date":"2026-10-07","title":"(고용에 막힌 노사협상)②정년 대신 재고용 확대…갈등 재점화 우려","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTFBJeFcwM2w0cEVUUWJsTXE3eG9xM3RDNS1KTi1yVXFRZmxLUWl6NG5DMGo0bndqTFlSdFIzUWlkSHVMbFJYQWQ5SVFzeWRmLXVEWWF5TEZYblNQalhRQlZTSU1jSG11S0dhV1E?oc=5","source":"IB토마토","summary":"최근 노사 협상에서 정년 연장과 재고용 제도를 둘러싼 갈등이 핵심 쟁점으로 떠오르고 있습니다.\n경영계는 신규 채용 부담을 줄이기 위해 법적 정년 연장보다 퇴직 후 재고용 방식을 선호합니다.\n노동계는 고용 안정과 임금 유지를 위해 법적 정년 자체를 직접 연장해야 한다고 주장합니다.\n재고용 방식은 임금 감소와 처우 악화 가능성이 있어 노사 간 의견 대립이 격화되고 있습니다.\n정년 연장의 대안으로 추진되는 재고용 확대 정책이 오히려 노사 갈등을 재점화할 것으로 우려됩니다.","cardImagePath":"images/20261007_061025_5.png","category":"기타","hash":"ef49770d1944e93cee613159583d3d38841a628914875ca315a8eec131459f49","industry":"일반·전체"},{"date":"2026-10-07","title":"[오피니언] 70세 정년, 절충안을 제안하며","link":"https://news.google.com/rss/articles/CBMiZ0FVX3lxTE9yUkZDWG9tSjVCWUJkcFo1dGFMaGNUejdnWWNWUDRyOHBnM2hQLUtwNFlhRF8yMkFySzJsMXdqRTNRNGxsS3RhdVVXckt1NFl2aW9yXy1sMVVveEJoS05yS2FOU29vYUU?oc=5","source":"기독신문","summary":"교계 내에서 현행 70세 목회자 정년 제도를 두고 찬반 의견이 대립하고 있다.\n인구 고령화와 후임 목회자 수급 난항으로 정년 연장의 필요성이 제기된다.\n동시에 청년 목회자의 길을 막고 교회의 혁신을 저해할 수 있다는 우려도 존재한다.\n이에 정년 연장과 현행 유지 사이의 부작용을 줄일 수 있는 현실적 절충안이 제안된다.\n교단의 지속 가능성과 구성원 간의 상생을 위한 합리적 제도 개선이 필요한 시점이다.","cardImagePath":"images/20261007_061025_4.png","category":"기타","hash":"a8c663524f2f6854ca33ea9e702eb598d2e358fc2d7e8ecadab8f10f55669046","industry":"일반·전체"},{"date":"2026-10-07","title":"목회자 수급난에 커지는 '정년 연장' 목소리…과연 해법인가 -","link":"https://news.google.com/rss/articles/CBMiWkFVX3lxTE5pSEk0Rjg3cGl5QWpCOGRFNWV4ejdWaE1ra1dKOGE4Qk1VZnEwOV9VbldmaHh6aUhBZHlIYU1OM2YwVmF2QjExNWNid21ZUjJlWWdGQVRVeVJjdw?oc=5","source":"크리스천 노컷뉴스","summary":"최근 교계는 출생률 감소와 신학대 지원자 감소로 심각한 목회자 수급난을 겪고 있다.\n인력 부족 문제를 해결하기 위해 목회자의 정년을 연장해야 한다는 목소리가 높아지고 있다.\n정년 연장은 당장의 목회 공백을 메우고 경력 있는 목회자를 활용할 수 있는 방안으로 거론된다.\n그러나 젊은 목회자의 설 자리를 줄이고 교회의 세대교체를 막는다는 부작용 우려도 크다.\n단순한 정년 연장이 수급난의 근본적인 해법이 될 수 있는지에 대해 교계의 논의가 계속되고 있다.","cardImagePath":"images/20261007_061025_3.png","category":"기타","hash":"efa79eb227b191a848a69db104e752c4ceda266210e7f360f05aaf476b8e33ac","industry":"일반·전체"},{"date":"2026-10-07","title":"[국제토론회] 정년연장 쟁점과 과제-한국,일본,싱가포르 사례를 중심으로","link":"https://news.google.com/rss/articles/CBMivgFBVV95cUxPYVg1Mi13TnFxSjlYVE5TcVM0cDVGTmdJbWpwZlFlNTRIRUMyMEZoYno2ckYwY2QxYzJuTG9rWUdhMEdjelgxNTRFa2c1UFRXeEZIVEY5dWpZUkVSd3ZFS2RpdDd2bEtOSTJ4R0t2Nlp2TXZmV1VBZzNxU3dzRmVaQ3BVeTd4c2hBRS1zRzRtb3FwMHZVN1A4bV8tdmJrUzNDZUlfM0xrUG9oUjJvbUhDbDJWaElPVzVpd1F2RmNn?oc=5","source":"inochong.org","summary":"한국, 일본, 싱가포르의 사례를 중심으로 정년연장의 쟁점과 과제를 다루는 국제토론회가 열렸다.\n저출생 및 초고령화 사회 진입에 따른 노동력 부족 문제 해결을 위한 정년연장 필요성이 제기되었다.\n일본과 싱가포르의 고령자 고용 정책 및 재고용제도 사례를 통해 시사점을 도출했다.\n청년층 고용과의 충돌 완화 및 임금체계 개편 등 해결해야 할 주요 쟁점들이 논의되었다.\n각국의 대응 방안을 바탕으로 한국 노동 시장에 적합한 정년연장 제도 개선 방향을 모색했다.","cardImagePath":"images/20261007_061025_2.png","category":"기타","hash":"6de9a10b326236eb7590bb1fdad74f44b689a55f19746c2ca8c7bc5469289678","industry":"일반·전체"},{"date":"2026-10-07","title":"[이승윤의 노동과 삶]김 부장의 정년은 몇살이어야 했을까","link":"https://news.google.com/rss/articles/CBMiX0FVX3lxTE4wWHM3XzlmRGVGSmpQTDNtUFRWNERJUl8xZS1JTHRTSTVjeGtTUlgzRGxZZVl5S3JobUtkTDJBSzRBdkc5RjRwbVdTc3VRRHgyVWNicmtnZkFQR29oeGRZ0gFfQVVfeXFMTjBYczdfOWZEZUZKalBMM21QVFY0RElSXzFlLUlMdFNJNWN4a1NSWDNEbFllWXlLcmhtS2RMMkFLNEF2RzlGNHBtV1NzdVFEeDJVY2Jya2dmQVBHb2h4ZFk?oc=5","source":"경향신문","summary":"주채용 일자리에서의 실제 퇴직 연령과 법정 정년 사이에 큰 격차가 존재한다.\n퇴직 후 국민연금 수급까지의 소득 공백으로 중장년층의 노후 불안이 심화된다.\n초고령사회 대응을 위해 법정 정년 연장 및 계속고용 제도 도입이 논의되고 있다.\n청년 고용과의 갈등을 완화하기 위한 임금체계 개편 등 상생 방안이 필요하다.\n노동자의 안정적인 노후 보장과 지속 가능한 노동 환경 구축이 시급한 과제이다.","cardImagePath":"images/20261007_061025_1.png","category":"기타","hash":"aa21a449c1a7bad9ec2004c0808c51d85b4a67d624a20fc3c0db8376b3794da6","industry":"일반·전체"},{"date":"2026-10-06","title":"중견기업서도 인당 1500만원 임금 체납","link":"https://www.mk.co.kr/news/politics/12168631","source":"매일경제 : 헤드라인","summary":"","car 830f2b1c52621a882b6370ddd27c4934d4d20","industry":"방산·항공우주"},{"date":"2026-10-06","title":"블랙호크 대체기 수주한 美 벨, K-소부장서 공급망 파트너 찾는다","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE1GMTdNaE1xaENad2NMVmc2Zl9zNEwtWFJlRHkyZlVSbGdHR3B6RFFtVS1yeDcxSTVEeUxiRXExbHhXb3Vya2xQWGVSYzdFTnp3Y3R1QWtKRVhtcGxUYkZxMjlWSmVRV3dUWm9JOdIBbEFVX3lxTE1GMTdNaE1xaENad2NMVmc2Zl9zNEwtWFJlRHkyZlVSbGdHR3B6RFFtVS1yeDcxSTVEeUxiRXExbHhXb3Vya2xQWGVSYzdFTnp3Y3R1QWtKRVhtcGxUYkZxMjlWSmVRV3dUWm9JOQ?oc=5","source":"sbiztoday.kr","summary":"미국 항공기 제조업체 벨이 미 육군의 블랙호크 대체기 사업을 최종 수주했다.\n벨은 차세대 헬기 생산을 위해 한국의 소재·부품·장비 기업들과 협력을 추진한다.\n국내 우수 방산 기업들을 대상으로 글로벌 공급망 구축을 위한 파트너를 찾고 있다.\n이번 협력은 한국 K-소부장 기업의 미국 방산 시장 진출 발판이 될 것으로 기대된다.\n벨은 한국과의 파트너십을 통해 안정적인 항공 부품 공급망을 확보할 계획이다.","cardImagePath":"","category":"기타","hash":"d8a956174299b5262e2ca62098337c3a1eff3b111343845c9273bd569126fb9a","industry":"일반·전체"},{"date":"2026-10-06","title":"한·사우디 경제협력, 건설 넘어 미래산업으로 넓어진다","link":"https://news.google.com/rss/articles/CBMiZEFVX3lxTE16SzQ5MVpDbFd5Ylh0a2RvUW5QS3F0U2JXUl9KWi12ZTRfNFRVY2lBZ3FXY1Vkb0hjMGl6MlhQSllnNWZFUWNzMGJ3c0p0TDlxNVNvcHNiNklYX24wR09vU1ctUTY?oc=5","source":"매일일보","summary":"한국과 사우디아라비아의 경제협력이 기존 건설 중심에서 첨단 미래산업 분야로 대폭 확장되고 있다.\n양국은 네옴시티 프로젝트를 비롯해 스마트시티, 친환경 에너지, AI 등 다양한 분야에서 협력을 강화한다.\n사우디의 '비전 2030' 정책과 연계하여 한국 기업들의 현지 시장 진출 및 투자 기회가 더욱 확대될 전망이다.\n단순 건설 수주를 넘어 기술 이전과 공동 투자 등 상호 호혜적인 동반자 관계 구축이 추진된다.\n이번 협력 범위 확대는 양국의 지속 가능한 경제 성장과 산업 고도화를 이끌 차세대 동력이 될 것으로 기대된다.","cardImagePath":"","category":"기타","hash":"1e64a3ffc88fa405f9e4d616d0dbf04fc5a35a29555f4988d28d01a8c3fed01b","industry":"일반·전체"},{"date":"2026-10-06","title":"KAI 민영화 국감 질의 도마… 수출입은행 지분 정리 방향에 영향","link":"https://news.google.com/rss/articles/CBMibkFVX3lxTFBLZnZkbkhuSkFqcURJRXBGZFpGeWxwa3ctSUFhRnplMFRkQndIclZwWUo4Qm8yU19rX0dTTUlCT193WnE3OGJITU9HQ1NUZlZieWF5ODlPLUQwazFOMkpHV1JDSGVhcU55QnBJVEZR?oc=5","source":"폴리뉴스 Polinews","summary":"국회 국정감사에서 한국항공우주산업(KAI)의 민영화 추진 여부가 주요 현안으로 다루어졌다.\n한국수출입은행이 보유한 KAI 지분의 매각 및 정리 방향에 대해 국회의 질의와 지적이 이어졌다.\n국감에서의 논의 결과가 수출입은행의 향후 지분 처분 일정 및 방식에 영향을 미칠 전망이다.\n방위산업의 공공성과 국가 안보를 고려해 민영화에 대한 신중한 접근이 요구되고 있다.\n정부 및 관계 기관은 국감 질의 내용을 바탕으로 KAI 지분 구조 재편 방안을 검토할 것으로 보인다.","cardImagePath":"","category":"기타","hash":"4e7da010a2ef75025228f23ed949ec1208c5eb835c7f4fae4557c69ce412fdf8","industry":"방산·항공우주"},{"date":"2026-10-06","title":"대규모 공채 대신 '핀셋 채용'…하반기 은행권 키워드 '직무 전문성'","link":"https://news.google.com/rss/articles/CBMic0FVX3lxTE80WVhORnZvTkM2SHFubFlkZjdEVnZRWTBCbkNZeGJSeV9PaUlFR1Vab0VXaElWcUVFX0xQOFVLZ3h5cFFrdkZoX0VKRFl3OUpvckY2QkNJZXNUSVlCOENuWnBUV09kNGpvSHQ2Tk9jak9HaVnSAXNBVV95cUxPNFlYTkZ2b05DNkhxbmxZZGY3RFZ2UVkwQm5DWXhiUnlfT2lJRUdVWm9FV2hJVnFFRV9MUDhVS2d4eXBRa3ZGaF9FSkRZdzlKb3JGNkJDSWVzVElZQjhDblpwVFdPZDRqb0h0Nk5PY2pPR2lZ?oc=5","source":"newsworks.co.kr","summary":"하반기 은행권 채용 시장이 대규모 정기 공채에서 직무 중심의 핀셋 채용으로 전환되고 있다.\n디지털 전환 심화에 발맞춰 금융 분야별 직무 전문성을 갖춘 인재 확보가 핵심 과제로 떠올랐다.\nIT, 자산관리 등 특정 부문에서 즉시 현장에 투입할 수 있는 맞춤형 수시 채용이 늘어나는 추세다.\n획일적인 정량적 스펙보다 관련 직무 경험과 실무 역량이 중요한 합격 기준이 되고 있다.\n은행들은 불필요한 채용 비용을 줄이고 필요한 전문 인력을 적시에 확보하는 데 집중하고 있다.","cardImagePath":"","category":"채용","hash":"49a033f6db240f93a5d47860fde1356dce805221658269a9aa6018d3700e236c","industry":"금융"},{"date":"2026-10-06","title":"괴산군, 기업 인력난 해소·구직자 취업 지원 나서","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE9DZ2ltellQdWtBb2p1TU5pcVFwNEw0Y3Niblk1ZzRuNklubjVBUEJLcG9SaExscS1lT1c2MkFTYlVrOC1Kem01ZlBxNkIzUElXMTI2NloyWl9RY0w0TmZjWmhtZExQeDlvaE0taQ?oc=5","source":"충청도민일보","summary":"괴산군이 지역 기업의 인력난을 해소하고 구직자의 취업을 돕기 위해 종합 지원에 나선다.\n맞춤형 일자리 매칭 프로그램을 추진하여 기업과 구직자 간의 연결을 강화한다.\n현장 중심의 채용 행사와 취업 교육을 통해 구직자의 실무 역량 강화를 지원한다.\n지역 내 우수 기업을 발굴하고 안정적인 고용 환경을 조성하여 인구 유출을 막는다.\n앞으로도 지속적인 일자리 창출 정책을 펼쳐 지역 경제 활성화에 기여할 방침이다.","cardImagePath":"","category":"기타","hash":"60ac1f737a512a0d9dfbd3eb7884a15c2eb9e3c42eccb6f995d54b48a5cecf67","industry":"일반·전체"},{"date":"2026-10-06","title":"“中 휴머노이드 로봇 성장에 로봇 기술자 인력난도 덩달아 심화”","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE1rRHBDYVBBTS1kRVB6ZDdDaXZGVXhpSHFPdzdHZnJkWm1HNVJfcUs5LXVPNk1kMmpsSWpDNXNFLWJTMEprVWIzZi1QcVc4LUxBaTJoR2tnc21lV3VXRFNZSzZWNm1FTl9UOEVZTw?oc=5","source":"로봇신문","summary":"중국 휴머노이드 로봇 산업이 가파른 성장세를 이어가고 있다.\n로봇 시장이 급격히 확대되면서 전문 기술자에 대한 수요도 크게 늘었다.\n수요에 비해 인력 공급이 턱없이 부족하여 현장의 인력난이 심화하는 추세이다.\n핵심 인재 확보의 어려움은 로봇 기술 개발과 상용화 가속화에 걸림돌이 되고 있다.\n향후 지속적인 산업 발전과 경쟁력 강화를 위해 기술 인력 양성이 시급한 과제로 부각된다.","cardImagePath":"","category":"기타","hash":"9b096c5da4cbbc17c2609e931f96ae0097b06ed762eded938a6fedbc390ed282","industry":"일반·전체"},{"date":"2026-10-06","title":"대구의료원 의사 충원율 67.2%…지방의료원 인력난 지속","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE5DYmswSDZQWUV4bE43eU4zMXBPVG1TYUg4N2huWHFRWlhQUzFsRUlCbmVsSHJqbjk1R0owanNoLWNhUnRsLU5OUVozZlhndl9BN21pc002REJLNlRYb3oxT2xiaHJjSXBxVXZBZk9YTQ?oc=5","source":"kyongbuk.co.kr","summary":"대구의료원의 의사 충원율이 67.2%에 불과해 의료진 부족이 심각합니다.\n대구를 포함한 전국 지방의료원에서 만성적인 의사 구인난이 지속되고 있습니다.\n의사 인력 부족은 필수의료 공백과 지역 간 의료 격차 심화로 이어지고 있습니다.\n열악한 처우와 지방 근무 기피 현상이 인력 난항의 주요 원인으로 꼽힙니다.\n지방 공공의료 인프라 강화를 위한 실질적인 의료 인력 지원책이 필요합니다.","cardImagePath":"images/20261006_061000_5.png","category":"기타","hash":"8e1b8c4419da6917531b262521a15336e23c4c5ebc5a5bee72ec233f300cc5f2","industry":"일반·전체"},{"date":"2026-10-06","title":"권역중증외상센터 인력난 허덕…원광대 전문의 지원 4년간 '0명'","link":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE9xOFUyVXFicVlOMnA0UzUyUktoeXNqT3pSRnZxMFRUSkEzTmIyU2taSHhNM1BQTW4wRTNUT3R4LTR3OWszTEFVZnF0aTAzVl9DM1RILTgtQ1B0b3dOQzdFLdIBYEFVX3lxTE9xOFUyVXFicVlOMnA0UzUyUktoeXNqT3pSRnZxMFRUSkEzTmIyU2taSHhNM1BQTW4wRTNUT3R4LTR3OWszTEFVZnF0aTAzVl9DM1RILTgtQ1B0b3dOQzdFLQ?oc=5","source":"연합뉴스","summary":"지방 권역중증외상센터가 심각한 의료 인력난으로 운영에 큰 어려움을 겪고 있습니다.\n원광대병원 권역외상센터는 최근 4년 동안 신규 전문의 지원자가 단 한 명도 없었습니다.\n고된 업무 강도와 높은 위험성에 비해 열악한 처우가 전문의 기피의 주요 원인으로 꼽힙니다.\n인력 부재는 남은 의료진의 업무 부담을 가중시키고 지역 응급 의료 공백을 야기합니다.\n중증 외상 환자의 골든타임을 지키기 위해 실질적인 처우 개선과 정책적 지원이 시급합니다.","cardImagePath":"images/20261006_061000_4.png","category":"기타","hash":"1a093aa027aced304ccd9f77efd02c3bb8ed8022a67f144617765ee402b5e150","industry":"일반·전체"},{"date":"2026-10-06","title":"광명시 2027년도 생활임금 1만 2천270원 결정, 올해보다 3.7% 인상","link":"https://news.google.com/rss/articles/CBMiaEFVX3lxTE1oLTVvSi12SGx5X0lNdjhHV09VSnU0UHJPQjQ4UjE1RkhmdHg0UDhHcm9kUzBPVG53ajNNNGhzVkJJMWRjTGRjcGZweHJ4OGhvV0JBLXByVWhNZ0hpRU0wQ0U2YjhMQmlr?oc=5","source":"경기중앙신문","summary":"광명시가 2027년도 생활임금을 시급 1만 2천270원으로 확정했다.\n이는 기존 금액 대비 3.7% 인상된 수준이다.\n물가 상승과 근로자의 실질적 생활 안정을 종합적으로 반영한 결과이다.\n인상된 생활임금은 광명시 및 산하기관 소속 근로자 등에게 적용된다.\n광명시는 이번 인상 결정이 공공부문 노동자의 처우 개선에 기여할 것으로 기대한다.","cardImagePath":"images/20261006_061000_3.png","category":"기타","hash":"2fb2417ffd21a1ba60e32fbfb9c00be19a2a479d6ff72dae08a36c72a1029194","industry":"일반·전체"},{"date":"2026-10-06","title":"금천구, 2027년 생활임금 시급 1만2757원 확정...올해보다 5.2% 인상","link":"https://news.google.com/rss/articles/CBMicEFVX3lxTFBJNmZRWGhGSjhyVVNLVXVLakNWbThta21xM3V3SVdUZmRKVnhZcnlUaHpWWmFzMEhKNklybV9FM1Z4ZllraE1TcjVGVzc3WXF3WDdMd3ZzUW9OX01CZXZiUlctRlE2VjNYSDVvdWpGVTU?oc=5","source":"산경일보","summary":"서울 금천구가 2027년에 적용할 생활임금 시급을 최종 확정했습니다.\n확정된 생활임금은 시급 1만 2,757원으로 산정되었습니다.\n이는 올해 생활임금 금액과 비교하여 5.2% 인상된 수준입니다.\n금천구는 근로자의 실질적인 생활 안정과 삶의 질 향상을 도모합니다.\n인상된 생활임금은 지정된 대상 근로자들에게 차질 없이 적용될 예정입니다.","cardImagePath":"images/20261006_061000_2.png","category":"기타","hash":"2d84e4b8759c1b93639e860a765cbcfb88df3840d85371b84470d95f69a943cb","industry":"일반·전체"},{"date":"2026-10-06","title":"국민연금 68세부터 받나…정년 60세 퇴직 뒤 소득 공백 8년 우려... : 사회","link":"https://news.google.com/rss/articles/CBMiS0FVX3lxTFBxSk5Wd3I4WEJ6SkduVUp3MjgxYk4xRE1VUDZPWEZyTzNma3FwOWNOZXd3X21RVnVpcTFCSjg1WVpHbV9hNnBqMFVZcw?oc=5","source":"재경일보","summary":"국민연금 수령 개시 연령을 68세로 연장하는 방안이 검토되고 있다.\n현재 법정 정년이 60세에 머물러 있어 퇴직 후 연금 수령까지 시차가 발생한다.\n정년퇴직 이후 연금을 받기 전까지 최대 8년의 소득 공백이 우려된다.\n소득이 없는 기간이 길어짐에 따라 고령층의 노후 불안이 가중되고 있다.\n정년 연장이나 재고용 등 소득 공백을 완화할 대안 마련이 요구된다.","cardImagePath":"images/20261006_061000_1.png","category":"기타","hash":"db4e5c004ddec6458ccd4f5f313e9c06ab013019d6b452eab17aaa48d810136c","industry":"일반·전체"},{"date":"2026-10-05","title":"암호 화폐 특 금법 - 초보자부터 전문가까지 - 장단점 비교 분석","link":"https://news.google.com/rss/articles/CBMickFVX3lxTE9paDliSmRpRmJxeXhBUFhPNXJjVHNlLXdtTXZVV0xLTW55eUd6ZGxhZ1NNR2x3aDFKa18yYVpraW5tUDlBWFRfcENQRl9MaWZiQW1sdEp4NUdkalMyNko1dUk1WDk1eENuQVhxcG9nMi1Bdw?oc=5","source":"Calgary Roughnecks","summary":"특정금융정보법(특금법)은 암호화폐 거래의 투명성과 안전성을 높이기 위해 시행되었습니다.\n이 법은 초보자부터 전문가까지 모든 암호화폐 투자자와 관련 기업에 영향을 미칩니다.\n투명한 자금 흐름 확보와 투자자 보호 강화는 특금법의 주요 장점으로 평가받습니다.\n반면 엄격한 규제로 인한 시장 위축과 진입 장벽 상승은 단점으로 지적됩니다.\n시장 참여자들은 특금법의 장단점을 파악하여 변화하는 규제 환경에 대비해야 합니다.","cardImagePath":"","category":"기타","hash":"c0964669c881181ccfd3f643cd674879c34ca0a363d153037c5a44a2689a6496","industry":"일반·전체"},{"date":"2026-10-05","title":"“美 하이마스 팔고 한국 천무에 집중하자”…폴란드서 이런 주장 나온 이유 [밀리터리+]","link":"https://news.google.com/rss/articles/CBMiWkFVX3lxTE5FUFN2S3o1aldmZjlqTFdjZmp3Y0p3MllhdTRJVFROdUdJdWJSdnJ4aER1Y2JTR3BpYVhFcno2eWc5cXpQSS1vQTFudmx3aFkwWTBybExTb2lZZw?oc=5","source":"seoul.co.kr","summary":"폴란드 군사 전문가들 사이에서 미국산 하이마스를 처분하고 한국산 천무에 전력을 집중하자는 주장이 제기되었습니다.\n하이마스는 도입 지연과 비싼 가격, 현지 생산 및 기술 이전 제한이 주요 문제점으로 지적되었습니다.\n반면 한국의 천무는 신속한 납기와 폴란드 자국산 차체 및 시스템과의 뛰어난 호환성을 자랑합니다.\n현지 생산과 기술 이전을 통해 자국 방산 육성은 물론 군수 지원 및 운용 체계를 일원화할 수 있습니다.\n이에 따라 다연장로켓 운용 효율성을 극대화하기 위해 천무 단일 플랫폼으로의 재편 필요성이 강조됩니다.","cardImagePath":"","category":"기타","hash":"76368efd39088cd96d50985535ca445342e01f7f9d60938d96f13952cbd9d9d3","industry":"일반·전체"},{"date":"2026-10-05","title":"1조9000억원 KF-21 장거리 공대공 유도탄 사업, LIG·한화 역할 분담 가닥","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE9wRVlhTVNTMXpyY1Zic3ByeEh2SElkYkJrc1hVVVp3WXNESDdGNlBUMzV2VzkwVC1nVmVoSjZWanVjd1JLMjlBSjJxanhoZmhyNEJ0aTl6Z2tVclZVd0thcDV6VzA5b3dCalFpeWRVQdIBb0FVX3lxTE9wRVlhTVNTMXpyY1Zic3ByeEh2SElkYkJrc1hVVVp3WXNESDdGNlBUMzV2VzkwVC1nVmVoSjZWanVjd1JLMjlBSjJxanhoZmhyNEJ0aTl6Z2tVclZVd0thcDV6VzA5b3dCalFpeWRVQQ?oc=5","source":"더퍼블릭","summary":"약 1조 9천억 원 규모의 KF-21 장거리 공대공 유도탄 개발 사업의 기업 간 역할 분담이 윤곽을 드러냈습니다.\nLIG넥스원이 유도탄 체계종합과 탐색기 개발을 주도하며 전체 사업의 이끄는 역할을 담당합니다.\n한화그룹 계열사는 람제트 엔진 중심의 추진기관과 주요 유도조종 부품 개발을 맡게 됩니다.\n국내 대표 방산 기업 간의 효율적 역할 분담을 통해 사업 중복 투자를 방지하고 개발 속도를 높일 계획입니다.\n이번 장거리 공대공 유도탄의 국산화는 KF-21의 무장 자립도 향상과 해외 수출 경쟁력 강화에 크게 기여할 전망입니다.","cardImagePath":"","category":"기타","hash":"be59df455ef0018b5bc9b71f3938b1552e51c840a97dfcae12419190446d1379","industry":"일반·전체"},{"date":"2026-10-05","title":"현무-5 환호 뒤 '척박한 현실'…방산 스타트업 고사 위기","link":"https://news.google.com/rss/articles/CBMiaEFVX3lxTFBaQUUxNE1VOW11cnVyOHJ5bFNpTVZkTWtuTmJ0MURTYXBxTGxvX2JyNk11YWFjMjNZdlZ6UDlNX3FfTlNQVE52a0xVNy1nUzdiS3RPNDZoQW1jbUxmTGdSWDhoazE0TUR0?oc=5","source":"동행일보","summary":"현무-5 등 K-방산의 화려한 성과 뒤에는 국내 방산 스타트업의 열악한 현실이 존재한다.\n방위산업 특유의 높은 진입장벽과 대기업 중심 구조로 스타트업의 시장 진입이 어렵다.\n복잡한 군 인증 절차와 오랜 개발 기간은 신생 기업의 심각한 자금난을 야기하고 있다.\n우수한 기술력을 갖추고도 실증 기회와 정책적 지원이 부족해 고사 위기에 직면해 있다.\nK-방산의 지속 가능한 성장과 생태계 조성을 위해 스타트업 맞춤형 지원 체계 마련이 시급하다.","cardImagePath":"","category":"기타","hash":"0762e9f9df5596247e3bebfac1d7fe71f55ad47aa5b56cd1bdd6388db1fadaa2","industry":"방산·항공우주"},{"date":"2026-10-05","title":"FA-50, 러 드론 잡으러 뜬다…폴란드 전투대기 돌입, ‘저비용 무장’도 추진 [밀리터리+]","link":"https://news.google.com/rss/articles/CBMiWkFVX3lxTE1VbE4wazVjZEhybnBvdXNqSEVkY3lHQnlTT1pQcVd6NDZtM2xmdi01RGk4VGFvME1FZ21DM3Btb2JKOGFWRFU0SE0xXzdpZHE3LU9qb2xQSkVvZw?oc=5","source":"seoul.co.kr","summary":"폴란드에 인도된 한국산 FA-50 경공격기가 영공 수호를 위해 전투대기 태세에 돌입했습니다.\n이번 배치는 최근 지속되는 러시아 드론의 영공 침범 위협에 대응하기 위한 조치입니다.\n저렴한 드론을 효율적으로 제압하기 위해 가성비 높은 저비용 무장 체계 도입도 추진됩니다.\nFA-50은 고가 미사일 소모를 줄이면서 드론을 요격할 수 있는 최적의 대안으로 평가받습니다.\n폴란드 공군은 FA-50을 실전 배치하여 자국 방공망을 한층 강화할 방침입니다.","cardImagePath":"","category":"기타","hash":"ad7dd1e1f9bae6133145d317e466c3996c62d80ae8a7ee0388a263f3f5da946a","industry":"일반·전체"},{"date":"2026-10-05","title":"첫 KF-21 공군 품으로…F-5 빈자리 메울 ‘보라매’에 남은 3대 과제","link":"https://news.google.com/rss/articles/CBMickFVX3lxTE1kY2hFUkJGY1hIUnpWelM0QmpiZWtLUWJ0dmFGOEhzZTFnbDlGLUZITkhadDNMRlNqY2RHTGpTd2Nvd0hIQkhuSXlRZlRpUnhOSFhMSVQyS2JvQkZYUlNXb2Qyb1dEY1JQN2EzbURoYzg1d9IBckFVX3lxTE1kY2hFUkJGY1hIUnpWelM0QmpiZWtLUWJ0dmFGOEhzZTFnbDlGLUZITkhadDNMRlNqY2RHTGpTd2Nvd0hIQkhuSXlRZlRpUnhOSFhMSVQyS2JvQkZYUlNXb2Qyb1dEY1JQN2EzbURoYzg1dw?oc=5","source":"팝콘뉴스","summary":"한국형 전투기 KF-21 보라매가 본격적인 양산에 돌입하며 공군의 노후 전투기 대체에 나섰다.\n이번 전력화는 오랜 기간 운용된 F-5 전투기의 노후화에 따른 전력 공백을 메울 것으로 기대된다.\n성공적인 실전 배치를 위해 다양한 무장 통합 능력 확보와 항공무장 국산화가 핵심 과제로 꼽힌다.\n향후 블록2 개발을 통한 완벽한 공대지 전투 능력 확장과 체계적인 성능 개량이 지속적으로 필요하다.\n글로벌 시장 진출을 위한 가격 경쟁력 확보와 안정적인 양산 체계 구축이 주요 과제로 남아있다.","cardImagePath":"","category":"기타","hash":"79539065824aa0cdf2ff70cdd0c02cce03ae59222dcfe195d20e43fd33711641","industry":"일반·전체"},{"date":"2026-10-05","title":"폴란드, 한국제 전투기를 실전 배치","link":"https://news.google.com/rss/articles/CBMihAFBVV95cUxPSVNMRFRQS0l2VWpoSHRZWDlvOFpQRUNnMFBrTm9ub2hqQ0RkXzU2YWctUFpDS25VNHRKTDM1LWVtVzk0T3MyQU1sX29VUlpwTngwZTZHcHNEb2xUSXVURm4wN2h4ZTlRX09LQVc0RTMySXFGRHhPVlBQN3ZReUZfZ1VrQmk?oc=5","source":"Vietnam.vn","summary":"폴란드가 한국으로부터 도입한 경공격기를 공군 전력으로 실전 배치했다.\n이번 배치는 노후화된 구소련제 전투기를 대체하여 공군력을 강화하기 위함이다.\n한국산 전투기는 폴란드 영공 수호 및 나토 연합 작전 임무에 즉각 투입된다.\n신속한 납기와 우수한 성능을 바탕으로 양국 간 방산 협력이 결실을 맺었다.\n이번 실전 배치는 유럽 방산 시장에서 한국 무기체계의 위상을 높일 것으로 기대된다.","cardImagePath":"","category":"기타","hash":"d1dd24d4d59426d14a65f7bcdb93e446faace0b6539e8c84a34cdcb4bf240045","industry":"일반·전체"},{"date":"2026-10-05","title":"한국농어촌공사, 전국 329명 신입 공채","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTE83V3VXWEhSRlZwRjBRZ1I0eDBEV0l2WGtrV3RUN0ctbHZWcHF5Y2plUDN5ZVk4WEdqcnVPckdaRVdhQzNTNnZrQ1FDb2tPM0JYVklkd1hsakdMVTJDdnNPaVd6bm9Eb3J2MUHSAW5BVV95cUxPNTV6QktLdFRaZGMzaGxVOEwtS3dPdV9YWmJUeFFKUHFjS3JQZGoxUDdOTnlkS3E5blFFYVNOV2VWVzRQdzFJZGtwVkxQcXhMZ0JSWjlxTktwS1AwU3V2WkVVOGZncHBLYzhZbUJsZw?oc=5","source":"퍼블릭타임스","summary":"한국농어촌공사가 전국 규모로 총 329명의 신입사원 공개채용을 실시한다.\n채용은 행정과 토목 및 전기 등 다양한 직무 분야에서 폭넓게 진행된다.\n공정한 기회 제공을 위해 학력과 연령 제한이 없는 블라인드 채용 방식을 적용한다.\n서류 심사와 필기시험 및 면접 절차를 거쳐 최종 합격자를 선발하게 된다.\n이번 채용은 농어촌 발전과 청년 일자리 창출에 도움이 될 것으로 기대된다.","cardImagePath":"","category":"기타","hash":"e7561f7f5de5678a4e469601ff638c9216911d43a4d075b86de7dece5863b8dc","industry":"일반·전체"},{"date":"2026-10-05","title":"완주군, 일자리 매칭데이로 18명 채용 확정","link":"https://news.google.com/rss/articles/CBMihwFBVV95cUxQVTlIeVBJTkVta1Q1ZWVkNlVrLXhNb0Vja2ZCZmE5RGJzVnJMSnFiLX 미래 국방과 우주 수송의 핵심인 극초음속 비행체 관련 기술이 대거 출품되었다.\n발사 비용 절감과 우주 접근성을 높일 재사용 발사체 개발 성과가 강조되었다.\n한국 우주항공 기업들은 이번 전시를 통해 기술적 도약과 글로벌 경쟁력을 입증했다.","cardImagePath":"","category":"기타","hash":"f0d6d0c38052f7a69b8e3a876be4d9eecc1ba893a0a4a4d532b0f5c63db86081","industry":"일반·전체"},{"date":"2026-10-04","title":"KAI 민영화 열쇠 쥔 정부, 국감서 입장 나오나","link":"https://news.google.com/rss/articles/CBMiZEFVX3lxTE1Pb3ZENThuazdnT1ktN2FDWS1PMmZSUDZMMm1ILThfN1pDTnlfbzFOMW03NGR5elZTT19raWRKempRbVhuU3lsYjZGdXRpYVNmem9VY3pUempfUHdGaFp1YW0yV2o?oc=5","source":"디지털데일리","summary":"한국항공우주산업의 민영화 추진 여부를 두고 정부의 결정에 관심이 집중되고 있다.\n대주주인 한국수출입은행의 지분 매각 방향이 민영화 성패의 핵심 열쇠로 꼽힌다.\n다가오는 국정감사에서 정부와 관계 기관의 공식 입장이 표명될지 주목받고 있다.\n방위산업 및 국가 안보와 직결된 사안인 만큼 신중한 검토가 요구되는 상황이다.\n정부의 결정에 따라 향후 국내 항공우주 산업 생태계 전반에 큰 파장이 예상된다.","cardImagePath":"","category":"기타","hash":"3a81be5bbdfee645047feab6c52d30cd04a9f63f890208909fbfb3bd78c1f2c4","industry":"방산·항공우주"},{"date":"2026-10-04","title":"[노트북을 열며] KAI 지배구조 , 중소 방산업체와 지역의 미래도 물어야","link":"https://news.google.com/rss/articles/CBMickFVX3lxTE5QUURyaWFfRnBKUEotVmxIU212QU5pemtnNkN4aUxZLTRGNVdlWl9MWkg0YUtrS1JLZjlxQWxCdHlHd1dKa3U0YVV4czdVUldlUkQ0bWoxc0hqRTVNTy03WkxXYktJc3Q4TEwtZnA4RnZEQQ?oc=5","source":"굿모닝충청","summary":"한국항공우주산업(KAI)의 지배구조 개편 및 민영화 논의가 다시 주요 이슈로 부각되고 있다.\n지배구조의 변화는 단순한 기업 경영권을 넘어 국내 방산 생태계 전반에 중대한 영향을 미친다.\n대기업 중심의 지배구조 재편은 협력 관계에 있는 지역 중소 방산업체의 생존을 위협할 수 있다.\nKAI 본사가 위치한 지역 사회의 고용 안정과 지역 경제 악화에 대한 우려도 커지고 있다.\n지배구조 논의 시 단기적 매각 성과보다 국가 방위산업 발전과 지역 동반성장을 최우선으로 고려해야 한다.","cardImagePath":"","category":"기타","hash":"161d515208d342c4670321fac0e618ef2ef1dc068421401ce2a00f2efcbcd605","industry":"방산·항공우주"},{"date":"2026-10-04","title":"은행 채용도 'AI 중심'···신입 줄이고 전문인력 골라 뽑는다","link":"https://news.google.com/rss/articles/CBMidkFVX3lxTE8xRWJTUTh4UzZqU3hSdUtLbXdlZ3dObl9tb1hOMWx0c3hFMjI0NWN1UTY2ZUlJaXRPY0ViZ3J1MWptWTR1MHJLd3lobXZLNmxlemFUOFRndzl3U2hiazhhaTFRTXFjNmtiUURBWnByNFJTZzEyT1HSAXZBVV95cUxPMUViU1E4eFM2alN4UnVLS213ZWd3Tm5fbW9YTjFsdHN4RTIyNDVjdVE2NmVJSWl0T2NFYmdydTFqbVk0dTByS3d5aG12SzZsZ e":"전남타임스","summary":"조선산업의 지속 가능한 발전을 도모하기 위한 전략적 방안이 모색되고 있다.\n인공지능 기반의 AX 전환을 추진하여 산업 전반의 경쟁력을 강화한다.\n조선업계의 주요 현안인 만성적인 인력난 해소에 역량을 집중한다.\n스마트 공정 도입과 기술 혁신으로 생산 효율성을 제고한다.\n지역 산업 생태계를 활성화하여 조선산업의 미래 성장 기반을 구축한다.","cardImagePath":"","category":"기타","hash":"96da085cdb9b670d8a82e43a37dc2feefbe278be33343a6f51c72f97e7715787","industry":"제조·자동차"},{"date":"2026-10-04","title":"영덕군, 라오스 계절근로자 23명 입국… 농촌 인력난 해소","link":"https://news.google.com/rss/articles/CBMiTEFVX3lxTFA2QjNucFc2ZjVnY3l5bFFmNnYyNHhteEFKdGpNeklmWndRaXRtM1VQRkpMZzJKMEQ2UDV5aU9XSkVRR1N1NWFvNE0zb2g?oc=5","source":"ghcyy.kr","summary":"영덕군에 라오스 외국인 계절근로자 23명이 입국했습니다.\n이번 배치는 농번기 농촌 일손 부족 문제를 해결하기 위해 추진되었습니다.\n근로자들은 지역 내 농가에 배치되어 농작업을 지원할 예정입니다.\n영덕군은 계절근로자 도입을 통해 농가 인력난 해소를 기대하고 있습니다.\n향후 근로자들의 안정적인 적응과 체류 관리를 위한 지원을 이어갈 계획입니다.","cardImagePath":"","category":"기타","hash":"b8e962a5bb1615fff9d4b7032e5c94266a40b8c4a9cd31543745ab5c62a8b63c","industry":"일반·전체"},{"date":"2026-10-04","title":"지역인자위 성과 공유회 '자화자찬'…스타트업 인력난은 외면","link":"https://news.google.com/rss/articles/CBMiaEFVX3lxTFBDSE0yX0pjMTA0U1NLdVVQWE5TdUlLRi1NUTlVWVVtc1pvcDNUYzQxVzNGSzhLV19hNmZGc3BjX0cwc3NpUFhiLWJOWVhDQjRQRE1YUFNRNXFNYWFIV1RJZ2RLbmZfQ2k2?oc=5","source":"동행일보","summary":"지역인적자원개발위원회가 성과 공유회를 개최했으나 실효성 논란이 일고 있습니다.\n해당 행사가 주최 측의 성과를 과시하는 자화자찬에 머물렀다는 비판이 제기되었습니다.\n현장 스타트업들이 직면한 심각한 인력난과 구인 문제는 제대로 다뤄지지 않았습니다.\n실질적인 인력 지원 정책 없이 형식적인 성과 발표에 치중했다는 지적이 이어집니다.\n지역 기업의 현실적 수요를 반영한 실효성 있는 인력 지원책 마련이 시급합니다.","cardImagePath":"images/20261004_061015_5.png","category":"기타","hash":"8173b64f984006af5f962ea3377e3fed45adc7f44cf5a13830f1bfdbe01cf2ef","industry":"IT·플랫폼"},{"date":"2026-10-04","title":"98.8% 체인점 인력난 호소한 대만 TCFA 사례로 본 서비스업 외국인 근로자 도입 실무 과제","link":"https://news.google.com/rss/articles/CBMiSkFVX3lxTFBfcEhIS1U3WlVVUDJ6cEFSQXJfR0FGaUVuT3pYMU9nYUROVTlTa0lHSTFHcHFIWFBiNGowWThfa3hVRW0xcXpZdWV3?oc=5","source":"얼리어답터뉴스","summary":"대만프랜차이즈협회 조사에서 체인점의 98.8%가 심각한 인력난을 호소했습니다.\n서비스업의 구인난을 해결하기 위해 외국인 근로자 도입 필요성이 급증하고 있습니다.\n외국인 근로자 도입 시 언어 소통과 직무 교육 등 실무적인 난관이 예상됩니다.\n서비스 품질 유지를 위해 맞춤형 교육 체계와 명확한 관리 가이드라인이 요구됩니다.\n국내 서비스업도 대만 사례를 참고하여 외국인 인력 수급 정책을 선제적으로 정비해야 합니다.","cardImagePath":"images/20261004_061015_4.png","category":"기타","hash":"4b25b08dfd6a5cf1ac3438f25caa5ebcc595cc8f0fd2664a578c067355601017","industry":"일반·전체"},{"date":"2026-10-04","title":"[데스크칼럼] 포스코노조 김성호 위원장, 임금보다 ‘포항제철소의 미래’를 받아내야 한다","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE1uUklueFgyTGJTaUJxYVVQX2RoWE5McUVxUnZmV19YV081V19pN1pITkFsNTI1Z2h1TnRjd2V1QlhJWnFpQXhuNmd4c2ZadHN2T2wxSjVqRmxPay1lUGVoWE5QMTF2M2pVWkRhUQ?oc=5","source":"콜뉴스24","summary":"포스코 노동조합의 임금 협상에서 장기적인 미래 전략 수립의 필요성이 제기되었다.\n김성호 위원장은 단기적인 임금 인상보다 포항제철소의 미래 생존권을 확보해야 한다.\n친환경 제철 기술 도입과 설비 투자 등 지속 가능한 성장 기반 마련이 시급하다.\n조합원의 실질적 복지는 제철소의 경쟁력 유지를 통한 고용 안정에서 비롯된다.\n노조가 단순한 임금 투쟁을 넘어 기업의 미래 투자를 끌어내는 결단을 내려야 한다.","cardImagePath":"images/20261004_061015_3.png","category":"기타","hash":"4cedd712845b2cb8edf1014744d0f1921836434e519cb09a4273d05a900f6f73","industry":"일반·전체"},{"date":"2026-10-04","title":"청년 10명 중 8명 “정년연장 시 신규 채용 감소 우려”","link":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE1wNmRORkFrVzdYaEk4WnNMX0ptdW5LQlFJUVZfZWV1RUJnbE8xaXNRTkJlR0pfZGYxTGhtNGt6MmRsQTdfVDFrTktubEVqNWlQZmR0bG9R?oc=5","source":"위키트리","summary":"청년 10명 중 8명은 정년 연장이 시행되면 청년 신규 채용이 감소할 것이라고 우려했다.\n정년 연장으로 인해 청년층의 취업문이 더욱 좁아질 수 있다는 불안감이 크게 작용하고 있다.\n청년들은 정년 연장에 앞서 임금체계 개편 등 노동 시장의 유연성 확보가 필요하다고 보았다.\n기업의 인건비 부담이 증가하면 청년층 일자리가 가장 먼저 줄어들 수 있다는 지적이 나온다.\n세대 간 일자리 갈등을 줄이고 청년 고용을 보호하기 위한 정책적 대책 마련이 시급하다.","cardImagePath":"images/20261004_061015_2.png","category":"채용","hash":"4a573c9cfc571b15ca2f9ad1b588229ce9237bbdfe0cb9de5e684a479a4b5836","industry":"일반·전체"},{"date":"2026-10-04","title":"대기업, 정년 퇴직자 재고용↑...청년 일자리는 걱정","link":"https://news.google.com/rss/articles/CBMiXkFVX3lxTE8tMHVEbEtvWGRTMzRxWno0bkgteTI3YWdkaHRpZGRGR3JMdVRFbm15b21pVGN3ckRmMDhFSzF2LXpid2dMVWF4QzdPYWlQQVh2SmhOeTFQODIzblZSTkE?oc=5","source":"YTN","summary":"주요 대기업들이 정년에 도달한 퇴직자를 다시 고용하는 제도를 적극 도입하고 있다.\n숙련된 인력과 경험을 계속 활용하고 고령화로 인한 인력 부족에 대응하기 위함 542c31727cb576dae601f0f244beb2ea2","industry":"일반·전체"},{"date":"2026-10-02","title":"광양시 내년 생활임금 시급 1만1550원…전년比 4.8%↑","link":"https://news.google.com/rss/articles/CBMiZEFVX3lxTE1Db1RFZVNHVDNMTndpMERlLVhXSHBlUjRsRGFTZGtGVlBmSzRuS1h6MzBMRXdpM2pBdnExUnhEWXlpWVZIVzV2VG9EdEpWU3R4X3FRdXFNSDNyd1d6VVNPNTMxRVDSAWRBVV95cUxNQ29URWVTR1QzTE53aTBEZS1YV0hwZVI0bERhU2RrRlZQZks0bktYejMwTEV3aTNqQXZxMVJ4RFl5aVlWSFc1dlRvRHRKVlN0eF9xUXVxTUgzcndXelVTTzUzMUVQ?oc=5","source":"뉴스1","summary":"광양시가 내년도 생활임금 시급을 결정했습니다.\n확정된 내년 시급은 1만 1550원입니다.\n이는 올해 대비 4.8% 인상된 금액입니다.\n지역 근로자의 안정적인 생활 수준 보장을 목표로 합니다.\n확정된 생활임금은 내년부터 본격 적용됩니다.","cardImagePath":"","category":"기타","hash":"d6984f4357b8465c669b9ff470383db36d7ee7b6a5e8d0074624cdc39c938215","industry":"일반·전체"},{"date":"2026-10-02","title":"한국노총, 민주당에 \"정년연장 특위 조속히 재개하라\" 공문","link":"https://news.google.com/rss/articles/CBMiY0FVX3lxTFA0WG1uY2ZBdER0UEstbzdjMEQzRUh4TGpLc3Q2a1VrbVR2UDY5MFl6TWJCSGNMUXV0WFBEYUdMMzFWOGJ1dndPNE9KNTE2VUgtVnRrZjMxdDZIZkd6ZWtTYWRBQQ?oc=5","source":"국민기자뉴스","summary":"한국노총이 더불어민주당에 정년연장 특별위원회의 조속한 재개를 요청하는 공문을 전달했다.\n저출생 고령화 심화에 따라 법정 정년 연장과 관련 논의의 시급성을 강조했다.\n국민연금 수급 연령과의 불일치로 발생하는 고령자의 소득 공백 문제 해결을 촉구했다.\n중단된 국회 차원의 사회적 대화를 재개하여 고용 안정 대책을 마련할 것을 요구했다.\n정치권이 노동계의 목소리를 반영해 정년연장 입법 추진에 적극 나설 것을 강력히 당부했다.","cardImagePath":"","category":"기타","hash":"c9ceddc2fd53895a86cffd184eb2ab689cbdb822fdbb1dc87cc76c6dd6ca9c43","industry":"일반·전체"},{"date":"2026-10-02","title":"정년 넘겨도 임금 그대로…고령자 모시는 日[글로벌왓]","link":"https://news.google.com/rss/articles/CBMiUkFVX3lxTFB3UndJRm0yeklWUkN5TEVDdVN2cHlPeWdNNUtZUzk3eXdPQXBJdUstUG5VNG1WeldFTEpDLXZ1NldnM3BMOUV2RUlvQkJUM21ONUHSAVNBVV95cUxQUUNGcUdOMzQ3VV80SHVOUF9JeGhOX0Z1dGZ0SHFqeFFvTmJzX1RDNExsRHFJNVp2aWNJeWJCZkJMU2toVDBSN2tCVFlRaFdkM0E1QQ?oc=5","source":"sedaily.com","summary":"심각한 저출생·고령화로 인한 구인난을 겪는 일본 기업들이 고령 인력 확보에 적극적으로 나서고 있습니다.\n과거에는 정년 연장이나 재고용 시 임금을 크게 깎았으나 최근에는 기존 임금을 그대로 유지하는 사례가 늘고 있습니다.\n숙련된 고령 근로자의 기술과 경험을 계속 활용하여 기업의 생산성과 경쟁력을 유지하려는 취지입니다.\n일본 정부 또한 고령자 고용 촉진을 위한 제도적 지원과 정년 연장 권고 정책을 강화하고 있습니다.\n이는 노동력 부족 해소와 더불어 고령층의 경제적 안정 및 사회 참여를 확대하는 효과를 가져오고 있습니다.","cardImagePath":"","category":"기타","hash":"41da4b25a3dce6052d3e3f0925304076a8bed00e5e0c8904104c80fe284d3950","industry":"일반·전체"},{"date":"2026-10-02","title":"65세 정년연장 ‘지지부진’ 지적…“상반기 중 입법하라” [쿡 정치포토]","link":"https://news.google.com/rss/articles/CBMiY0FVX3lxTE5wTFpNUWU5ZGFlREdidlFxWXNZelNLdFR2blZQYzlrQ3dDUHFSMmxrYlNaVHoxVG5acnU4QTVnQU5LcXNyalZvd0k0V3doVkVYZk5keHNYLUtDOTN0OXhBT0RHdw?oc=5","source":"쿠키뉴스","summary":"세 정년 연장에 대한 논의와 법률 제정 작업이 지지부진하다는 지적이 제기되고 있다.\n고령화 사회 심화에 대응하기 위해 정년 연장을 조속히 제도화해야 한다는 목소리가 커지고 있다.\n관련 단체와 정계 일각에서는 올해 상반기 중으로 입법을 완료할 것을 강력히 촉구했다.\n정년 연장은 노후 소득 공백을 메우고 생산연령인구 감소를 완화하기 위한 핵심 과제로 꼽힌다.\n청년 고용 부담 완화와 기업 재정 대책 등 구체적인 후속 방안 마련도 함께 요구되는 상황이다.","cardImagePath":"","category":"기타","hash":"9656a0a2804903e89a01bbf007d70839a5d591498a318c235ae6ff76613b053c","industry":"일반·전체"},{"date":"2026-10-02","title":"“정년 69세로 늘려야”…제주 생활지원사 고용안정 촉구","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE92Y3FYUFB2X2ZMX3ZaejBpSnpUaXJQMEtGT19BTTl2TndyWnppSjVRUkZIUnVHek5uOXV4eDlYYXV1TFZDcHZhaDdOTXg2cExLLU1STm56VVhSangyVF9yN004RFFqZ1pNci13dg?oc=5","source":"제주매일","summary":"제주 지역 생활지원사들이 인력 고용 안정 조치를 촉구했습니다.\n돌봄 노동자의 정년을 69세로 연장할 것을 요구하고 있습니다.\n고령화 심화에 따라 돌봄 서비스의 연속성이 중요해졌기 때문입니다.\n매년 반복되는 불안정한 계약 구조를 개선해야 한다고 주장합니다.\n제주도와 관계 기관에 실질적인 고용 대책 마련을 강력히 호소했습니다.","cardImagePath":"","category":"기타","hash":"4f744ab35d8c38302fe19308990756e400c378ce6405e3e1334fb3a65fc910ab","industry":"일반·전체"},{"date":"2026-10-02","title":"청년 10명 중 8명 \"정년연장 시 신규 채용 감소 우려\"","link":"https://news.google.com/rss/articles/CBMiWEFVX3lxTFAya295ME5yaGJMRzNocndIZXNhM3VIQjc4UDJmSGJ3QWNLb1pxQ1JnNllOeFRTYTNkcUQ0UXRTV3NxSTF0d1hydklEenhzQk9EU2ZjSnk1QUM?oc=5","source":"경북신문","summary":"청년 10명 중 8명이 정년연장 추진 시 신규 채용이 감소할 것을 우려하고 있습니다.\n정년연장에 따른 인건비 부담이 기업의 청년층 채용 여력을 줄일 것이라는 이유입니다.\n취업난이 심각한 상황에서 세대 간 일자리 갈등이 더 심화될 수 있다는 지적도 나옵니다.\n청년층의 고용 불안을 해소하기 위한 신규 채용 확대 대책이 함께 논의되어야 합니다.\n정년연장과 청년 고용이 동반 성장할 수 있는 세대 상생형 노동 정책 마련이 필요합니다.","cardImagePath":"","category":"채용","hash":"41c36daf9007970e50318aa09375895c8821c8867dac00b308ae6b69bb3792bc","industry":"일반·전체"},{"date":"2026-10-02","title":"[fn이사람] \"50대에 정년 걱정 덜어주니… 고난도 연구 온전히 집중\"","link":"https://news.google.com/rss/articles/CBMiRkFVX3lxTFAyanV3TkZNbC1NbE1iZno1VFZOYWhHbHpCLWxJeU4zOFVGYnJqQUJ0cTBGdndxS0Y2TGJkQ2xpTHEzcVdSdFE?oc=5","source":"v.daum.net","summary":"대 연구원들의 정년 불안감을 해소하기 위한 지원 환경이 조성되고 있다.\n정년 걱정이 줄어들면서 연구원들이 고난도 연구에 온전히 몰두할 수 있게 되었다.\n신분 안정은 장기적이고 도전적인 연구 과제를 지속하는 핵심 기반이 된다.\n숙련된 중장년 연구 인력의 노하우와 축적된 경험을 지속적으로 활용할 수 있다.\n이는 연구 몰입도를 높여 궁극적으로 국가 과학기술 경쟁력 강화로 이어진다.","cardImagePath":"","category":"기타","hash":"0d6a81b78c0b1ff4993cdf66c2b81c2dbad307bebc387c40f0e2eb1de70d87f2","industry":"일반·전체"},{"date":"2026-10-02","title":"[정년 후 재고용] 고용노동부, 고령자 계속고용장려금 확대 “비수도권 월 40만원·수도권 30만원, 최대 3년 지원”","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTE9SMkFMUzdBX21ocUZEVmRVNlpZaDVIMUlNd2V3R3NCSG9haFhhdFpuc3dQZ21SVk95NGdoMV92MmN6NUZ5NFo4QTNsSVVyVnlfZWlRcWVkbjlJWGFMOVdPWkZyRXFQMjREaFE?oc=5","source":"뉴스앤넷","summary":"고용노동부가 정년 이후 고령 근로자의 계속 고용을 지원하는 장려금 제도를 확대합니다.\n정년 후 재고용 등 고령자 고용을 유지하는 사업주에게 장려금을 지원합니다.\n지원 금액은 지역별로 차등 적용되어 비수도권 사업장에는 월 40만 원이 지급됩니다.\n수도권 사업장의 경우 월 30만 원의 장려금이 지원됩니다.\n해당 장려금은 고령자 계속 고용 확산을 위해 최대 3년 동안 지원될 예정입니다.","cardImagePath":"images/20261002_061021_5.png","category":"기타","hash":"6742f62367e6c5532589515914bc03d11a3898f6eb69c0c9b77ca97ec83881d3","industry":"공공·정부"},{"date":"2026-10-02","title":"“어르신 곁 지킬 수 있게”…제주 생활지원사 노조, 정년 연장 촉구","link":"https://news.google.com/rss/articles/CBMia0FVX3lxTE9WdDdONERncXBkaG9PTHk0MFYtblIxLXJIdlRIQWd6WlZoS3pOTmotOFNMeWxIS2xXR1daeGtTV2VCaFdOa3ItWENmZjloOGxBUnVZQko5Q3JSeHJZYnF2RGRHRWUwY2s1aHB3?oc=5","source":"제주의소리","summary":"민주노총 전국돌봄서비스노동조합 제주지부가 생활지원사의 정년 연장을 촉구하는 기자회견을 개최했습니다.\n노조는 노인 맞춤 돌봄 서비스를 담당하는 생활지원사의 정년을 현행 만 60세에서 만 65세로 연장할 것을 요구했습니다.\n급증하는 돌봄 수요 속에서 숙련된 생활지원사들이 정년 제한으로 현장을 떠나는 문제가 지적되었습니다.\n노동자들은 건강과 업무 능력이 충분함에도 불합리한 정년 기준으로 인해 일자리를 잃고 있다고 강조했습니다.\n제주도정과 관련 기관이 고령 노동자의 고용 안정과 안정적인 돌봄 체계 구축을 위해 정년 연장에 나설 것을 촉구했습니다.","cardImagePath":"images/20261002_061021_4.png","category":"기타","hash":"091d6dd37c703d0921c132b90ba721518b89c2fbba0b39af04b1c1236ee4311d","industry":"일반·전체"},{"date":"2026-10-02","title":"HD현중 120일 임단협 2일 최종투표…정년연장은 법개정 후 시행","link":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE1hb0tyUG5xNHkxTnZKbkxPWFVmV3E4djNpRmIybUV5N05Nek0tZzlwWHpfTHNKeWdGTnZ6eVRDVWxWZ0VHZ05hdXZSdVByajZZemJTbmdB?oc=5","source":"중앙일보","summary":"HD현대중공업 노사가 120일간 진행한 임금 및 단체협약 잠정합의안을 도출했다.\n오는 2일 전체 조합원을 대상으로 잠정합의안 찬반투표를 진행해 최종 타결 여부를 결정한다.\n쟁점이었던 정년 연장 안건은 향후 법 개정이 완료된 이후 시행하기로 노사가 합의했다.\n이번 찬반투표에서 잠정합의안이 가결되면 올해 임단협 협상이 최종적으로 마무리된다.\n노사는 협상 타결을 바탕으로 노사 관계를 안정화하고 생산 활동에 집중할 예정이다.","cardImagePath":"images/20261002_061021_3.png","category":"기타","hash":"4a85837dfddd27c279d7e83ad66b897a4015b2f42b487cb828a6eeb3e8275441","industry":"일반·전체"},{"date":"2026-10-02","title":"정년 65세, 숫자만 늘리면 될까…고용·임금 구조도 과제","link":"https://news.google.com/rss/articles/CBMibkFVX3lxTE1UMEVLa0k4R3lVYVFhdjhLVWpzVC12THZaUFRRMlBGczdsUVFaOGR3cnZmd1FQTTlWaWgzQnNxWGpKd2lmc0F0Q01wQjRkM0pBX0JCTXB3aHBGRWhpQWstZGtrSUFiY0tvZ1p6YlRn?oc=5","source":"아시아투데이","summary":"초고령사회 진입에 따라 65세 정년 연장에 대한 사회적 논의가 활발해지고 있다\n단순한 정년 연장은 기업의 인건비 부담 증대와 청년 고용 위축을 초래할 위험이 있다\n연공서열형 임금체계를 직무·성과 중심으로 개편하는 작업이 병행되어야 한다\n정년 연장 외에도 퇴직 후 재고용 등 유연한 고용 방식의 도입 검토가 필요하다\n노사정 간의 사회적 합의를 바탕으로 지속 가능한 고용·임금 구조를 구축해야 한다","cardImagePath":"images/20261002_061021_2.png","category":"기타","hash":"fdcfd4157d790f635308c404f5dfa898de881204179a2ee2ae566493ed5f2a44","industry":"일반·전체"},{"date":"2026-10-02","title":"삼성전자, AI 시대 인사관리 “직무 대신 스킬로”","link":"https://news.google.com/rss/articles/CBMiRkFVX3lxTE5mQnlCV1hKLWtOMHNnZkVpMHVNLUhpOC0wb0tYVWhOdnhoZFJadG9SSnJMbFBZNks3dUNmSmlxQ1d5Y2Nka1E?oc=5","source":"v.daum.net","summary":"삼성전자가 AI 시대에 맞춰 기존 직무 중심에서 스킬 중심의 인사관리 체계로 전환을 추진합니다.\n정해진 직무 대신 개인이 보유한 전문 기술과 역량을 기준으로 인재를 분류하고 평가합니다.\n급변하는 기술 환경 변화에 대응하여 필요한 프로젝트에 인력을 유연하게 배치하고자 합니다.\n임직원의 역량 데이터를 기반으로 적재적소에 인재를 활용해 조직의 효율성을 극대화합니다.\n이를 통해 AI 및 미래 기 절근로자를 적극적으로 도입 및 배치하기로 했다.\n계절근로자의 적기 투입으로 과메기 가공 공정의 인력 수급 불균형이 완화될 전망이다.\n이번 인력 지원을 통해 안정적인 과메기 생산과 지역 경제 활성화가 기대된다.","cardImagePath":"","category":"기타","hash":"c2a5c16101d272ca30f95abcd837103a1513d3449c3cf146d25964ec45a7e6de","industry":"일반·전체"},{"date":"2026-10-01","title":"포항 과메기철 인력난에 라오스 근로자 투입…외국인 계절근로자 다변화","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTE0xaUVmUlhLTXpuOGFvLVQ1cTFSUmsyMHZFbEttMGl0cTM4V2xXOEhNNjNtUmJWQmJzU1hxR1cyVEN5VHZFTWwyVDE5X25Qb25tTVJFcTJTTFlqWFJGd0FOaS1SMldwLXVveWc?oc=5","source":"hidomin.com","summary":"포항시는 과메기 생산철을 맞아 심각해진 어촌 인력난 해소를 추진한다.\n이를 위해 라오스 출신 외국인 계절근로자를 현장에 새로 투입하기로 했다.\n기존의 특정 국가에 의존하던 근로자 수급 방식을 다변화하는 계기가 되었다.\n투입된 근로자들은 과메기 가공 및 덕장 작업 등 주요 생산 현장에 배치된다.\n이번 인력 지원으로 지역 어가의 작업 차질을 줄이고 생산성이 향상될 것으로 기대된다.","cardImagePath":"","category":"기타","hash":"4273cca1f1dddaa3190593b728bdf1fb3f85a84c3d8980ee09da6a3e35479d8f","industry":"일반·전체"},{"date":"2026-10-01","title":"노동감독관 수사권 독립…인력난속 책임 가중","link":"https://news.google.com/rss/articles/CBMibkFVX3lxTE9CQ1cyeGU1ZG9lSHBMUWJwdmhzYnNuak5LbHJzdnJjR3NKYmpCNVVIQXlVd1pqb2NxSDEzY2Fvc0t6RndpRXVmanVhV0tZT0VDTndJalJtXzJNbzNCMEgyay1tRXNfQi1mLW9ZNzhn?oc=5","source":"울산일보","summary":"노동감독관의 수사권 독립 추진으로 노동 분야의 사법경찰 역할과 권한이 크게 강화되고 있습니다.\n하지만 만성적인 인력난이 지속되는 상황에서 업무량 폭증으로 인한 현장의 우려가 커지고 있습니다.\n권한 확대에 따라 영장 신청 및 수사 결과에 대한 법적·행정적 책임과 중압감도 함께 가중되었습니다.\n충분한 인력 충원 없는 과도한 업무 부담은 부실 수사 및 노동 지도·감독 기능 약화를 초래할 수 있습니다.\n제도의 성공적인 정착을 위해서는 인력 확충과 전문성 강화 등 실질적인 대책 마련이 시급한 시점입니다.","cardImagePath":"","category":"기타","hash":"015026f350c820e2a5c15f34f2f815a5885ec9479a1da8a37ce6d27581ecccd4","industry":"일반·전체"},{"date":"2026-10-01","title":"“경력은 살리고 인력난은 덜고”…중장년내일센터, 맞춤형 일자리 연결 확대","link":"https://news.google.com/rss/articles/CBMiZEFVX3lxTE5rMmJFaUdMQ2cxa0R3SDA0VVRiQWhJZElYeHd1WlppaWU3NFlISWJOUlpGNDRTU1dGZ0NCdFZtY2JwLTNvRGZpVnhHS1dUUm5WUWM2VnNOejBtVHBiajlndFBoVjU?oc=5","source":"매일일보","summary":"중장년내일센터가 중장년층의 경력을 살리고 기업의 인력난을 해소하기 위한 맞춤형 일자리 연결을 확대합니다.\n퇴직 전후 중장년의 직무 경험과 전문성을 반영한 맞춤형 전직 지원 및 재취업 프로그램을 강화합니다.\n구직자 개별 맞춤 상담과 역량 강화 교육을 통해 재취업 성공률을 제고합니다.\n인력난을 겪는 기업을 발굴하여 적합한 중장년 구직자를 신속하게 매칭합니다.\n중장년의 지속적인 경제 활동을 돕고 산업 현장의 인력 수급 불균형 완화에 기여할 방침입니다.","cardImagePath":"","category":"기타","hash":"eb00b01bb282d185d251a0ec8b7c22e233d006b288a8b4af02749e759e3727d2","industry":"일반·전체"},{"date":"2026-10-01","title":"청도군, 필리핀 계절근로자 95명 입국…농촌 인력난 해소 힘 보탠다","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE5wa3BOTFlNTkVUOHRISnNBV3h3V1JIVU9EY2hyWjViZTFrUnN3TmF0THpVODJIdVc3Y21ZQ28zWTFLUVh1Q3FYendoZDRMZEdzd2ZhbjdWeVlNQkViNDhJZEp1ekptTkpqQkZsOUhzRQ?oc=5","source":"kyongbuk.co.kr","summary":"청도군이 농촌 일손 부족 문제를 해결하기 위해 필리핀 계절근로자 95명을 맞아들였습니다.\n입국한 근로자들은 마약 검사 및 범죄 경력 조회 등 필수 행정 절차를 마쳤습니다.\n근로자들은 일손이 부족한 지역 농가에 배치되어 본격적인 농작업을 지원하게 됩니다.\n청도군은 근로자들의 안전한 정착과 인권 보호를 위해 주거 환경 개선 및 관리를 지속합니다.\n이번 외국인 근로자 투입은 농번기 농가의 시름을 덜고 적기 영농 추진에 기여할 전망입니다.","cardImagePath":"","category":"기타","hash":"c421e4f4e762e8d0175a14dd0ad772ec49949ef1c939c0b22d76c15dbaf8f2f4","industry":"일반·전체"},{"date":"2026-10-01","title":"여수시 생활임금 1만1760원···전년 대비 3.7% 상승","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE15QVpqYjB3a0pCeFJpRjRyNjVlQnJSQzh1MHljTTQzMWRXa0hfSnB0cHF3dmJwRF9jTnZJeldvRE8xeHE2bDlNUDM1Mk02bGQ1X2FmYjYxcmp1cHpEQVFQMUNYM3FPYUdBc3dyNQ?oc=5","source":"스마트비즈","summary":"여수시의 생활임금이 시급 1만1760원으로 확정되었습니다.\n이는 지난해 생활임금과 비교해 3.7% 인상된 금액입니다.\n근로자의 최소한의 인간다운 삶과 생활 안정을 보장하기 위한 조치입니다.\n최근 물가 상승률과 가계 지출 부담 등을 종합적으로 고려하여 책정되었습니다.\n결정된 생활임금은 여수시 소속 근로자들의 실질적인 삶의 질 향상에 기여할 전망입니다.","cardImagePath":"","category":"기타","hash":"b4b444d5e834fdccaf11382b56e7ec9539ae32018c3b6e96233b0d172dab6326","industry":"일반·전체"},{"date":"2026-10-01","title":"여수시, 2027년 생활임금 시급 11,760원 결정","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE40YUs3TC1BbkFuWWVPLVFobWRyTS01OWIxN3ZnRDNBTllXRTkxUm4zUUZ6eFNlcGN1N1hiYXVPa0pKajZMc1BEQm1scV9jQi1QandMVVAwX2VuV3ZfWXdIYnA4Qzk5MHBIZ3E5MtIBbEFVX3lxTE40YUs3TC1BbkFuWWVPLVFobWRyTS01OWIxN3ZnRDNBTllXRTkxUm4zUUZ6eFNlcGN1N1hiYXVPa0pKajZMc1BEQm1scV9jQi1QandMVVAwX2VuV3ZfWXdIYnA4Qzk5MHBIZ3E5Mg?oc=5", 면 현장에서 겪는 구인난과 인력 부족 문제는 여전히 지속되고 있다.\n인력난은 기업들의 생산성 향상과 경영 정상화를 가로막는 주요 원인이다.\n경기 회복세를 유지하기 위해서는 실효성 있는 인력 수급 대책이 요구된다.","cardImagePath":"","category":"기타","hash":"74556c209c899f5707b3c2fc14e12a0dbab26dc9550351aaab5761ce0dd7a9a5","industry":"일반·전체"},{"date":"2026-09-29","title":"삼성 반도체 美 총괄 “테일러 공장 본격 양산 코 앞인데 인력난…업계 전체 나서야”","link":"https://news.google.com/rss/articles/CBMiVEFVX3lxTE9kMTNkemh4bzdLcG9DNFFWNDRLVnh2THBsOFhYd2ZDOTNTSFhFa05rbjJuTjF0QlQ2c3JTZHlfTVFza2NQdXhWVnJVS3cxeUxBRFhzbw?oc=5","source":"v.daum.net","summary":"삼성전자 미국 반도체 법인장이 테일러 공장의 본격적인 양산을 앞두고 인력난 문제를 언급했습니다.\n미국 내 첨단 반도체 공장이 가동을 앞두고 있으나 전문 인력 부족이 심각한 상황입니다.\n이러한 인력 부족 문제는 개별 기업 차원을 넘어 업계 전체의 과제로 떠올랐습니다.\n반도체 산업의 지속적 성장을 위해 업계 전반의 공동 대응과 협력이 절실하다고 강조했습니다.\n정부와 교육 기관을 포함한 생태계 구성원들이 함께 인재 양성에 나서야 한다고 촉구했습니다.","cardImagePath":"","category":"기타","hash":"4b77644245b5cee31c5e4f46d792ede9f486e66bc8ca8caf1ea8add90dfd0ce8","industry":"반도체"},{"date":"2026-09-29","title":"개보위원장 만난 통신3사 CEO, 노후 시스템·인력난에 \"보안 개선 시간 필요\"(종합)","link":"https://news.google.com/rss/articles/CBMieEFVX3lxTE9rZzNrd1VZVGZPZm9BVThVYTZmemZ6M1pJR2s2MTdLOWJwOVlVM01sWE00eGZlcWNoT1ZfaEo1UXF2d1l2cXVORXNCdGtaRUwyU1dHVldMUHFpaUhfTkJiYm9WU1dJRDE2SHl3WU5kZkliTTdZOWNwUdIBeEFVX3lxTE9rZzNrd1VZVGZPZm9BVThVYTZmemZ6M1pJR2s2MTdLOWJwOVlVM01sWE00eGZlcWNoT1ZfaEo1UXF2d1l2cXVORXNCdGtaRUwyU1dHVldMUHFpaUhfTkJiYm9WU1dJRDE2SHl3WU5kZkliTTdZOWNwUQ?oc=5","source":"뉴시스","summary":"개인정보보호위원장과 통신 3사 CEO가 개인정보 보호 강화를 위한 간담회를 개최했다.\n통신 3사는 노후화된 시스템과 전문 인력 부족으로 인한 보안 관리의 어려움을 설명했다.\n실질적인 보안 시스템 개선과 정비를 위해 충분한 시간이 필요하다는 입장을 전달했다.\n개인정보보호위원회는 국민 피해 예방을 위해 통신사의 책임 있는 보안 강화를 당부했다.\n양측은 개인정보 보호 수준을 높이기 위한 상호 협력과 대책 마련을 추진하기로 했다.","cardImagePath":"","category":"기타","hash":"8ae1ddf621c41bd8e2f0c53d44be15e68adb2c056e14882ba301908759c3c99a","industry":"일반·전체"},{"date":"2026-09-29","title":"“일할 사람 구했어요”…충북 농촌 인력난 숨통 틔우는 ‘인력중개망’","link":"https://news.google.com/rss/articles/CBMiWkFVX3lxTE95ZUNCdkFpTl80VXIxOU8tczJzSzlJSmRLUEJrMjljc1Zmb055UTlNTlJ6VVhSTXhZcjc3Z052ckRXQVNwblJTMFM2MkpH ,"hash":"c21f56bcc3eb427c34dec06cbe585847ae0278e7687200c1c821b95724316b0c","industry":"일반·전체"},{"date":"2026-09-28","title":"건설불황에도 다시 열린 공채…대형 건설사 하반기 채용 '원전·AI·안전'에 방점","link":"https://news.google.com/rss/articles/CBMiS0FVX3lxTE1hOW96ZVVxNWRBQmVoandtd24yNjkyNnlfUWpHREFWM1BuZlFkVHpvYmtKc1ByZk96RW1FRXpYaXQ3WUQzLVQtb2FyVQ?oc=5","source":"v.daum.net","summary":"건설 경기 불황 속에서도 주요 대형 건설사들이 하반기 공개 채용을 진행합니다.\n이번 채용은 미래 신사업 육성과 현장 관리를 위한 전문 인력 확보에 방점을 둡니다.\n차세대 주력 사업으로 꼽히는 원자력 발전 분야의 인재 모집을 대폭 확대합니다.\n디지털 전환과 생산성 향상을 이끌 인공지능 전문 기술 인력을 적극 채용합니다.\n현장 사고 예방 및 중대재해 대응을 위한 안전 관리 분야 인력 확보에도 힘씁니다.","cardImagePath":"","category":"채용","hash":"7bec89f2507883512b691099ff09a7e8e9fe009df917ce91ad23304bc0ae7060","industry":"일반·전체"},{"date":"2026-09-28","title":"신입 공채 뜸한 인천, 직무별 채용 대세","link":"https://news.google.com/rss/articles/CBMicEFVX3lxTE95WVJyWHUtUmhkLWVjdC1kOC1sRTMzOGR1Q3JTZV94SVBjMUYwdzJCb2FWLWwtU2J4NS1fcHVKRDVrSVVGMTRVOHhVZUhJNEd4bl9zNWlIdzhWU1NtSXlveGFJZnhRTFVHRUNFeHBXdG8?oc=5","source":"인천일보","summary":"인천 지역 기업의 정기 신입 공개채용 규모가 대폭 줄어들고 있다.\n대규모 채용 대신 직무별로 인재를 선발하는 수시 채용이 확산되는 추세이다.\n기업들은 즉시 업무에 투입 가능한 실무 역량을 갖춘 인재를 선호하고 있다.\n구직자는 희망 직무에 특화된 전문성과 맞춤형 경험을 준비해야 한다.\n지역 채용 시장 변화에 맞춰 고용 지원 정책도 직무 중심으로 재편되고 있다.","cardImagePath":"","category":"채용","hash":"d9926faf589ee744b1643c1543095c19567c263057e297e6d10ae27dab53a89d","industry":"일반·전체"},{"date":"2026-09-28","title":"라오스 건설·농업·제조업 인력난, 한국 사업주의 계약 전략을 바꾼다","link":"https://news.google.com/rss/articles/CBMiUkFVX3lxTE5KWXV6bWZ0dmJNR2dfak45c05oaWlGemd6OXBmN05vV1VISldENFdDeWlNQXduV3ItSGYyNXBoS0lNbnJLdy1KX001OW82dXpVYUE?oc=5","source":"투데이타임즈","summary":"라오스의 건설, 농업, 제조업 분야에서 심각한 인력 난이 이어지고 있습니다.\n현지 인력 부족은 한국 내 외국인 노동자 수급과 고용 환경에도 영향을 미치고 있습니다.\n이에 따라 한국 사업주들은 인력 확보를 위해 기존의 고용 방식을 변경하고 있습니다.\n장기 근무 유도와 안정적 인력 확보를 위한 새로운 계약 전략 수립이 핵심 과제로 떠올랐습니다.\n변화하는 현지 노동 시장에 맞춘 유연하고 효과적인 채용 및 고용 조건 마련이 요구됩니다.","cardImagePath":"","category":"기타","hash":"d9039cd6838b15038043f9c641059e397f91ccb4ea032534369e9278b2de3890","industry":"제조·자동차"},{"date":"2026-09-28","title":"중대범죄수사청 출범 초읽기, 인력난과 정치적 갈등의 파고","link":"https://news.google.com/rss/articles/CBMiaEFVX3lxTE5nRklHUWgyRFZ1M1gxQ0doWjB2RzdkcDR3WDdrTHJ3MWtJU2RYbDY0dFA2Q3FtYzRhMHFLRmtBcDdKVm9XS3BqX0lBT0V1TkFTWmdRWVNfN1NwMG9VVUNoYnhpQ2J4bVlR?oc=5","source":"공감신문","summary":"중대범죄수사청 출범이 다가오면서 수사 체계 개편이 추진되고 있다.\n전문성을 갖춘 수사 인력 부족으로 초기 운용에 어려움이 예상된다.\n여야 간 정치적 갈등과 견해 차이로 인해 제도적 차질이 우려된다.\n수사권 조정 및 타 기관과의 역할 중복에 대한 논쟁이 계속되고 있다.\n안정적인 출범을 위해 인력난 해소와 정치적 타협이 핵심 과제로 떠올랐다.","cardImagePath":"","category":"기타","hash":"fbe043c4e1dfdf04d44cc46397f5a782c6a6787d15c57b62b3617d6f8af1ec90","industry":"일반·전체"},{"date":"2026-09-28","title":"AI 인력난 속 베트남 개발팀 활용 확대···한국 기업의 현실적인 선택지로","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE5QS1pSNHFJczhrRVVUSWM2Q19URmJBQ1lYalEyMlNYdjNLMHJUajBoeUZHNTFvSTFoVUxyeDNTQlR6OGVJd0Y0YzNvRzl4aUtBdkFmOTJYMEVET2hQWnY3RnNCQ09GSHRrSllidw?oc=5","source":"저널25방송","summary":"국내 기업들이 심각한 AI 전문 인력난을 겪고 있습니다.\n인력 부족을 극복하기 위해 해외 개발 인력으로 눈을 돌리고 있습니다.\n특히 베트남 개발팀을 활용하는 기업의 비중이 늘고 있습니다.\n베트남 개발팀은 한국 기업의 인력난을 해소할 현실적인 선택지가 되었습니다.\n이는 AI 인력난 대처를 위한 해외 개발 인력 활용의 대표적 사례입니다.","cardImagePath":"","category":"기타","hash":"31d5873c372d462e94e1e5242977c649b408703487bae0261643500d6785f722","industry":"일반·전체"},{"date":"2026-09-28","title":"인력난 시달리는 자위대, 휴머노이드 로봇 도입 검토","link":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNb1l1azFyOUxSdU9Wd2dsaDRmN2hJclpHSkRPSmhiekpNQTBSSFg3d0plaEN1ZExMcENKV003cTJ4RW82bXZmMXlSVlZkYWhVSnRVdW5uZ2JlQUxLY29URXdFaXpfSGJidlZrckdKX2dtZW5nUXZhS1luQlV5OHNPUXVIM0l1U09n?oc=5","source":"글로벌이코노믹","summary":"일본 자위대가 저출산과 인구 감소로 인한 심각한 인력 부족에 시달리고 있습니다.\n병력 난을 해결하기 위한 대안으로 첨단 휴머노이드 로봇 도입을 검토하고 있습니다.\n로봇을 경계, 수색, 물자 수송 등 인력이 많이 소요되는 임무에 투입할 계획입니다.\n이는 부족한 군사 인력을 보완하고 국방 대응 능력을 유지하기 위한 조치입니다.\n첨단 로봇 기술을 활용한 자위대의 무인화 및 자동화 전환이 가속화될 전망입니다.","cardImagePath":"","category":"기타","hash":"1db274af9ac11de24501b0d750a075e7150a24d1297b07e6794f8bb347d22f81","industry":"일반·전체"},{"date":"2026-09-28","title":"대구경북 중장년 일자리 ‘제2의 인생’ 지원…기업은 인력난 해소 기대","link":"https:/ 장하며 대립 중입니다.\n정부와 정치권은 세대 간 상생 방안을 모색하여 연내에 관련 정책의 방향성을 결정할 예정입니다.","cardImagePath":"images/20260928_061005_1.png","category":"기타","hash":"d87459f9043a02599146d6c6a95ef0c8c9e4242ce9a40a1730d2b78bc34438ae","industry":"일반·전체"},{"date":"2026-09-27","title":"한화-KAI, 장거리 공대공 유도탄 KF-21 통합 MOU 체결","link":"https://news.google.com/rss/articles/CBMia0FVX3lxTE45U05sYW0xRVozdXJybmc3ck5MQ3pteUVFRTFNUk5fOFp4QUZTRTNMUFFWWlc2VnpnX0QxNTViMGtwWlBhSk9aenk4U2ZpcS0zMUNZNGY3YnNSWkhySXhCUTdUbmRBY1BSeEpN?oc=5","source":"부패방지뉴스","summary":"한화와 KAI가 장거리 공대공 유도탄의 KF-21 전투기 통합을 위한 MOU를 체결했습니다.\n국산 기술 기반의 핵심 유도무기와 전투기 체계 간의 연동 개발이 본격 추진됩니다.\n양사는 무기 체계의 안정적인 기술 통합과 성능 검증을 위해 상호 협력하기로 했습니다.\n이번 협력을 통해 독자적인 공중 무장 역량을 확보하고 자주국방 기틀을 강화합니다.\n향후 KF-21의 국내 운용 성능 향상과 더불어 해외 수출 경쟁력도 높아질 전망입니다.","cardImagePath":"images/20260927_060815_5.png","category":"기타","hash":"34d4b6d4b466a92f1b114ccbe0a112fa0d50b3acd0adff1aad64e1046c208965","industry":"방산·항공우주"},{"date":"2026-09-27","title":"글로벌 방산 경쟁 한창인데…국감장 줄소환 위기 놓인 K-방산 수장들","link":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE9mRVVGV0JHdGU5Q0FUbWR0S2N3MEtIMHFxdGhQYk1CQjVCSDhVbWtCSk03SG1OTjJHLUlnek1MNkUxRmpWQ3lGeFo1akw4WHdCTjJZT2d3?oc=5","source":"데일리안","summary":"글로벌 방산 시장의 경쟁이 격화되는 상황에서 K-방산 기업 수장들의 국정감사 출석 가능성이 높아졌습니다.\n국회는 방산 관련 사고 및 이슈 규명을 이유로 주요 방산 기업 대표들의 증인 채택을 추진 중입니다.\n방산업계는 핵심 경영진의 국감 출석이 해외 수주 활동 및 수출 계약에 차질을 줄까 우려하고 있습니다.\n치열한 글로벌 수주전 속에서 과도한 수장 소환이 기업의 경쟁력을 약화시킬 수 있다는 지적이 나옵니다.\nK-방산의 지속적인 성장을 위해 정책적 지원과 함께 기업 경영 활동을 보장하는 배려가 필요하다는 목소리가 큽니다.","cardImagePath":"images/20260927_060815_4.png","category":"기타","hash":"1849e21b3096cb5e6ffecc0e88c93b7397dfdf2855b29c9d06536c5068e5b0d9","industry":"방산·항공우주"},{"date":"2026-09-27","title":"누리호 5차 발사·우주경제 시대 본격화… ‘제2회 국제우주항공기술대전’ 창원서 개막","link":"https://news.google.com/rss/articles/CBMibkFVX3lxTFBtSmdrMVhUTnduM3NuM042c2U2dDAyZUFLejE1QnZ1cFRQbGFyci1nRE9fdjVpUG1ZdU1CWGROdUlzSFJHcG42bXk5U2dTMlZKSE1nN2tYMlBsNVU0VElsZzktTEdwZ1JnNWlCOVBB?oc=5","source":"koreasprint.com","summary":"제2회 국제우주항공기술대전이 창원에서 개막했습니다.\n이번 행사는 본격화된 우주경제 시대를 배경으로 합니다.\n누리호 5차 발사 등 주요 우주항공 이슈를 다룹니다.\n관련 보도는 코리아스프린트를 통해 발표되었습니다.\n해당 소식은 구글 뉴스 매체에 기재되었습니다.","cardImagePath":"images/20260927_060815_3.png","category":"기타","hash":"ec13a6ad0c244efeb88a2041a776a38f40d401f61dbbe845f6bea126e21f341f","industry":"일반·전체"},{"date":"2026-09-27","title":"[김용필의 시선집중] 서울 택시기사 중국동포 채용 광고, 왜 아쉬웠나","link":"https://news.google.com/rss/articles/CBMiZkFVX3lxTE1xZm5sUHFrUnlXcnNERU82MWlZMzYxMkpwa0R2UUwxSGRkQnVnLVZaaVl5Yl9SeHJiSzQ4T2IwSnFkS2dQS25mbFZsRkh2WTJFanhUQXEyY2xGb3JieVdGS3ZldDJUQQ?oc=5","source":"ekw.co.kr","summary":"서울시 택시기사 인력난 해소를 위해 중국동포 채용 광고가 게시되었습니다.\n현행 비자 제도상 동포들의 택시 운전업 종사에는 법적 제한이 존재합니다.\n사전 제도적 검토가 미흡한 채 이루어진 광고로 인해 사회적 혼선이 발생했습니다.\n인력 부족 해소를 위해서는 단순 채용 시도보다 법제도 정비가 선행되어야 합니다.\n동포사회와 대중 간의 오해를 줄이고 실효성 있는 정책 마련이 시급합니다.","cardImagePath":"images/20260927_060815_2.png","category":"채용","hash":"c1bf94a29cb64115f4a6732c448c622cbc1c099dc56cc7d21d1b9445340da19c","industry":"일반·전체"},{"date":"2026-09-27","title":"충주시, 내년도 생활임금 시급 1만2630원…13.5% ↑","link":"https://news.google.com/rss/articles/CBMicEFVX3lxTE9yeGxIRTFFOXNZNS1SZDJVWmYyTmpWS1pvQkJjaC0wUW1Id1VaSEJMckxMOUpIakNwbWZRSVRFQ0lMbFpIMlU3Wm44MldRTTdXUGQxbkRTaUZKTXVzaVBLR3ZINGc1ekdtd0lIbzVnbEQ?oc=5","source":"충청일보","summary":"충주시가 내년도 적용할 생활임금 시급을 확정했다.\n내년도 생활임금은 시급 1만 2630원으로 결정되었다.\n올해 생활임금과 비교해 13.5% 인상된 금액이다.\n법정 최저임금을 상회하며 근로자의 생활 안정을 지원한다.\n이번 결정은 지역 근로자의 실질적 삶의 질 향상에 기여할 전망이다.","cardImagePath":"images/20260927_060815_1.png","category":"기타","hash":"e0084de946e69715cae39b9c626931186398c4395a6f2408dd0d636fe40f1805","industry":"일반·전체"},{"date":"2026-09-26","title":"韓-멕시코 정상회담, 7개 분야 17건 협력문건 체결","link":"https://news.google.com/rss/articles/CBMiZ0FVX3lxTFBGMlpPNWdoQkJsT3BvRXNnMFBaVWJLTk5VeEE4U1h3RW1mR0M1cl9UOFlnd0hOYmJlUEhWQ2xOb3Q3c1dSNEQ4ZndKX2tmWEZPUGdHdHB2SlNqbzhxVzRjU19ySFlCdTg?oc=5","source":"데일리메이커","summary":"","cardImagePath":"","category":"기타","hash":"0d0d412eab0718b5d7b6fe5e6bb2724790ca3192eab872d48eb0caba39e76afb","industry":"일반·전체"},{"date":"2026-09-2 직 연령은 평균 53세에 불과하다.\n단순한 법정 정년 연장만으로는 대다수 일반 직장인의 실제 퇴직 시기를 늦추지 못한다.\n법정 정년 연장의 혜택은 주로 공공기관이나 대기업 정규직 등 일부 계층에 집중된다.\n호봉제로 인한 임금 부담과 기업의 구조조정이 중장년층의 조기 퇴직을 부추긴다.\n실질적인 고용 연장을 위해서는 유연한 임금체계 개편과 재취업 활성화 대책이 필요하다.","cardImagePath":"images/20260926_224839_4.png","category":"기타","hash":"db59c11f44ee2d773b7a6cbd3bc1128af91f9553a25a0710205ce7d257bbe2f9","industry":"일반·전체"},{"date":"2026-09-26","title":"AI도 이렇게 못 한다...\"정년? 남아주세요\" 회사가 베테랑 붙잡은 이유","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE5VR1Q1V2Z4VmRkX0RDZ1ZWek8tZXZOZE5sRUE3bnVySy1nOGJHeGtueXVSbm5ObHVmdXZ6eTR5RFVyUkhodjRLWE43Z0psUzYyQjhENHZrSW04NGFpMXBoY0lrVXB2TVBjb0QtV0RBNNIBb0FVX3lxTE5VR1Q1V2Z4VmRkX0RDZ1ZWek8tZXZOZE5sRUE3bnVySy1nOGJHeGtueXVSbm5ObHVmdXZ6eTR5RFVyUkhodjRLWE43Z0psUzYyQjhENHZrSW04NGFpMXBoY0lrVXB2TVBjb0QtV0RBNA?oc=5","source":"머니투데이","summary":"정년퇴직을 앞둔 숙련된 베테랑 인력을 붙잡는 기업들이 크게 늘고 있습니다.\nAI 기술이 급성장했음에도 오랜 현장 경험과 노하우는 대체하기 힘들기 때문입니다.\n베테랑은 AI가 해결하지 못하는 돌발 상황 대응과 정교한 업무 처리에 강점을 보입니다.\n많은 기업이 정년 연장이나 퇴직 후 재고용을 통해 숙련 인력의 유출을 막고 있습니다.\n고령화 사회에서 베테랑의 풍부한 경험을 활용하는 것이 기업의 핵심 경쟁력이 되고 있습니다.","cardImagePath":"images/20260926_224839_3.png","category":"기타","hash":"4dae06d9d8d3a282e084d30c5990f75e9ef226ce88961d2679d4ffba4b14021e","industry":"일반·전체"},{"date":"2026-09-26","title":"정년퇴직자 재고용 사업체 17만 곳으로 급증…10곳 중 4곳 정년 후에도 ‘계속고용’","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE5NS3JoQUxWVjBReklLNWdHZ2hHRzgxUTBkT1Q3azFJTHo5U1otLXlja0s3NzU3ekE5X2tCai1VamctRWVZcWpNVTBZbER2VzBTeHhaZjMxblZia1NIbGZKd1J3Mllvdk5zQ21JVlNDTQ?oc=5","source":"월드장애인사랑뉴스","summary":"정년퇴직자를 다시 고용하는 사업체 수가 17만 곳으로 급증했습니다.\n국내 사업체 10곳 중 4곳은 정년 이후에도 근로자를 계속 고용하고 있습니다.\n인구 고령화 속에서 숙련 인력을 확보하려는 기업들의 움직임이 확대되고 있습니다.\n기업들은 정년 연장이나 정년 후 재고용 등 다양한 계속고용 방식을 적용하고 있습니다.\n정년 후 계속고용은 고령자의 고용 안정과 기업의 구인난 해소에 긍정적 영향을 미치고 있습니다.","cardImagePath":"images/20260926_224839_2.png","category":"기타","hash":"5d4bf8353c08b3c42b00e667307ffd4114a780a3e2e3471c13cfde9d872a2b27","industry":"일반·전체"},{"date":"2026-09-26","title":"정년 65세' 입법 하반기 재시동...\"법 사각지대 위한 대책 d409fc7637274eaf2fd232e317e4f736d5c824f5e4df14b6e48d0","industry":"일반·전체"},{"date":"2026-09-26","title":"이재명-셰인바움 정상회담…에너지·방산·AI 협력 강화 합의","link":"https://news.google.com/rss/articles/CBMibkFVX3lxTE1kRjBudGpDcEU2WkRXTzB3TTFNTXhDS19tdHNqT3RfREo1eWhDVDUxd1BtTmVVdGZmQnMwTkY2aEJfRGpkaFhuUWdVSURVOFpyQ0M2VG90UlNVNHBQSGNNaVZUVGNXVE1KVUkwcDVn?oc=5","source":"주간시사매거진","summary":"이재명 대표와 멕시코 셰인바움 대통령이 양국 정상회담을 진행했다.\n양국은 에너지, 방위산업, 인공지능 등 핵심 분야의 협력을 강화하기로 합의했다.\n미래 첨단 기술과 신산업 영역에서의 전략적 파트너십을 본격 확대한다.\n방산 및 에너지 분야를 중심으로 구체적인 실무 협력 체계를 구축할 예정이다.\n이번 합의를 통해 양국 간 경제·기술 교류와 상호 발전이 가속화될 것으로 기대된다.","cardImagePath":"","category":"기타","hash":"5ec0265db1f21d76cdde6f5136bd322301ef5ee76036409dee75a9be37e0a417","industry":"방산·항공우주"},{"date":"2026-09-26","title":"유럽 방산 블록화와 K방산 2.0 … 현지화만이 답이다 [현장르포]","link":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE5kWFNIbGUwXzA0RkEzamoyN1BOLTFtVDdHNm94QV91Z0dkV3QtRzdvdlBaUDZfVF9Gamx0TG42XzVXSTQtUllUOUxISFQ0aWxYNDFOZU1R?oc=5","source":"매일경제","summary":"유럽 연합의 방산 블록화 정책 강화로 한국 방산업계의 유럽 시장 진출에 새로운 난관이 봉착했다.\n단순 완성품 수출 위주에서 벗어나 현지 시장에 특화된 K방산 2.0 전략으로의 전환이 시급하다.\n유럽 현지 기업과의 합작법인 설립과 기술 이전 등 철저한 현지화가 생존을 위한 필수 조건이다.\n현지 생산 인프라 구축은 유럽 규제를 극복하고 지속 가능한 수출 동력을 확보하는 핵심 해법이다.\n국내 방산 기업들은 맞춤형 현지화 협력을 통해 유럽 방산 시장에서의 지배력을 강화해 나가야 한다.","cardImagePath":"","category":"기타","hash":"d48265de7d34b4ebc0cb4957dd5f62b32c996886e7563fbd5b8ad8d0a73cc1b6","industry":"방산·항공우주"},{"date":"2026-09-26","title":"원유부터 FA-50까지…韓·멕시코 경제협력 전방위 확대","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE1PT3VNTVBFblRlb2RkWkNzQjEwX2w5NF9iaW5jMGNZWDNIdzhoWFhDeTMtWHIwSXVzR2VUd2RISUt1Z1F4emIwbHdVQjNrdmJzeVVpSDFLVmZmaDZMeWtGcFB5eEVaNXMwUnY3eVRPZ9IBb0FVX3lxTE1PT3VNTVBFblRlb2RkWkNzQjEwX2w5NF9iaW5jMGNZWDNIdzhoWFhDeTMtWHIwSXVzR2VUd2RISUt1Z1F4emIwbHdVQjNrdmJzeVVpSDFLVmZmaDZMeWtGcFB5eEVaNXMwUnY3eVRPZw?oc=5","source":"투데이신문","summary":"한국과 멕시코가 에너지와 방산을 포함한 전 분야로 경제협력을 확대하고 있습니다.\n양국은 원유 등 핵심 자원 공급망의 안정적 확보를 위해 지속해서 협력할 방침입니다.\n국산 경공격기 FA-50 도입 논의를 비롯해 방위산업 수출 협력이 본격화되고 있습니다.\n인프라와 제조업 등 다양한 각서 및 협력 문건을 채택했습니다.\n핵심 광물 분야에서는 안정적인 공급망 구축을 위해 상호 협력을 강화하기로 했습니다.\n방위산업과 우주 항공 등 첨단 기술 분야에서도 공동 연구와 교류를 추진합니다.\n이를 통해 양국의 경제 안보를 강화하고 전략적 동반자 관계를 한 단계 높일 전망입니다.","cardImagePath":"","category":"기타","hash":"d8c926b7892ec1adab685a0e8b1a85439743f28dba3cfc865904943f0735aa3e","industry":"방산·항공우주"},{"date":"2026-09-26","title":"李대통령 기업 도전 뒷받침…韓·멕시코, 새로운 번영 60년 열자","link":"https://news.google.com/rss/articles/CBMiWEFVX3lxTE5sT1N0NDE1aVZtOWsxMDg0aUlMUzJsUm5qMHJJaWZjU09HQ2hlZnpwMGxFcDhPX3dTdVFqY1JTRTZwMlE1TDAxdjg5eWxvdlBocG10MVZfbnDSAVhBVV95cUxObE9TdDQxNWlWbTlrMTA4NGlJTFMybFJuajBySWlmY1NPR0NoZWZ6cDBsRXA4T193U3VRamNSU0U2cDJRNUwwMXY4OXlsb3ZQaHBtdDFWX25w?oc=5","source":"아주경제","summary":"한국과 멕시코의 양국 간 경제 협력과 동반자 관계를 더욱 강화합니다.\n정부는 해외에 진출하는 우리 기업들의 도전과 성장을 적극 지원합니다.\n무역과 투자 등 다양한 분야에서 실질적인 교류와 협력을 확대합니다.\n양국은 지속 가능한 발전과 새로운 번영의 60년을 함께 열어가기로 했습니다.\n정상 외교를 통해 글로벌 시장에서 한국 기업의 경쟁력을 확보할 방침입니다.","cardImagePath":"images/20260926_060951_5.png","category":"기타","hash":"d58d1db0fa98097faed528a60bda8dbadafd28b05ca1b72398d4037513f40ebf","industry":"일반·전체"},{"date":"2026-09-26","title":"건설사 채용, 원전·데이터센터 인재 찾기...\"토목·건축 위주에서 무게중심 이동\"","link":"https://news.google.com/rss/articles/CBMickFVX3lxTFB5NHRnV0JVcFl5QVFTMGtFcTA1cVRmR0k3cHNENTNxMUZqdzJhRkNkRERMVFZvYmJsQlVUZ2JIb3ZqbEo2c0liV2JoQ2NEVnBSTFM4Y3l4dGVLTE45TEpUam10el9sVVM4YXAwVHdHVW91QQ?oc=5","source":"오피니언뉴스","summary":"건설업계 채용 시장의 중심축이 기존 토목과 건축에서 신사업 분야로 이동하고 있다.\n주요 건설사들은 최근 원자력 발전과 데이터센터 관련 전문 인재 확보에 주력하고 있다.\n이는 전통적인 주택 경기 침체를 극복하고 미래 성장 동력을 확보하기 위한 차원이다.\n데이터센터 수요 급증과 원전 수출 확대 전망에 따라 해당 분야 인력 수요가 늘었다.\n이에 따라 건설사들의 인재 영입 방향이 첨단 기술 및 미래 에너지 중심으로 재편되는 추세이다.","cardImagePath":"images/20260926_060951_4.png","category":"채용","hash":"54c138413e884f64f5c015b09a5b5a3678084d112793d80f2d470a1be9eadc6b","industry":"일반·전체"},{"date":"2026-09-26","title":"日 기업의 기숙사·사택 30년 만에 증가…인력난에 인재 확보 투자 [KDF World]","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTE5xaXhhc25ySHRMUHJJQ3ppX3pnQ09UYUJIV25MRFBrbThOX0xiekdQNEZHVmVPLWtrWFYwdTFsbWIxMUlnNmhuR05MYk dGl4Z2puTUhqaVJLdTZQQ2VuejlLcmhWVG9fWm52aDZtZDg?oc=5","source":"v.daum.net","summary":"한국과 멕시코가 경제, 산업, 자원 협력을 위한 공식 채널을 신설하기로 합의했습니다.\n양국은 공급망 안정성과 핵심 자원 확보를 위해 다각적인 산업 공조를 추진합니다.\n방위산업 분야에서는 국산 경공격기 FA-50의 멕시코 현지 생산 협력이 검토되고 있습니다.\n이번 합의는 중남미 핵심 거점 국가인 멕시코와의 전략적 파트너십을 강화하는 계기가 됩니다.\n양국은 향후 실무 협의를 통해 분야별 세부 협력 방안과 이행 계획을 구체화할 예정입니다.","cardImagePath":"","category":"기타","hash":"439f2d6e6fef8b6b0c153b5237fb5d29d83328cf5606d7899f104c8f43b78c39","industry":"일반·전체"},{"date":"2026-09-25","title":"금호건설, 하반기 신입사원 공채…5개 분야 두 자릿수 채용","link":"https://news.google.com/rss/articles/CBMiXEFVX3lxTE5xQTlYdS1iMXV2YmFFeUlZUjZzdks5Sm13d2VZTmZZc2xsSUUyMGhMWUJSMzl2STBRb1hGMkp4Q0lJSDFieEN2S243OUJmM0VSYU5Ubm1jU3c5Ym9C?oc=5","source":"뉴스핌","summary":"금호건설이 하반기 신입사원 공개채용을 진행한다.\n채용은 총 5개 직무 분야를 대상으로 실시된다.\n전체 채용 규모는 두 자릿수 인원을 선발할 예정이다.\n우수한 인재를 확보해 미래 성장 동력을 강화하고자 한다.\n지원서 접수 등 세부 사항은 공식 채용 포털을 통해 확인 가능하다.","cardImagePath":"","category":"채용","hash":"1f7f8c40a5c21dd30970b862b5eb4e48f1b6e2a5be205df447bc5d4e144f1808","industry":"일반·전체"},{"date":"2026-09-25","title":"은행·증권업계, 하반기 채용 문 열었다…국민·하나 각각 180명·230명 채용","link":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE1DQU1SSVZzLTdHcUs5djRyWDNVcWxHVUZOcTExSmJDM1o2WUhfYUE1U2ZsSlJHNVBfbTMtLUJINlU4d2h4WFJnTGRIZkMzUjJRRXE3bTBabHNXWWJWaFh1OA?oc=5","source":"nspna.com","summary":"은행 및 증권업계가 올해 하반기 채용 절차를 본격적으로 시작했다.\n금융권 기업들이 우수한 인재를 확보하기 위해 채용 문을 활짝 열었다.\nKB국민은행은 이번 하반기에 총 180명 규모의 채용을 진행한다.\n하나은행은 신입행원 등 총 230명의 인재를 선발할 예정이다.\n주요 금융사들의 채용 실시로 금융권 취업 시장이 더욱 활성화될 것으로 보인다.","cardImagePath":"","category":"채용","hash":"48977ba4d0cdf38b0caabb5ec1645dba6e263299baf7e5269e98f313886f1bc0","industry":"금융"},{"date":"2026-09-25","title":"하반기 취업문 열렸다…CJ·오리온 등 공채 일정 살펴보니","link":"https://news.google.com/rss/articles/CBMiZEFVX3lxTE50ZkFZUVF3dmlyZHh1eWRYWGlmMnh0YU5pd21rVUh3ZFEtbTh5TTZOOWJyQm1nOXExZ29HZ1FPbnFCUW5TTVNpTFpXQmg5RGZJQkRZMTQyT1hVc0pINDRUUkQ4eHc?oc=5","source":"서울경제TV","summary":"주요 대기업들이 올해 하반기 신입사원 공개채용 일정을 본격적으로 시작했습니다.\nCJ그룹은 주요 계열사별로 서류 접수를 진행하며 인재 모집 s/CBMiRkFVX3lxTE9IRFJOdDd6REx5LW5SdWI5SzAwTmFvSF9rTUlkWGtiNmdSUVRxaWJodUliNkpsd2w0SVY5MEx1NHpyUlBUdmc?oc=5","source":"v.daum.net","summary":"심각한 인력난으로 인해 과거 해고하거나 떠나보낸 퇴직자를 다시 채용하는 기업이 늘고 있습니다.\n기업은 채용과 적응에 필요한 시간 및 비용을 아끼기 위해 검증된 퇴직자를 다시 선호합니다.\n퇴직자 역시 익숙한 업무 환경과 기존 역량을 활용할 수 있다는 점에서 재입사를 선택합니다.\n이처럼 이전 직장으로 다시 돌아가는 '부메랑 채용'이 새로운 구인·구직 트렌드로 자리 잡았습니다.\n다만 조직 문화 개선과 처우 보완이 이뤄지지 않으면 재이직이 반복될 수 있다는 지적도 나옵니다.","cardImagePath":"","category":"채용","hash":"73cd6d661936d460bdc14fe6fd4e347067c6a7eb77adf1b1f81bd6c8feb0eb70","industry":"일반·전체"},{"date":"2026-09-25","title":"기후 불안정이 앞당긴 포도 수확…프랑스 와인산업의 인력난과 한국 농업이 받아야 할 경고","link":"https://news.google.com/rss/articles/CBMiSkFVX3lxTE9HNC1QNHByeGV4NzFmNWJWVTZuaHEyNFVaV2lteVNxbWstUkZ0bzBFQnl6b1pmcERUMWUyYl9jdWpManJuX3RFSlJn?oc=5","source":"얼리어답터뉴스","summary":"기후 불안정으로 인해 포도 수확 시기가 앞당겨졌습니다.\n프랑스 와인산업은 수확기 변화와 함께 인력난을 겪고 있습니다.\n이러한 상황은 한국 농업이 받아들여야 할 경고 메시지입니다.\n본 보도는 얼리어답터뉴스에 게재된 기사 내용입니다.\n기사 본문의 출처는 구글 뉴스입니다.","cardImagePath":"","category":"기타","hash":"a89248831051bf0deea0bfa90f7c6ac47197d355be691107477c7eb85c979a65","industry":"일반·전체"},{"date":"2026-09-25","title":"번스타인, 데이터센터 인력난 해소 전망에 Quanta Services 투자의견 상향 조정","link":"https://news.google.com/rss/articles/CBMidEFVX3lxTFBrVjUwMHlWY3A1LTBzOW1BNkxqRlhCQ0FMU0tvaHVNem9TVTh5dHN2LXlZX3M0X0FxaHhLaXM2aDZaRW9DVy10NDdCSi0wNHVvUGd2OUFOYS1LcHlVNGNEWnI1WEpFMW95TFJkTk45STNTWWJs?oc=5","source":"Investing.com 한국어","summary":"번스타인이 콴타 서비시스의 투자의견을 상향 조정했습니다.\n데이터센터 건설 현장의 인력난이 해소될 것이라는 전망이 반영됐습니다.\n인력 수급 개선에 따라 데이터센터 인프라 구축 사업에 속도가 붙을 것으로 기대됩니다.\n이는 콴타 서비시스의 실적 상승과 기업 가치 제고에 긍정적인 요인입니다.\n전문가들은 데이터센터 확장에 따른 콴타 서비시스의 수혜를 높게 평가하고 있습니다.","cardImagePath":"images/20260925_061020_5.png","category":"기타","hash":"9c4a29b597894dff8b47f7026e946e0c6e478395b2b794d2877dbd0c9d12e334","industry":"일반·전체"},{"date":"2026-09-25","title":"충주시, 2027년 생활임금 시급 1만2630원 확정","link":"https://news.google.com/rss/articles/CBMickFVX3lxTFBuLUdpU1NkT3Zub045TkM2MmlocXZWNExwR091MWZ2enhibldtN05PdVNMUHhmOGIzR1dJal8yZTNvTmwxT29ZUGho "},{"date":"2026-09-24","title":"온주 제조업 인력난 여전","link":"https://news.google.com/rss/articles/CBMiYEFVX3lxTFBSQlRpc1pxeWZKSUpJa1VGQllGTllwRU9jYzJHTTdZTUlIdnlVdnc2MzI3eElBZi1aMUhHaHhpMF9uTlFZd3Q4TGxMRDlETkg5OVM2a2I1ZmgxWGR6Y2kyag?oc=5","source":"캐나다 한국일보","summary":"캐나다 온타리오주의 제조업 분야에서 인력 부족 현상이 여전히 이어지고 있습니다.\n숙련 노동자의 은퇴와 신규 유입 부족이 구인난의 주요 원인으로 분석됩니다.\n인력 부족으로 인해 지역 제조업체들의 생산 차질과 운영 부담이 가중되고 있습니다.\n관련 업계는 인력난 해소를 위한 기술 교육 강화와 이민자 확대를 요청하고 있습니다.\n제조업 경기 회복과 노동 시장 균형을 위한 실질적인 정책 마련이 시급한 상황입니다.","cardImagePath":"","category":"기타","hash":"fb439075c07e1a22de502b4450959174e7c184268a6c306b19004bc6e1d2fe12","industry":"제조·자동차"},{"date":"2026-09-24","title":"인력난에 \"중국 국적 환영합니다\"…서울 택시회사 동포 채용 나서","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE93bWg3aUt5TWl1WWpiU21qWHZtVzA1TmhhR1JtMzdoQWJ6LXNKZTNWVFNQdEhXeEVNN2s1TjRWektpYmJrZVIteDRzZHJSbGkydFNERURfNjVLeFJka015dXg2ZDVjcmdZX3Brdg?oc=5","source":"콜뉴스24","summary":"서울 택시 업계가 극심한 기사 부족으로 인한 인력난을 겪고 있습니다.\n택시회사들은 문제 해결을 위해 중국 국적 동포 채용에 적극 나서기 시작했습니다.\n기존의 채용 문턱을 낮추어 부족한 운전기사를 신속하게 확보하려는 취지입니다.\n동포 기사 채용을 통해 택시 가동률을 회복하고 운행 차질을 줄이고자 합니다.\n외국인 인력 활용에 따른 서비스 관리와 관련 제도 개선도 함께 요구되고 있습니다.","cardImagePath":"","category":"채용","hash":"f047ba3b9237e84f2ddf3bf45e09c1d5e2fe926b6151696edc55dac4e704cf6b","industry":"일반·전체"},{"date":"2026-09-24","title":"\"중국 교포 환영, 월수입 최대 600만원\"…인력난에 파격 공고 낸 택시회사","link":"https://news.google.com/rss/articles/CBMiZ0FVX3lxTE1xNEpwcV9RTUVGOFlwLTdrdkJrdTV5V2RWTUI5TFljZFd0U0tFb19KekdvTjBrbnhNNVFPR2FUUDI3cHMyRnlURldFY3Y4LXlvajBlSXRwNXNUa0V3WG1VdXl6Vl9oZE3SAWdBVV95cUxNcTRKcHFfUU1FRjhZcC03a3ZCa3U1eVdkVk1COUxZY2RXdFNLRW9fSnpHb04wa254TTVRT0dhVFAyN3BzMkZ5VEZXRWN2OC15b2owZUl0cDVzVGtFd1htVXV5elZfaGRN?oc=5","source":"뉴스1","summary":"심각한 기사 부족난을 겪는 택시업계가 중국 동포를 대상으로 한 채용 공고를 내걸었습니다.\n해당 업체는 월 최대 600만 원의 수익을 보장하며 교포 인력 확보에 적극 나서고 있습니다.\n코로나19 이후 기사들이 배달 및 배송 업계로 이탈하면서 법인택시 구인난이 심화되었습니다.\n취업 비자를 보유하고 택시운전 자격증을 취득하면 외국인도 택시 기사로 일할 수 있습니다.\n이를 두고 심각한 인력난을 해소하려는 노력이라는 평가와 함께 안전 우려도 제기되고 있습니다.","cardImagePath":"","catego 향후 다른 대형 조선사들의 임금협상에도 영향을 미칠 전망입니다.","cardImagePath":"images/20260924_061004_4.png","category":"기타","hash":"bbecce035c4b2034106f7c901560c8bf51f3438736ad0567279162d46ccc223d","industry":"일반·전체"},{"date":"2026-09-24","title":"대법원 노동법실무연구회, 10월 정기세미나","link":"https://news.google.com/rss/articles/CBMibkFVX3lxTE1DV2RFMEtwVllMN1pYamN5QmJONE03VzBZSG9FN2xSX0p5UmhKTkNWakFEcldvVnIwUl91akgxN1FFRTBJUnc3T0lUaEJlMGtxSGtyQzRfVVhucW10dXlocmhtZ1FhYTJkeFR0dXZR0gFyQVVfeXFMTk5wY3RIZklUZngwR2dQOS15WXRoUlFlb3JNN3RxOWZCWm5uS1dOaXRtUVJFTXJWVlNaa3dVbVM4N3NxMm5TQWZhRmk2NDd2YzNlUjZxQXZQcXBmdTczcFFaa0pkWVVzS3dQS3pBUHhhNDh3?oc=5","source":"법률신문","summary":"대법원 노동법실무연구회가 10월 정기세미나를 개최하고 관련 소식을 전했다.\n이번 세미나에서는 노동법 분야의 주요 최신 현안과 법적 쟁점을 다룬다.\n법관 및 노동법 전문가들이 참여하여 학술적·실무적 연구 논의를 진행한다.\n현장 실무에 적용 가능한 판례 해석과 법리적 검토가 깊이 있게 이루어진다.\n노동 법률 발전과 실무 역량 강화를 위한 소통의 장이 마련되었다.","cardImagePath":"images/20260924_061004_3.png","category":"노동법","hash":"f65942d1b2296e51cffcd18b08f719b8582272d474cd591df9c46cede8f1300d","industry":"일반·전체"},{"date":"2026-09-24","title":"[금진호의 AI, 사람을 향하다] 정년이 사라지는 시대, AI는 어떻게 생각하고 있을까?","link":"https://news.google.com/rss/articles/CBMiY0FVX3lxTE9QM3VHQjFPaVZQck5YU2xxZmtMV3hfLVJfYkRQQTNEekJ0aUtnemJaZkN4Rkc1Y1RMVFJGUTVGa01ZZnJFNEV5NTRJYmlPUFJxNmJmMVJ2M2VwWlhVaEZvNHNDUQ?oc=5","source":"쿠키뉴스","summary":"정년 개념이 사라지는 시대를 맞아 인공지능이 나아가야 할 방향성에 대한 논의가 부각된다.\n초고령화 사회로의 진입과 기술 발전은 기존의 노동 및 은퇴 구도를 변화시키고 있다.\n인공지능은 단순히 일자리를 대체하는 것이 아니라 인간 중심의 가치를 지향해야 한다.\nAI 기술은 고령 근로자의 역량을 보완하고 지속 가능한 노동 환경을 구축하는 데 활용된다.\n궁극적으로 AI는 사람을 향한 기술로서 인간과 공존하며 삶의 질 향상을 이끌어내야 한다.","cardImagePath":"images/20260924_061004_2.png","category":"기타","hash":"3e98e5a409e44001fbbec4831f0805f4295900e41a73d2aafb8f28a75894e0c2","industry":"일반·전체"},{"date":"2026-09-24","title":"현대차 노조 “정년연장이 최고 성과”…취업규칙 특례도 무력화","link":"https://news.google.com/rss/articles/CBMiT0FVX3lxTFBWNkM5cnBXanZ0dndlbDFON19kZmx6S2d1c0kzc1QyZmhVRkc5MTRMdThrN2ZsejRjTWpIQWlmNlR4TUt3ODF2RWhJbmRhYWs?oc=5","source":"v.daum.net","summary":"현대자동차 노조가 올해 임금 및 단체협약 타결 내용 중 정년 연장 관련 성과를 최고로 꼽았다.\n노조는 정년 퇴직자 재고용 기간을 늘려 실질적인 고용 연장 효과를 이끌어냈다.\n협상 과정에서 기존 사측의 취업규칙 특례 조항을 사실상 무력화하는 데 성공했다.\n이에 따라 조합원들은 정년 이후에도 안정적인 경제 활동과 근로 조건을 확보하게 되었다.\n이번 합의는 향후 국내 주요 제조업계 전반의 정년 연장 논의에 큰 영향을 미칠 것으로 전망된다.","cardImagePath":"images/20260924_061004_1.png","category":"기타","hash":"14512c7c0a9adcb701f9be039665c59e5bd83f26122b3682ef3bd6d6dd68ffbe","industry":"일반·전체"},{"date":"2026-09-23","title":"KF-21 양산 1호기, 공군 예천기지에 배치","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE9Xd0ZiaVp2bl8yVG53MjhFVGpKQUFUVXNZM3JXQlJxTXBWQU1aMUNmUVd6RmF5bGFQZnppdjV6ZGJwZHd5TVptUjgtVjVNXzVZOWZOa3dDZjRFNHBPcXJIbUx1cUI2ZDc4dDlxUDdXb9IBb0FVX3lxTE9Xd0ZiaVp2bl8yVG53MjhFVGpKQUFUVXNZM3JXQlJxTXBWQU1aMUNmUVd6RmF5bGFQZnppdjV6ZGJwZHd5TVptUjgtVjVNXzVZOWZOa3dDZjRFNHBPcXJIbUx1cUI2ZDc4dDlxUDdXbw?oc=5","source":"한스경제","summary":"","cardImagePath":"","category":"기타","hash":"549e8e08f58f17a2e0656d6ac96422cef96583e66e995ef5d001f18203d5cd2b","industry":"일반·전체"},{"date":"2026-09-23","title":"현장과 상아탑 잇는 산학 동맹…KAI, 카이스트와 손잡고 '한국형 탑건 두뇌' 키운다","link":"https://news.google.com/rss/articles/CBMia0FVX3lxTE1VWWMtR0xTYW1HNW1GbVVOUGJ5RXNJdXBzckRzc0V4R1dDeG0yajE3TjdSTFpBN1JoamRfdXQ5ZVk3QndRMlRrLTRsVFFUdW1iN1MwcHJIOHR3OEFndWFiYXpoMERhZ3ZLTm0w?oc=5","source":"일간투데이","summary":"한국항공우주산업과 카이스트가 미래 항공우주 전문 인재 양성을 위한 산학 협력을 체결했다.\n이번 협약은 산업 현장의 실무와 학계의 연구 인프라를 결합해 시너지를 내는 데 중점을 둔다.\n양 기관은 차세대 항공우주 핵심 기술 개발과 전문 교육 과정 운영을 공동으로 추진한다.\n최고 수준의 역량을 갖춘 한국형 탑건 인재를 육성하여 국가 기술 경쟁력을 강화할 방침이다.\n현장과 학술을 잇는 이번 동맹을 통해 국내 항공우주 산업의 미래 성장 동력을 확보한다.","cardImagePath":"","category":"기타","hash":"3c4e758df87f872e5bb7b7775a3dcfa8f0d2f9f757dd27ef3371735ff8c9c7cf","industry":"방산·항공우주"},{"date":"2026-09-23","title":"\"4.5세대 너머 5.5세대 진화\" KF-21 001호기 공군 인도 '멈티·스텔스 플랫폼'","link":"https://news.google.com/rss/articles/CBMiVEFVX3lxTFBrTVpWS1ItVDkwenBQTVNmYUROdFZFZUJDNkQtQzFXTHBRTlJVR2laZTV2Tk1QVzRROGlQdklKTVdQdEpSUVVTVUZVbnZEWFpEazBmQw?oc=5","source":"v.daum.net","summary":"한국형 전투기 KF-21 1호기가 공군에 인도되며 실전 배치를 위한 전환점을 맞이했다.\n이번 사업은 단순 4.5세대 전투기를 넘어 5.5세대급 성능 확보를 목표로 추진된다.\n유무인 복합체계(MUM-T)를 적용하여 무인기와 통합 작전을 수행하는 능력을 갖춘다.\n향후 스텔스 형상 변경과 내부 무장창 신설을 통해 스텔스 플랫폼으로 진화할 예정이다.\nKF-21의 진화는 대한민국 공군의 전력 증강과 방산 수출 확대에 크게 기여할 것으로 보인다.","cardImagePath":"","category":"기타","hash":"0be57d2cfb99d7e60d18c636248cb063dd927cdc6758c74ed04d40bde7aa898e","industry":"IT·플랫폼"},{"date":"2026-09-23","title":"진학사 캐치, 추석 앞두고 그룹 공채 잇따라…신세계∙동원∙한솔 채용","link":"https://news.google.com/rss/articles/CBMiakFVX3lxTFB5bUZHa0FfdU13M3otQUk2UTFnWjloRWpYaXRPSE1JMDcxbEtHaDNCNS1wTFY3SnZiV3lDekVlNlRtMnRTTEhXRFFFRnJqLThrVDNsUzFFT2dVYjhjb3hXMExNM2huelkyb3c?oc=5","source":"한국면세뉴스","summary":"추석 명절을 앞두고 대기업들의 하반기 신입 사원 공개 채용이 시작되었습니다.\n채용 플랫폼 캐치에 따르면 신세계, 동원, 한솔 등 주요 그룹이 공채를 진행합니다.\n신세계그룹은 백화점과 이마트 등 주요 계열사에서 하반기 신입사원을 모집 중입니다.\n동원그룹과 한솔그룹 역시 각 직무별로 신입 및 인턴 채용 접수를 진행하고 있습니다.\n구직자들은 기업별 채용 일정과 자격 요건을 미리 확인하고 대비할 필요가 있습니다.","cardImagePath":"","category":"채용","hash":"793ffe0560fecc97b06f3fd5da277001c82cf72db4747f60daf5528f46ead056","industry":"일반·전체"},{"date":"2026-09-23","title":"CJ푸드빌, 하반기 공채 지원자 대상 채용설명회 개최","link":"https://news.google.com/rss/articles/CBMiX0FVX3lxTE9SYXZNaVNQbHNCUUptSWh6OFJTN0lfUWJaOXVNdTJ2aDROel9zVFNMeTlsZzVTWktDR3MtWkk5LVdwSU9fUWJMZUVmTVBoSXFCVk5aeUY3T2ltOWZPTjBz0gFkQVVfeXFMTjJ6ZjRmNTNYaG5DMndtVkhTYktQM3JxbklMclpqTkJMY3poVjFNaER0ZnNvZFZtSHgzekczUVhESGRUX0UwMjFMVVdUVFpiNXdrdHlCc0s1NWtScm4zbjQ5YVNtdg?oc=5","source":"뉴스1","summary":"CJ푸드빌이 하반기 공개채용 지원자를 대상으로 채용설명회를 개최한다.\n이번 행사에서는 회사 소개와 함께 주요 직무별 역할에 대한 상세한 정보가 제공된다.\n현직 직무 담당자들이 참여해 채용 전형 절차와 실제 상세 업무 경험을 공유한다.\n지원자들의 궁금증을 해소하기 위한 맞춤형 질의응답 프로그램도 함께 진행된다.\nCJ푸드빌은 이를 통해 우수한 역량을 갖춘 인재들을 적극적으로 확보할 계획이다.","cardImagePath":"","category":"채용","hash":"ac03e4d99fce764c6a36f8b9b3c5984046847a6582215472bd97bccd10aab647","industry":"일반·전체"},{"date":"2026-09-23","title":"오하이오주 1,800만 달러 행동건강 장학 프로그램, 신시내티 대학 120만 달러 배정으로 지역 인력난 정면 돌파","link":"https://news.google.com/rss/articles/CBMiSkFVX3lxTE8zM2g1ZGg3MWNTTEtOWVpDZ2RUQ29NdThXbjY3cW03Y0xsVzhnVG5OaEFCWDZvVk1LSVpXUVdpbHNDTEU5UkhNeVZn?oc=5","source":"얼리어답터뉴스","summary":"오하이오주가 행동건강 분야 전문 인력 양성을 위해 1,800만 달러 규모의 장학 프로그램을 추진합니다.\n신시내티 대학교는 해당 사업의 일환으로 총 120만 달러의 지원 예산을 배정받았습니다.\n지원금은 관련 전공 학생들의 학비 부담을 낮추고 실무 역량을 강화하는 데 활용됩니다.\n오하이오주 정부는 이를 통해 심각한 지역 사회 행동건강 인력 부족 문제를 정면 돌파하고자 합니다.\n이번 장학 정책은 지역 내 행동건강 서비스 향상과 지속 가능한 인력 수급에 기여할 전망입니다.","cardImagePath":"","category":"기타","hash":"5f1ce27923d53c8322effb2da27753ca2d7996bdb0485185d0c6d4b41082d208","industry":"일반·전체"},{"date":"2026-09-23","title":"고연선 상주시의원 \"소상공인 인력난 해소할 외국인력 제도 별도 마련해야\"","link":"https://news.google.com/rss/articles/CBMiVEFVX3lxTE1jWkFOaGJLLV9BdXRpVi0tbURMcEF1NVpiS1dqNTZVV1RvZkdCUFhmUjE5NGtiVWJGZVRmNnMtbDRWRXMyR2tfMWd5TU5keThuT1lOQw?oc=5","source":"타임뉴스","summary":"상주시의회 고연선 의원이 지역 소상공인의 심각한 인력난 문제를 지적했습니다.\n기존 외국인력 제도가 소상공인 현장 수요를 제대로 반영하지 못한다고 주장했습니다.\n소상공인 업종 특성에 맞춘 별도의 외국인 근로자 도입 제도를 촉구했습니다.\n고용 요건 완화와 맞춤형 지원 등 현장 중심의 정책 마련을 제안했습니다.\n지역 경제 활성화와 소상공인 생존권 보장을 위한 적극적인 제도 개선을 당부했습니다.","cardImagePath":"","category":"기타","hash":"17aea3d91fa304d191a15fb79c39f7c51cf369c6c4e3a185b02c77a4bbf9b1cc","industry":"일반·전체"},{"date":"2026-09-23","title":"[사회/고용] 베트남 건설·인프라 현장 인력난 심화…숙련 기능공·기술자 몸값 급등","link":"https://news.google.com/rss/articles/CBMicEFVX3lxTE1NTVZISGZ1bURxX2FMQjNwUTl5WU1JWXJRdFBlckZsdWd0eXJCSlZwbjcxS1FjZF9mNVZHYWw5SHJJdUdKTGdYV3FxM2xReHNqQnQ3ZkhjOVBjWEZyOEhWcGdCSi1NZmpRN1JLOVBZZ2o?oc=5","source":"굿모닝베트남미디어","summary":"베트남 건설 및 인프라 현장에서 인력 부족 현상이 심화되고 있다.\n특히 현장 숙련 기능공과 전문 기술자의 구인난이 가중되는 상황이다.\n희소성이 높아진 숙련 인력의 몸값과 인건비가 급격히 상승하고 있다.\n대형 인프라 사업의 차질을 막기 위해 신속한 인력 확보가 요구된다.\n기업들은 인재 유출을 막고 유치하기 위한 처우 개선에 나서고 있다.","cardImagePath":"","category":"기타","hash":"0496b1dda209f27207f4510fbb704a7f4d940cb677630f57533e5e389b02093f","industry":"일반·전체"},{"date":"2026-09-23","title":"마이클 페리 페르소나AI \"조선 등 중공업 현장 인력난⋯해법은 휴머노이드\"","link":"https://news.google.com/rss/articles/CBMiS0FVX3lxTE5aNWFZSkxZTC0xbVlpUkJQMk5KZGl1Z29uMGxWVDR2cUJLUGwwS3lPdUpWaV82cHRQSEhIc01SeXNNWVU1R1hyOEltVQ?oc=5","source":"아이뉴스24","summary":"마이클 페리 페르소나AI 대표는 국내 중공업 분야의 심각한 인력난을 지적했다.\n특히 조선업 등 위험하고 고된 노동 현장에서 일손 부족 문제가 심화되고 있다.\n이러한 산업 현장의 인력난을 해결할 혁신적 대안으로 휴머노이드 로봇을 제시했다.\n휴머노이드는 인간의 작업 환경에 최적화되어 위험하고 반복적인 업무를 대체할 수 있다.\n로봇 기술 도입을 통해 생산성을 높이고 중공업 분야의 경쟁력을 강화할 수 있을 것으로 기대된다.","cardImagePath":"","category":"기타","hash":"3ef2e65f10b1a13405fc7f7d070c94818c5af641958beeec464be4cb64d1b646","industry":"제조·자동차"},{"date":"2026-09-23","title":"“인력난 외면하고 노조 탄압” 이마트 신제주점 노조 반발","link":"https://news.google.com/rss/articles/CBMia0FVX3lxTE5mcWpNNlJoZ1pybGtxYms0eER6LXFTd0NFYTA0QXF0TFJRb1BvYmdaZEV4Vm1PVFpibEltekdRWXNuVUVGcEstcHdMejYxSGJoaGczVGF0emp0QjNkYWUwVzctVDZRbF8xSktV?oc=5","source":"제주의소리","summary":"이마트 신제주점 노동조합이 사측의 인력난 방치와 노조 탄압을 규탄하며 반발했다.\n노조는 현장의 심각한 인력 부족 문제에 대해 사측이 무대응으로 일관하고 있다고 지적했다.\n또한 정당한 노동조합 활동에 대한 사측의 부당한 압박과 탄압이 지속되고 있다고 주장했다.\n이에 따라 노조 측은 즉각적인 인력 충원과 함께 노조 탄압 중단을 강력히 촉구했다.\n사측의 전향적인 태도 변화가 없을 경우 대응 수위를 더욱 높여나갈 방침이다.","cardImagePath":"","category":"기타","hash":"7cd2b8b6fce11488e800770c9a1c7588c1f1cc17bddaaa61be3f94d2e7029074","industry":"일반·전체"},{"date":"2026-09-23","title":"청양군, 농촌 인력난 대응 AI 농사로봇 실증 추진","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTE9iOEkwZ1BHcVNneElYdkp2T2N0SFV0azEtVXI4V1Q0VC1oZHRrWlFWckd6NUxZcDdNSHllb0ZPeS00TXBfZW5ZTjlySGJ3cGIyZ0hRVnp1ejRxVkhXb3dYa0YxWmduRkdXZmNESA?oc=5","source":"농수축산신문","summary":"청양군이 농촌 인력 부족 문제를 해결하기 위해 AI 농사로봇 실증 사업을 추진한다.\n인공지능 기술을 활용해 농작업 자동화를 실현하고 농업 생산성을 높일 계획이다.\n실증 단계를 통해 농사로봇의 현장 적용 가능성과 안전성을 집중 검증한다.\n로봇 도입으로 일손 부족을 해소하고 농가의 노동 부담을 대폭 줄일 것으로 기대된다.\n청양군은 지속 가능한 미래형 스마트 농업 기반을 확대 구축해 나갈 방침이다.","cardImagePath":"","category":"기타","hash":"4db4f2cda3c0fcbdb9e07ff921e4b7f50d53950410734670bc0f446609ee1518","industry":"일반·전체"},{"date":"2026-09-23","title":"“월 300만원 이상, 중국 동포 환영”…택시 인력난에 외국인 기사 ‘러브콜’","link":"https://news.google.com/rss/articles/CBMiW0FVX3lxTFB3OHNWMVZiSkRTVVczeVY3a0x1a1laQkw1RmhnbmNobXd6eDNPYWk0SUFCUmc3WmJyNHVrY0xiY1FETVZCM3dHU042ZUVKU19UQ1o1ODBTZS1DUEk?oc=5","source":"경기일보","summary":"택시 업계의 심각한 인력난으로 운전기사 수급에 비상이 걸렸습니다.\n업체들은 중국 동포와 외국인 기사 채용으로 활로를 모색하고 있습니다.\n월 300만 원 이상의 높은 급여 조건을 제시하며 적극적인 구인에 나섰습니다.\n외국인 기사 도입을 위한 자격 요건 완화 등 제도 개선 논의가 진행 중입니다.\n이번 조치가 택시 운행 차질을 줄이고 인력난을 해소할지 주목됩니다.","cardImagePath":"images/20260923_061123_5.png","category":"기타","hash":"f61a52b882c4c6259736e604239933a52953bfcb3947ca7971cba0228467009d","industry":"일반·전체"},{"date":"2026-09-23","title":"기업 인력난·구직난 함께 푼다…경산 취업지원센터 문 열어","link":"https://news.google.com/rss/articles/CBMib0FVX3lxTE5ueVJDeDNDa0FEdFg2T0R1U0trY1lmZGtJMkFpZjRLNHJkMmlmdlkxVGtVOXBjc0ViN1JnXzc3dHpUem5RY2Vzai1vRGIxanM4V2RKaHZEVGMtUkhQNjh2VFEyQmdTM2pRTjlPdDVHSQ?oc=5","source":"kyongbuk.co.kr","summary":"경산에 기업 인력난과 구직자의 구직난을 해소하기 위한 취업지원센터가 개소했다.\n지역 기업과 구직자 간의 매칭을 지원하여 일자리 불균형을 해소하고자 한다.\n기업에는 적합한 인재를 추천하고 구직자에게는 맞춤형 일자리를 연계한다.\n경산 취업지원센터 운영을 통해 지역 고용 시장의 활성화를 도모한다.\n제공된 기사 본문은 시스템 오류로 인해 세부 내용 확인이 불가능한 상태이다.","cardImagePath":"images/20260923_061123_4.png","category":"기타","hash":"8f87fedf4bae4ee57b607ff5339da6d5a37aa0cfcb147da21f9555a6b53c92a6","industry":"일반·전체"},{"date":"2026-09-23","title":"치협·간무협, 치과 보조인력난 해법 머리 맞댔다","link":"https://news.google.com/rss/articles/CBMiaEFVX3lxTE1XcUwxYWtWMDMwUFFOS3ppSG1UTlJqSk9nVWlCbGR0cGM0dUJSV2YtYkM1ZzkyRHFaYVU3cjNLWUZab3Vqek9nM2xlcFZsNjBJX2EzVXExOEJiWjZlWDhCMjVsWFRJZEpK?oc=5","source":"치의신보","summary":"대한치과의사협회와 대한간호조무사협회가 치과 의료기관의 심각한 보조인력 난제 해결을 위해 협력하기로 했다.\n양 단체는 간호조무사의 치과 임상 역량을 강화하고 전문성을 제고하기 위한 교육 방안을 집중 논의했다.\n치과 맞춤형 인재 양성을 통해 현장에 즉시 투입 가능한 실무형 보조인력 공급을 확대할 계획이다.\n근무 환경 개선과 법적·제도적 지원책 마련을 통해 종사자의 장기 근속을 도모하기로 뜻을 모았다.\n향후 정례적인 협의체를 운영하여 인력난 해소를 위한 실질적인 상생 협력 방안을 지속 추진할 방침이다.","cardImagePath":"images/20260923_061123_3.png","category":"기타","hash":"fb8fb4a4dc40c1cec81dcbba54da0e7cfa3dbf501582a6905bae3165628af568","industry":"일반·전체"},{"date":"2026-09-23","title":"성남시, 내년 생활임금 1만2900원…월 환산 269만6100원","link":"https://news.google.com/rss/articles/CBMic0FVX3lxTE50RlNaWVdkN1JUNjZfQTZiSjZfdXg0cUdWQVBzV1dMS3B2aksycTNPSzNzY1d5LVY4TUg5T1lMU2RSTm54VFp1VlJtMVBkNEJRT3JBbURHOFp2OWZvNFRpNU92OHdTRFJPcnNXQmVTeUNWWmfSAXNBVV95cUxOdEZTWllXZDdSVDY2X0E2Yko2X3V4NHFHVkFQc1dXTEtwdmpLMnEzT0szc2NXeS1WOE1IOU9ZTFNkUk5ueFRadVZSbTFQZDRCUU9yQW1ERzhadjlmbzRUaTVPdjh3U0RST3JzV0JlU3lDVlpn?oc=5","source":"newsworks.co.kr","summary":"성남시가 내년도 적용할 생활임금을 시급 1만 2900원으로 최종 확정했다.\n주 40시간 근무 기준 월 환산액은 269만 6100원으로 올해 대비 인상되었다.\n이번 생활임금은 정부가 정한 내년도 법정 최저시급보다 높은 금액이다.\n지역 물가 상승률과 노동자의 실질적인 생활 안정을 종합적으로 고려해 결정했다.\n확정된 임금은 성남시 및 출자·출연기관 소속 노동자 등에게 적용될 예정이다.","cardImagePath":"images/20260923_061123_2.png","category":"기타","hash":"d9b501495fe6dd8e5fd81e9a4c167975016b797ecc47b23376a5c419c6f7a4cf","industry":"일반·전체"},{"date":"2026-09-23","title":"한국필립모리스 노사, 2026년 임금협약 체결","link":"https://news.google.com/rss/articles/CBMibkFVX3lxTE1zcXNKYkh6bkxVZnpmNnBzTkFjdHQ0T1dDY3E4ZWtLRDZsWDJZenloUUpfUnpBMTRRZjg5YjlCQXRXaGVGVnpTWDktekVnNzJuNTZ1b1NlU1RGOUNkV0k3QTRxWU00NWxjeEN4MlZR?oc=5","source":"참여와혁신","summary":"한국필립모리스 노사가 2026년도 임금협약을 최종 타결했습니다.\n노사 양측은 대화와 타협을 통해 원만하게 합의안을 마련했습니다.\n이번 타결로 상호 신뢰 기반의 안정적인 노사 관계를 구축했습니다.\n임금 협상 타결을 바탕으로 기업 경쟁력 강화를 추진합니다.\n노사는 앞으로도 지속 가능한 성장을 위해 협력을 이어갈 계획입니다.","cardImagePath":"images/20260923_061123_1.png","category":"기타","hash":"c73323f9d34838ce6e73252a48e4a2a411394eeded83bb007cc3026766519639","industry":"일반·전체"},{"date":"2026-09-22","title":"[단독] 韓 방산·건설사, 이라크에 5650억원 못 받았다","link":"https://news.google.com/rss/articles/CBMihgFBVV95cUxOWE9iUkxIWV96dzRyX2VhOG4xOUFvWDNfMTRTYXNEUlhDQTVFdWtiajFfdVZzSFBXNWdxdHBfR1FzVndzeGNMczZfLTlWSlFxRmkwcFFZN0ZNRTZmUEdISGNUVUw0MHkxbzdEejh2ems3Mm5fMW1EdXZBVldWUXZlaFRBUTViZw?oc=5","source":"조선일보","summary":"한국 방산 및 건설 기업들이 이라크 정부로부터 약 5650억 원의 대금을 받지 못한 것으로 확인되었다.\n비스마야 신도시 프로젝트와 방산 물자 수출 등 주요 사업에서 대규모 미수금이 발생했다.\n이라크의 정치적 불안정과 예산집행 지연이 대금 지급 차질의 주요 원인으로 지목된다.\n대금 회수가 장기화되면서 국내 진출 기업들의 유동성 악화와 경영 부담이 가중되고 있다.\n정부와 채권 기업들은 이라크 당국과의 다각적 협의를 통해 미수금 회수를 위한 대응책을 모색하고 있다.","cardImagePath":"","category":"기타","hash":"4dd73d79e147ac508fedc7941477f26de2e6d7391f52262baa60c28d1b3ef1e6","industry":"방산·항공우주"},{"date":"2026-09-22","title":"건설·제조·유통 인재 다 모여라… 호반그룹 ‘세 자릿수’ 신입 공채","link":"https://news.google.com/rss/articles/CBMie0FVX3lxTE81S25GZ3RuVG
