<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HR·채용·노동법 뉴스 아카이브</title><link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>*{box-sizing:border-box;}:root{--navy:#0F172A;--accent:#2563EB;--accent-light:#EFF4FF;--bg:#F6F7FB;--text:#1E293B;--muted:#64748B;--border:#E6E9F0;}body{font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;background:var(--bg);margin:0;color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;}a{color:inherit;}header{background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 100%);color:#fff;padding:40px 20px 32px;text-align:center;}header h1{margin:0 0 10px;font-size:26px;font-weight:800;letter-spacing:-0.5px;}header p{margin:0;color:#AEB9CC;font-size:13.5px;}header a{color:#C7D6F5;text-decoration:none;font-weight:600;}header a:hover{text-decoration:underline;}.stats-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:18px 16px;background:#fff;border-bottom:1px solid var(--border);}.stat-pill{background:var(--accent-light);color:var(--accent);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:700;letter-spacing:0.2px;}.stat-pill.total{background:var(--navy);color:#fff;}.layout{display:flex;max-width:1240px;margin:0 auto;align-items:flex-start;gap:8px;}.sidebar{width:230px;flex-shrink:0;padding:24px 12px;position:sticky;top:56px;align-self:flex-start;}.sidebar-section{margin-bottom:26px;}.sidebar-section h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin:0 0 10px 10px;font-weight:700;}.sidebar ul{list-style:none;margin:0;padding:0;}.sidebar li{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;color:#334155;transition:background .15s;margin-bottom:2px;}.sidebar li:hover{background:var(--accent-light);}.sidebar li.active{background:var(--accent);color:#fff;font-weight:600;}.sidebar li .count{color:#94A3B8;font-size:11px;}.sidebar li.active .count{color:#DCE8FF;}main{flex:1;padding:24px 20px 40px;min-width:0;}.search-bar{display:flex;gap:8px;margin-bottom:14px;}.search-bar input{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff;transition:border-color .15s;}.search-bar input:focus{outline:none;border-color:var(--accent);}.search-bar button{padding:12px 18px;border:none;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s;}.search-bar button:hover{opacity:0.85;}#resultCount{font-size:12.5px;color:var(--muted);margin-bottom:14px;font-weight:500;}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}.matrix-wrap{max-width:1240px;margin:20px auto 0;padding:0 20px;}.matrix-title{font-size:14px;color:var(--navy);font-weight:700;margin:0 0 10px 2px;}.matrix-table{width:100%;border-collapse:separate;border-spacing:4px;font-size:12px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(15,23,42,0.04),0 1px 8px rgba(15,23,42,0.05);}.matrix-table th{font-size:11px;color:var(--muted);font-weight:700;padding:6px 4px;text-align:center;}.matrix-table th.row-head{text-align:left;padding-left:8px;}.matrix-table td{text-align:center;padding:0;}.matrix-cell{display:flex;align-items:center;justify-content:center;height:40px;border-radius:8px;cursor:pointer;font-weight:700;color:#94A3B8;background:#F1F5F9;transition:transform .1s,filter .1s;}.matrix-cell:hover{transform:scale(1.05);}.matrix-cell.has-count{color:#fff;background:var(--accent);}.matrix-cell.active{outline:2px solid var(--navy);outline-offset:1px;}.matrix-row-label{font-weight:600;color:#334155;padding-left:8px;white-space:nowrap;}.card{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,23,42,0.04),0 1px 8px rgba(15,23,42,0.05);overflow:hidden;transition:transform .15s,box-shadow .15s;border:1px solid var(--border);}.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(15,23,42,0.09);}.card .card-img{width:calc(100% + 36px);margin:-16px -18px 12px;display:block;max-height:150px;object-fit:cover;}.card .card-img.info{max-height:none;object-fit:contain;background:#FFF8E7;}.card .title{font-weight:700;font-size:14.5px;color:var(--navy);text-decoration:none;display:block;margin-bottom:8px;letter-spacing:-0.1px;}.card .title:hover{color:var(--accent);}.card .meta{font-size:11.5px;color:var(--muted);margin-bottom:10px;}.card .meta .tag{background:var(--accent-light);color:var(--accent);border-radius:999px;padding:2px 9px;font-size:10px;font-weight:700;}.card .summary{font-size:12.5px;color:#475569;white-space:pre-line;line-height:1.6;}.card .del-btn{margin-top:12px;background:#FEF2F2;color:#DC2626;border:1px solid #FCD5D5;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:background .15s;}.card .del-btn:hover{background:#FCE4E4;}footer{text-align:center;color:#94A3B8;font-size:12px;padding:28px 20px;}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;}.chips:empty{display:none;}.chip{background:var(--accent-light);color:var(--accent);border:1px solid #C7D6F5;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;}.chip b{margin-left:2px;}.chip:hover{filter:brightness(.95);}.chip.clear{background:#fff;color:#64748B;border-color:var(--border);}.quick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;}.qbtn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;color:#334155;cursor:pointer;}.qbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);}.card .meta .tag.star{background:#FEF3C7;color:#B45309;}.card .meta .tag.core{background:#DCFCE7;color:#15803D;}.more-btn{display:block;margin:22px auto 0;padding:11px 28px;border:1px solid var(--border);background:#fff;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--navy);cursor:pointer;}.more-btn:hover{background:var(--accent-light);}#matrixContainer{overflow-x:auto;-webkit-overflow-scrolling:touch;}.matrix-table{min-width:680px;}.matrix-table th.row-head,.matrix-table td.matrix-row-label{position:sticky;left:0;background:#fff;z-index:2;}@media (max-width:800px){.layout{flex-direction:column;gap:0;}.sidebar{width:100%;position:static;display:flex;gap:20px;overflow-x:auto;padding:16px;}.sidebar-section{margin-bottom:0;flex-shrink:0;}}.site-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid #E6E9F0;display:flex;justify-content:center;gap:4px;padding:8px 12px;overflow-x:auto;}.site-nav a{white-space:nowrap;text-decoration:none;color:#475569;font-size:14px;font-weight:600;padding:9px 18px;border-radius:999px;transition:background .15s,color .15s;}.site-nav a:hover{background:#EFF4FF;color:#2563EB;}.site-nav a.active{background:#0F172A;color:#fff;}@media (max-width:600px){.site-nav{justify-content:flex-start;}.site-nav a{padding:8px 14px;font-size:13px;}}</style></head><body><header><h1>📋 HR·채용·노동법 뉴스 아카이브</h1><p>매일 자동 수집되는 인사·채용·노동법 트렌드 뉴스</p></header><nav class="site-nav"><a href="index.html" class="active">📋 뉴스 아카이브</a><a href="weekly.html">📔 주간 브리핑</a><a href="ontology.html">🕸️ 온톨로지</a><a href="submissions.html">👥 제출자료</a></nav><div class="stats-bar" id="statsBar"></div><div class="matrix-wrap"><h3 class="matrix-title">산업군 × HR영역 매트릭스</h3><div id="matrixContainer"></div></div><div class="layout"><aside class="sidebar"><div class="sidebar-section"><h3>카테고리</h3><ul id="categoryList"></ul></div><div class="sidebar-section"><h3>날짜별</h3><ul id="dateList"></ul></div></aside><main><div class="search-bar"><input type="text" id="searchInput" placeholder="제목/내용 검색..."><button id="resetBtn">전체보기</button></div><div class="quick"><button id="coreBtn" class="qbtn">⭐ 핵심 (방산·산학·HRD)</button><button id="starBtn" class="qbtn">⭐ 주간 선정</button></div><div id="activeChips" class="chips"></div><div id="resultCount"></div><div id="cardsContainer" class="grid"></div><div id="moreWrap"></div></main></div><footer>마지막 업데이트: 2026-11-14 12:25 (KST)</footer><script>var NEWS_DATA = [];
const BUILD_TS = "1794626757642";
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxvCeYZ2-vWusjsu7skjgiRMhagia-qS2uy5AFfhe3w3jAMdu0heoOGsrb76EFjfDJKQQ/exec";
const DELETE_SECRET = "kai-hr-2026-delete";
function escapeHtml(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var PAGE=24;
var state={category:null,date:null,industry:null,query:'',core:false,starred:false,limit:PAGE};
var lastSig='';
function renderStats(){
  var byCat={};
  NEWS_DATA.forEach(function(item){byCat[item.category]=(byCat[item.category]||0)+1;});
  var html='<span class="stat-pill total">전체 '+NEWS_DATA.length+'건</span>';
  Object.keys(byCat).sort().forEach(function(cat){html+='<span class="stat-pill">'+escapeHtml(cat)+' '+byCat[cat]+'건</span>';});
  document.getElementById('statsBar').innerHTML=html;
}
function renderMatrix(){
  var categories=[];var industries=[];
  var counts={};
  NEWS_DATA.forEach(function(item){
    if(categories.indexOf(item.category)===-1)categories.push(item.category);
    if(industries.indexOf(item.industry)===-1)industries.push(item.industry);
    var key=item.category+'||'+item.industry;
    counts[key]=(counts[key]||0)+1;
  });
  categories.sort();industries.sort();
  var html='<table class="matrix-table"><thead><tr><th class="row-head">HR영역 \\ 산업군</th>';
  industries.forEach(function(ind){html+='<th>'+escapeHtml(ind)+'</th>';});
  html+='</tr></thead><tbody>';
  categories.forEach(function(cat){
    html+='<tr><td class="matrix-row-label">'+escapeHtml(cat)+'</td>';
    industries.forEach(function(ind){
      var key=cat+'||'+ind;var c=counts[key]||0;
      var isActive=(state.category===cat&&state.industry===ind);
      html+='<td><div class="matrix-cell'+(c>0?' has-count':'')+(isActive?' active':'')+'" data-cat="'+escapeHtml(cat)+'" data-ind="'+escapeHtml(ind)+'">'+(c>0?c:'')+'</div></td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  document.getElementById('matrixContainer').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('.matrix-cell'),function(cell){
    cell.addEventListener('click',function(){
      var cat=cell.getAttribute('data-cat');var ind=cell.getAttribute('data-ind');
      if(state.category===cat&&state.industry===ind){state.category=null;state.industry=null;}
      else{state.category=cat;state.industry=ind;}
      renderAll();
    });
  });
}
function renderSidebar(){
  var catCounts={};
  NEWS_DATA.forEach(function(item){catCounts[item.category]=(catCounts[item.category]||0)+1;});
  var catList=document.getElementById('categoryList');
  catList.innerHTML=Object.keys(catCounts).sort().map(function(cat){
    return '<li data-category="'+escapeHtml(cat)+'" class="'+(state.category===cat?'active':'')+'">'+escapeHtml(cat)+' <span class="count">'+catCounts[cat]+'</span></li>';
  }).join('');
  var dateCounts={};var dateOrder=[];
  NEWS_DATA.forEach(function(item){if(!dateCounts[item.date]){dateCounts[item.date]=0;dateOrder.push(item.date);}dateCounts[item.date]++;});
  dateOrder.sort().reverse();
  var dateList=document.getElementById('dateList');
  dateList.innerHTML=dateOrder.map(function(d){
    return '<li data-date="'+d+'" class="'+(state.date===d?'active':'')+'">'+d+' <span class="count">'+dateCounts[d]+'</span></li>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#categoryList li'),function(li){
    li.addEventListener('click',function(){var c=li.getAttribute('data-category');state.category=(state.category===c?null:c);renderAll();});
  });
  Array.prototype.forEach.call(document.querySelectorAll('#dateList li'),function(li){
    li.addEventListener('click',function(){var d=li.getAttribute('data-date');state.date=(state.date===d?null:d);renderAll();});
  });
}
function matchesQuery(item,q){if(!q)return true;var hay=(item.title+' '+(item.summary||'')).toLowerCase();return hay.indexOf(q.toLowerCase())!==-1;}
function renderChips(){
  var chips=[];
  if(state.category)chips.push(['category','카테고리: '+state.category]);
  if(state.industry)chips.push(['industry','산업군: '+state.industry]);
  if(state.date)chips.push(['date','날짜: '+state.date]);
  if(state.query)chips.push(['query','검색: '+state.query]);
  if(state.core)chips.push(['core','⭐ 핵심']);
  if(state.starred)chips.push(['starred','⭐ 주간 선정']);
  var box=document.getElementById('activeChips');
  box.innerHTML=chips.map(function(c){return '<span class="chip" data-k="'+c[0]+'">'+escapeHtml(c[1])+' <b>×</b></span>';}).join('')+(chips.length>1?'<span class="chip clear" data-k="all">전체 해제</span>':'');
  Array.prototype.forEach.call(box.querySelectorAll('.chip'),function(el){
    el.addEventListener('click',function(){
      var k=el.getAttribute('data-k');
      if(k==='all'){state.category=null;state.industry=null;state.date=null;state.query='';state.core=false;state.starred=false;document.getElementById('searchInput').value='';}
      else if(k==='query'){state.query='';document.getElementById('searchInput').value='';}
      else if(k==='core'||k==='starred'){state[k]=false;}
      else{state[k]=null;}
      renderAll();
    });
  });
  document.getElementById('coreBtn').className='qbtn'+(state.core?' on':'');
  document.getElementById('starBtn').className='qbtn'+(state.starred?' on':'');
}
function renderCards(){
  var filtered=NEWS_DATA.filter(function(item){
    if(state.category&&item.category!==state.category)return false;
    if(state.industry&&item.industry!==state.industry)return false;
    if(state.date&&item.date!==state.date)return false;
    if(state.core&&!item.core)return false;
    if(state.starred&&!item.starred)return false;
    if(!matchesQuery(item,state.query))return false;
    return true;
  });
  var sig=JSON.stringify([state.category,state.industry,state.date,state.query,state.core,state.starred]);
  if(sig!==lastSig){state.limit=PAGE;lastSig=sig;}
  renderChips();
  var shown=filtered.slice(0,state.limit);
  document.getElementById('resultCount').textContent=filtered.length+'건 중 '+shown.length+'건 표시 중';
  document.getElementById('cardsContainer').innerHTML=shown.map(function(item){
    var img=item.infographic?'<a href="'+escapeHtml(item.infographic)+'" target="_blank" title="클릭하면 원본 크기"><img class="card-img info" loading="lazy" src="'+escapeHtml(item.infographic)+'" alt="기사 인포그래픽"></a>':(item.cardImagePath?'<img class="card-img" src="'+escapeHtml(item.cardImagePath)+'" alt="">':'');
    return '<div class="card">'+img+
      '<a class="title" href="'+escapeHtml(item.link)+'" target="_blank" rel="noopener">'+escapeHtml(item.title)+'</a>'+
      '<div class="meta">'+escapeHtml(item.source)+' · '+item.date+' · <span class="tag">'+escapeHtml(item.category)+'</span> · <span class="tag">'+escapeHtml(item.industry)+'</span>'+(item.starred?' <span class="tag star">⭐ 주간 선정</span>':'')+(item.core?' <span class="tag core">핵심</span>':'')+'</div>'+
      (item.summary?'<div class="summary">'+escapeHtml(item.summary)+'</div>':'')+
      '<button class="del-btn" data-hash="'+escapeHtml(item.hash)+'" onclick="deleteArticle(this)">🗑 삭제</button>'+
    '</div>';
  }).join('');
  var more=document.getElementById('moreWrap');
  if(filtered.length>shown.length){
    more.innerHTML='<button id="moreBtn" class="more-btn">더 보기 ('+(filtered.length-shown.length)+'건 남음)</button>';
    document.getElementById('moreBtn').addEventListener('click',function(){state.limit+=PAGE;renderCards();});
  }else{more.innerHTML='';}
}
function deleteArticle(btn){
  var hash=btn.getAttribute('data-hash');
  if(!hash){alert('삭제할 수 없는 항목입니다 (해시 없음)');return;}
  if(!confirm('이 기사를 삭제할까요? 되돌릴 수 없습니다.'))return;
  btn.disabled=true;btn.textContent='삭제 중...';
  fetch(WEBAPP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'delete_news', secret: DELETE_SECRET, hash: hash})
  }).then(function(r){return r.text();}).then(function(txt){
    var card = btn.closest('.card');
    if (card) card.remove();
    NEWS_DATA=NEWS_DATA.filter(function(x){return x.hash!==hash;});
  }).catch(function(err){
    alert('삭제 요청 중 오류가 발생했습니다.');
    btn.disabled=false;btn.textContent='🗑 삭제';
  });
}
function renderAll(){renderMatrix();renderSidebar();renderCards();}
document.getElementById('searchInput').addEventListener('input',function(e){state.query=e.target.value;renderCards();});
document.getElementById('resetBtn').addEventListener('click',function(){state.category=null;state.date=null;state.industry=null;state.query='';state.core=false;state.starred=false;document.getElementById('searchInput').value='';renderAll();});
document.getElementById('coreBtn').addEventListener('click',function(){state.core=!state.core;renderAll();});
document.getElementById('starBtn').addEventListener('click',function(){state.starred=!state.starred;renderAll();});
function startApp(){renderStats();renderAll();}
// 뉴스 데이터는 HTML에 내장하지 않고 data/news.json 을 비동기로 불러옴 (페이지 용량·발행 부하 감소)
fetch('data/news.json?v='+BUILD_TS,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(d){NEWS_DATA=d;startApp();})
  .catch(function(e){document.getElementById('cardsContainer').innerHTML='<div class="card">뉴스 데이터를 불러오지 못했습니다. ('+escapeHtml(String(e))+')</div>';});

</script></body></html>
